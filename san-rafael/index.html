const T={
it:{
title:`Novena a San Raffaele Arcangelo`,
sub:`Medicina di Dio · compagno del cammino`,
back:`← Tutte le novene`,
smaller:`Testo più piccolo`, bigger:`Testo più grande`,
foot:`La novena tradizionale è pubblicata dalla Parrocchia San Raffaele Arcangelo di Roma.<br>I box scuri contengono aggiunte personali ispirate al Libro di Tobia.<br>Festa dei Santi Arcangeli: 29 settembre.`,
TRAD:[
`O pietoso Arcangelo San Raffaele, soccorso di coloro che con le opere di misericordia, attirano la benevolenza di Dio, fa’ che anche noi mai dimentichiamo chi soffre, chi è abbandonato e solo.`,
`O benigno Arcangelo San Raffaele, Medicina di Dio nel corpo, sollevaci dalle infermità, donaci la forza di offrire a Dio ogni sofferenza per il bene delle anime, preserva il nostro corpo dall’impurità, perché sia tempio della Santissima Trinità.`,
`O potente Arcangelo San Raffaele, Medicina di Dio nell’anima, guariscici da ogni ferita, paura, angoscia e allontana da noi la cecità del peccato e dell’errore.`,
`O nobile Arcangelo San Raffaele, Medicina di Dio nello spirito, tu che stai sempre dinanzi al trono dell’Altissimo, aiuta anche noi a conseguire la gioia della salvezza eterna, sventando le insidie dell’avversario.`,
`O sapiente Arcangelo San Raffaele, che accompagnasti Tobia nel suo difficile viaggio, guida i giovani nella scelta della loro “vocazione”, preparali nella purezza e nella preghiera e guida i loro educatori nella scelta del loro stato di vita.`,
`O premuroso Arcangelo San Raffaele, che conducesti Tobia da Sara, liberandola dalle vessazioni sataniche, aiuta le famiglie ad essere sante, caste, aperte alla speranza e al dono della vita.`,
`O provvido Arcangelo San Raffaele, che aiutasti Tobia a riscuotere i suoi crediti, aiuta noi e ogni famiglia nelle difficoltà materiali e fa’ che ci serviamo del denaro saggiamente, per conquistare la vera ricchezza.`,
`O benevolo Arcangelo San Raffaele, figura del Padre Misericordioso che sapientemente guida ogni esistenza, di Gesù Buon Pastore, del Paraclito che sempre ci sostiene, fa’ che nella nostra vita confidiamo nell’Amore di Dio e ci abbandoniamo con fiducia alla Sua santa volontà.`,
`O dolce Arcangelo San Raffaele, la tua potente intercessione porti in noi, nelle famiglie, nel mondo intero la pace; conduci noi tutti alla guarigione totale, a Gesù Eucaristia, fonte di ogni guarigione.`
],
REFR:`San Raffaele Arcangelo, con la tua luce illuminaci.
San Raffaele Arcangelo, con le tue ali proteggici.
San Raffaele Arcangelo, con la tua medicina guariscici.`,
PATER:`Padre nostro, che sei nei cieli, sia santificato il tuo nome, venga il tuo regno, sia fatta la tua volontà, come in cielo così in terra. Dacci oggi il nostro pane quotidiano, e rimetti a noi i nostri debiti come anche noi li rimettiamo ai nostri debitori, e non abbandonarci alla tentazione, ma liberaci dal male. Amen.`,
AVE:`Ave, o Maria, piena di grazia, il Signore è con te. Tu sei benedetta fra le donne e benedetto è il frutto del tuo seno, Gesù. Santa Maria, Madre di Dio, prega per noi peccatori, adesso e nell’ora della nostra morte. Amen.`,
GLORIA:`Gloria al Padre e al Figlio e allo Spirito Santo. Come era nel principio, e ora e sempre, nei secoli dei secoli. Amen.`,
DAYS:[
{t:`Dio ascolta chi lo invoca`,ref:`Tobia 3`,
s:`Nello stesso giorno Tobi, cieco e umiliato, e la giovane Sara, ferita dal dolore e dal disprezzo, si rivolgono a Dio. Le loro preghiere salgono insieme davanti alla sua gloria, e Dio manda Raffaele a guarire entrambi.`,
p:`O San Raffaele, tu hai portato davanti a Dio la preghiera di Tobi e di Sara nel giorno in cui sembrava non esserci più speranza. Porta anche la mia preghiera così com’è: povera, stanca, a volte confusa. Insegnami a credere che nessun grido sale al Cielo senza essere ascoltato, e che il Padre prepara la risposta già mentre io lo invoco. Amen.`,
o:`Dedica cinque minuti di silenzio a presentare a Dio, con sincerità, ciò che oggi ti pesa.`},
{t:`Il compagno di viaggio`,ref:`Tobia 5`,
s:`Tobia deve partire per un lungo viaggio e cerca qualcuno che conosca la strada. Sulla porta trova un giovane pronto ad accompagnarlo, senza sapere che è un angelo del Signore.`,
p:`O San Raffaele, che ti sei fatto compagno di strada di Tobia senza farti riconoscere, cammina anche accanto a me. Nelle scelte che devo fare, quando non conosco la via, fammi incontrare le persone giuste e dammi luce per distinguere il bene. Rendimi a mia volta un compagno buono per chi cammina con me. Amen.`,
o:`Ringrazia Dio per una persona che ti ha accompagnato in un tratto difficile della vita, e se puoi diglielo.`},
{t:`Non avere paura`,ref:`Tobia 6,1-9`,
s:`Lungo il fiume Tigri un grosso pesce balza verso Tobia. L’angelo gli dice di afferrarlo: ciò che lo spaventava diventerà rimedio per la guarigione.`,
p:`O San Raffaele, sulle rive del Tigri hai insegnato a Tobia a non fuggire davanti a ciò che lo spaventava, ma ad affrontarlo con fiducia. Tu conosci le mie paure, quelle che dico e quelle che nascondo. Aiutami ad affrontarle con coraggio, sapendo che nelle mani di Dio anche la prova può diventare medicina. Amen.`,
o:`Affronta oggi una piccola cosa che rimandi per timore.`},
{t:`Liberazione dal male`,ref:`Tobia 6,10 – 8,3`,
s:`Sara ha visto morire sette mariti per opera di un demonio. Seguendo le indicazioni di Raffaele, Tobia la sposa senza timore, e lo spirito maligno viene cacciato lontano e legato.`,
p:`O San Raffaele, che hai scacciato lo spirito maligno che tormentava Sara, difendi me e la mia casa da ogni insidia del nemico. Libera il mio cuore da ciò che lo tiene prigioniero: rancori, abitudini sbagliate, pensieri di sconforto. Fa’ che io cerchi la mia forza non in me stesso, ma nella preghiera e nei sacramenti. Amen.`,
o:`Se ti è possibile, accostati alla Confessione durante questa novena.`},
{t:`La preghiera degli sposi`,ref:`Tobia 8,4-9`,
s:`La sera delle nozze Tobia e Sara si alzano insieme a pregare. Benedicono Dio, gli chiedono misericordia e la grazia di invecchiare insieme.`,
p:`O San Raffaele, che hai preparato l’incontro tra Tobia e Sara e hai custodito la loro unione, benedici le famiglie, i fidanzati e chi cerca la persona con cui condividere la vita. Proteggi il mio amore e quello delle persone che mi sono care. Insegnaci, come a Tobia e Sara, a mettere Dio al centro e a pregare insieme. Amen.`,
o:`Prega oggi per una coppia o una famiglia in difficoltà, chiamandola per nome.`},
{t:`Il pane di ogni giorno`,ref:`Tobia 9`,
s:`Mentre si celebrano le nozze, Raffaele va da Gabael a riprendere il denaro che Tobi gli aveva affidato anni prima, perché la famiglia non manchi del necessario.`,
p:`O San Raffaele, che ti sei preso cura anche del denaro affidato a Gabael, guarda alle mie necessità concrete: il lavoro, la casa, le spese, le preoccupazioni per il domani. Rendimi onesto e generoso con quello che ho, e aiutami a fidarmi della provvidenza del Padre. Amen.`,
o:`Fai un’elemosina o un gesto concreto per qualcuno che è nel bisogno.`},
{t:`Chi attende a casa`,ref:`Tobia 10 – 11,6`,
s:`Anna, la madre di Tobia, ogni giorno scruta la strada aspettando il figlio e teme di averlo perduto. Finalmente lo vede tornare da lontano.`,
p:`O San Raffaele, che hai ricondotto Tobia sano e salvo alla madre che lo aspettava in lacrime, proteggi chi è in viaggio e chi vive lontano da casa. Consola chi attende un figlio, un amico, una riconciliazione. Riporta a Dio chi si è allontanato, e dona a chi aspetta la pazienza della speranza. Amen.`,
o:`Contatta una persona lontana che non senti da tempo.`},
{t:`Dio guarisce`,ref:`Tobia 11,7-15`,
s:`Tornato a casa, Tobia applica agli occhi del padre il rimedio indicato dall’angelo. Tobi torna a vedere, abbraccia il figlio e benedice Dio.`,
p:`O San Raffaele, medicina di Dio, che hai ridato la vista a Tobi, ti affido chi è malato nel corpo, nella mente o nello spirito [nomina qui le persone]. Se è la volontà del Padre, ottieni loro la guarigione; altrimenti la forza, la pace e la vicinanza di chi li cura. Apri anche i miei occhi, perché veda la mano di Dio nella mia vita. Amen.`,
o:`Visita, chiama o scrivi a una persona malata.`},
{t:`Benedite Dio`,ref:`Tobia 12`,
s:`Quando Tobi e Tobia vogliono ricompensarlo, Raffaele rivela chi è: uno dei sette angeli che stanno davanti al Signore. Li invita a benedire Dio, a pregare e a fare il bene, poi scompare dalla loro vista.`,
p:`O San Raffaele, che al termine del viaggio non hai voluto ricompense ma hai chiesto di benedire Dio, insegnami la gratitudine. Ti ringrazio per le grazie di questa novena, anche per quelle che ancora non vedo. Resta mio compagno fino all’ultimo viaggio, quello che mi condurrà alla casa del Padre, dove con te e con tutti gli angeli canterò la sua lode per sempre. Amen.`,
o:`Scrivi tre cose per cui vuoi ringraziare Dio.`}
],

es:{
title:`Novena a San Rafael Arcángel`,
sub:`Medicina de Dios · compañero del camino`,
back:`← Todas las novenas`,
smaller:`Texto más pequeño`, bigger:`Texto más grande`,
foot:`La novena tradicional está publicada por la Parroquia San Raffaele Arcangelo de Roma; el texto está traducido del italiano.<br>Los recuadros oscuros contienen añadidos personales inspirados en el Libro de Tobías.<br>Fiesta de los Santos Arcángeles: 29 de septiembre.`,
TRAD:[
`Oh piadoso Arcángel San Rafael, auxilio de quienes con las obras de misericordia atraen la benevolencia de Dios, haz que tampoco nosotros olvidemos nunca a quien sufre, a quien está abandonado y solo.`,
`Oh benigno Arcángel San Rafael, Medicina de Dios en el cuerpo, alívianos de las enfermedades, danos la fuerza de ofrecer a Dios todo sufrimiento por el bien de las almas, preserva nuestro cuerpo de la impureza, para que sea templo de la Santísima Trinidad.`,
`Oh poderoso Arcángel San Rafael, Medicina de Dios en el alma, cúranos de toda herida, miedo y angustia, y aleja de nosotros la ceguera del pecado y del error.`,
`Oh noble Arcángel San Rafael, Medicina de Dios en el espíritu, tú que estás siempre ante el trono del Altísimo, ayúdanos también a nosotros a alcanzar la alegría de la salvación eterna, desbaratando las asechanzas del adversario.`,
`Oh sabio Arcángel San Rafael, que acompañaste a Tobías en su difícil viaje, guía a los jóvenes en la elección de su «vocación», prepáralos en la pureza y en la oración, y guía a sus educadores en la elección de su estado de vida.`,
`Oh solícito Arcángel San Rafael, que condujiste a Tobías hasta Sara, liberándola de las vejaciones satánicas, ayuda a las familias a ser santas, castas, abiertas a la esperanza y al don de la vida.`,
`Oh providente Arcángel San Rafael, que ayudaste a Tobías a cobrar sus créditos, ayúdanos a nosotros y a cada familia en las dificultades materiales, y haz que usemos el dinero con sabiduría, para conquistar la verdadera riqueza.`,
`Oh benévolo Arcángel San Rafael, figura del Padre Misericordioso que sabiamente guía toda existencia, de Jesús Buen Pastor, del Paráclito que siempre nos sostiene, haz que en nuestra vida confiemos en el Amor de Dios y nos abandonemos con confianza a Su santa voluntad.`,
`Oh dulce Arcángel San Rafael, que tu poderosa intercesión traiga la paz a nosotros, a las familias, al mundo entero; condúcenos a todos a la sanación total, a Jesús Eucaristía, fuente de toda sanación.`
],
REFR:`San Rafael Arcángel, con tu luz ilumínanos.
San Rafael Arcángel, con tus alas protégenos.
San Rafael Arcángel, con tu medicina cúranos.`,
PATER:`Padre nuestro, que estás en el cielo, santificado sea tu Nombre; venga a nosotros tu reino; hágase tu voluntad en la tierra como en el cielo. Danos hoy nuestro pan de cada día; perdona nuestras ofensas, como también nosotros perdonamos a los que nos ofenden; no nos dejes caer en la tentación, y líbranos del mal. Amén.`,
AVE:`Dios te salve, María, llena eres de gracia, el Señor es contigo. Bendita tú eres entre todas las mujeres, y bendito es el fruto de tu vientre, Jesús. Santa María, Madre de Dios, ruega por nosotros, pecadores, ahora y en la hora de nuestra muerte. Amén.`,
GLORIA:`Gloria al Padre y al Hijo y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén.`,
DAYS:[
{t:`Dios escucha a quien lo invoca`,ref:`Tb 3`,
s:`El mismo día, Tobit, ciego y humillado, y la joven Sara, herida por el dolor y el desprecio, se dirigen a Dios. Sus oraciones suben juntas ante su gloria, y Dios envía a Rafael a curar a ambos.`,
p:`Oh San Rafael, tú llevaste ante Dios la oración de Tobit y de Sara el día en que parecía que ya no quedaba esperanza. Lleva también mi oración tal como es: pobre, cansada, a veces confusa. Enséñame a creer que ningún grito sube al Cielo sin ser escuchado, y que el Padre prepara la respuesta ya mientras yo lo invoco. Amén.`,
o:`Dedica cinco minutos de silencio a presentar a Dios, con sinceridad, lo que hoy te pesa.`},
{t:`El compañero de viaje`,ref:`Tb 5`,
s:`Tobías tiene que emprender un largo viaje y busca a alguien que conozca el camino. En la puerta encuentra a un joven dispuesto a acompañarlo, sin saber que es un ángel del Señor.`,
p:`Oh San Rafael, que te hiciste compañero de camino de Tobías sin darte a conocer, camina también a mi lado. En las decisiones que tengo que tomar, cuando no conozco el camino, haz que encuentre a las personas adecuadas y dame luz para distinguir el bien. Hazme a mi vez un buen compañero para quien camina conmigo. Amén.`,
o:`Da gracias a Dios por una persona que te acompañó en un tramo difícil de la vida y, si puedes, díselo.`},
{t:`No tengas miedo`,ref:`Tb 6,1-9`,
s:`A orillas del río Tigris, un gran pez salta hacia Tobías. El ángel le dice que lo agarre: lo que lo asustaba se convertirá en remedio para la curación.`,
p:`Oh San Rafael, a orillas del Tigris enseñaste a Tobías a no huir ante lo que lo asustaba, sino a afrontarlo con confianza. Tú conoces mis miedos, los que digo y los que escondo. Ayúdame a afrontarlos con valentía, sabiendo que en las manos de Dios también la prueba puede convertirse en medicina. Amén.`,
o:`Afronta hoy una pequeña cosa que vas aplazando por miedo.`},
{t:`Liberación del mal`,ref:`Tb 6,10 – 8,3`,
s:`Sara ha visto morir a siete maridos por obra de un demonio. Siguiendo las indicaciones de Rafael, Tobías se casa con ella sin temor, y el espíritu maligno es expulsado lejos y atado.`,
p:`Oh San Rafael, que expulsaste al espíritu maligno que atormentaba a Sara, defiéndeme a mí y a mi casa de toda asechanza del enemigo. Libera mi corazón de lo que lo tiene prisionero: rencores, malos hábitos, pensamientos de desaliento. Haz que busque mi fuerza no en mí mismo, sino en la oración y en los sacramentos. Amén.`,
o:`Si te es posible, acércate a la Confesión durante esta novena.`},
{t:`La oración de los esposos`,ref:`Tb 8,4-9`,
s:`La noche de bodas, Tobías y Sara se levantan juntos a orar. Bendicen a Dios, le piden misericordia y la gracia de envejecer juntos.`,
p:`Oh San Rafael, que preparaste el encuentro entre Tobías y Sara y custodiaste su unión, bendice a las familias, a los novios y a quien busca a la persona con quien compartir la vida. Protege mi amor y el de las personas que quiero. Enséñanos, como a Tobías y Sara, a poner a Dios en el centro y a orar juntos. Amén.`,
o:`Reza hoy por una pareja o una familia en dificultades, llamándola por su nombre.`},
{t:`El pan de cada día`,ref:`Tb 9`,
s:`Mientras se celebran las bodas, Rafael va a casa de Gabael a recuperar el dinero que Tobit le había confiado años atrás, para que a la familia no le falte lo necesario.`,
p:`Oh San Rafael, que te ocupaste también del dinero confiado a Gabael, mira mis necesidades concretas: el trabajo, la casa, los gastos, las preocupaciones por el mañana. Hazme honrado y generoso con lo que tengo, y ayúdame a fiarme de la providencia del Padre. Amén.`,
o:`Da una limosna o haz un gesto concreto por alguien que lo necesita.`},
{t:`Quien espera en casa`,ref:`Tb 10 – 11,6`,
s:`Ana, la madre de Tobías, escruta cada día el camino esperando a su hijo y teme haberlo perdido. Por fin lo ve volver a lo lejos.`,
p:`Oh San Rafael, que devolviste a Tobías sano y salvo a su madre, que lo esperaba llorando, protege a quien está de viaje y a quien vive lejos de casa. Consuela a quien espera a un hijo, a un amigo, una reconciliación. Devuelve a Dios a quien se ha alejado, y concede a quien espera la paciencia de la esperanza. Amén.`,
o:`Ponte en contacto con una persona lejana con la que hace tiempo que no hablas.`},
{t:`Dios cura`,ref:`Tb 11,7-15`,
s:`De vuelta en casa, Tobías aplica en los ojos de su padre el remedio indicado por el ángel. Tobit recupera la vista, abraza a su hijo y bendice a Dios.`,
p:`Oh San Rafael, medicina de Dios, que devolviste la vista a Tobit, te encomiendo a quien está enfermo en el cuerpo, en la mente o en el espíritu [nombra aquí a las personas]. Si es la voluntad del Padre, obtenles la curación; si no, la fuerza, la paz y la cercanía de quien los cuida. Abre también mis ojos, para que vea la mano de Dios en mi vida. Amén.`,
o:`Visita, llama o escribe a una persona enferma.`},
{t:`Bendecid a Dios`,ref:`Tb 12`,
s:`Cuando Tobit y Tobías quieren recompensarlo, Rafael revela quién es: uno de los siete ángeles que están ante el Señor. Los invita a bendecir a Dios, a orar y a hacer el bien, y después desaparece de su vista.`,
p:`Oh San Rafael, que al final del viaje no quisiste recompensas, sino que pediste bendecir a Dios, enséñame la gratitud. Te doy gracias por las gracias de esta novena, también por las que aún no veo. Sigue siendo mi compañero hasta el último viaje, el que me llevará a la casa del Padre, donde contigo y con todos los ángeles cantaré su alabanza para siempre. Amén.`,
o:`Escribe tres cosas por las que quieres dar gracias a Dios.`}
],

function load(k,def){try{const v=localStorage.getItem(k);if(v===null)return def;try{return JSON.parse(v)}catch(e){return v}}catch(e){return def}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

const qs=new URLSearchParams(location.search).get('lang');
const stored=load('novenas-lang',null);
let lang=(qs==='it'||qs==='es')?qs:(stored==='it'||stored==='es')?stored:((navigator.language||'').toLowerCase().startsWith('it')?'it':'es');
let day=1, intention='', done=new Set(), size=19;
const app=document.getElementById('app'), nav=document.getElementById('nav');
function fs(d){size=Math.min(26,Math.max(15,size+d));document.documentElement.style.setProperty('--fs',size+'px')}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function li(a,b){return `<li>${a} — <span class='r'>${b}</span></li>`}
function box(title,html){return `<details class='mine'><summary><span class='pm'></span><span><span class='tag'>${T[lang].tag}</span>${title}</span></summary><div class='in'>${html}</div></details>`}
function drawNav(){nav.innerHTML=T[lang].DAYS.map((_,i)=>`<button class='${i+1===day?'on':''}' onclick='go(${i+1})'>${i+1}</button>`).join('');const b=nav.children[day-1];b&&b.scrollIntoView({inline:'center',block:'nearest'})}
function go(n){day=n;done=new Set();drawNav();render();window.scrollTo({top:0,behavior:'smooth'})}
function setInt(v){intention=v;const s=document.getElementById('intShow');if(s)s.textContent=v.trim()?v.trim():T[lang].intEmpty}
function tog(i){done.has(i)?done.delete(i):done.add(i);document.querySelectorAll('.bead')[i].classList.toggle('done');document.getElementById('bar').style.width=(done.size/T[lang].BEADS.length*100)+'%';document.getElementById('cnt').textContent=done.size}
function setLang(l){
  if(l!=='it'&&l!=='es')return;
  const open=[...app.querySelectorAll('details')].map(d=>d.open);
  lang=l;save('novenas-lang',l);
  try{history.replaceState(null,'','?lang='+l)}catch(e){}
  paint();
  app.querySelectorAll('details').forEach((d,i)=>{if(open[i])d.open=true});
}
function paint(){
  const L=T[lang];
  document.documentElement.lang=lang;
  document.title=L.title;
  document.getElementById('h1').textContent=L.title;
  document.getElementById('sub').textContent=L.sub;
  const bk=document.getElementById('back');bk.textContent=L.back;bk.href='../?lang='+lang;
  document.getElementById('foot').innerHTML=L.foot;
  document.getElementById('fsMinus').setAttribute('aria-label',L.smaller);
  document.getElementById('fsPlus').setAttribute('aria-label',L.bigger);
  document.getElementById('bES').className=lang==='es'?'on':'';
  document.getElementById('bIT').className=lang==='it'?'on':'';
  document.getElementById('bES').setAttribute('aria-pressed',lang==='es');
  document.getElementById('bIT').setAttribute('aria-pressed',lang==='it');
  drawNav();render();
}
function render(){
const L=T[lang], d=L.DAYS[day-1], tr=(L.TRAD[day-1]||'').trim(), G=L.GLORIA, B=L.BEADS;
app.innerHTML=`
<section class='card'>
  <div class='label'>${L.intLabel}</div>
  <textarea placeholder='${L.intPh}' oninput='setInt(this.value)'>${esc(intention)}</textarea>
  <p class='rubric'>${L.intNote}</p>
</section>

  <p>${G}</p>
  ${box(L.offerTitle,`<p>${L.offerA}<span class='int' id='intShow'>${intention.trim()?esc(intention.trim()):L.intEmpty}</span>${L.offerB}</p>`)}
</section>

<section class='card'>
  <div class='label'>${L.dayOf(day)}</div>
  <h2>${L.dayPrayer}</h2>
  <p class='trad'>${tr}</p>
  <p>${G}</p>
  <p class='trad refr'>${L.REFR}</p>
  <p class='rubric'>${L.src(FONTE)}</p>
  ${box(L.tobBox(d.t),`<div class='ref'>📖 ${d.ref}</div><p class='story'>${d.s}</p><p>${d.p}</p><div class='prop'><b>${L.resolve}</b>${d.o}</div>`)}
</section>

<section class='card'>
  <div class='label'>${L.crownLabel}</div>
  <h2>${L.crownH}</h2>
  <p class='rubric'>${L.crownNote}</p>
  ${box(L.crownBox,`<p class='mrub'>${L.crownHow}</p><div class='progress'><i id='bar' style='width:${done.size/B.length*100}%'></i></div><p class='mrub'><span id='cnt'>${done.size}</span> ${L.of} ${B.length}</p>${B.map((b,i)=>`<button class='bead${done.has(i)?' done':''}' data-n='${i+1}' onclick='tog(${i})'><strong>${b[0]}</strong>${b[1]}<div class='after'>${L.after}</div></button>`).join('')}<h3>${L.crownEndH}</h3><p>${L.crownEnd}</p>`)}
  <details class='std'><summary>${L.stdSum}</summary><p>${L.PATER}</p><p>${L.AVE}</p><p>${G}</p></details>
</section>

<section class='card'>
  <div class='label'>${L.litLabel}</div>
  <h2>${L.litH}</h2>
  <ul class='lit'>${L.LIT_OPEN.map(x=>li(x[0],x[1])).join('')}</ul>
  ${box(L.litBox,`<ul class='lit'>${L.LIT_INV.map(x=>li(x,L.pray)).join('')}</ul>`)}
  <ul class='lit' style='margin-top:12px'>${L.LIT_END.map(x=>li(x[0],x[1])).join('')}
    <li><span class='v'>V.</span>${L.litV}<br><span class='v'>R.</span>${L.litR}</li>
  </ul>
  <h3>${L.letUs}</h3>
  <p>${L.collect}</p>
  <p class='rubric'>${L.collectSrc}</p>
</section>

<section class='card'>
  <div class='label'>${L.endLabel}</div>
  <p>${L.subTuum}</p>
  ${box(L.thanksTitle,`<p>${L.thanks}</p>`)}
  <p style='margin-top:14px'><span class='v'>V.</span>${L.blessV}<br><span class='v'>R.</span>${L.blessR}</p>
  <p><span class='v'>✝</span>${L.sign}</p>
</section>

<div class='pager'>
  <button onclick='go(${day-1})' ${day===1?'disabled':''}>${L.prev(Math.max(1,day-1))}</button>
  <button onclick='go(${day+1})' ${day===9?'disabled':''}>${L.next(Math.min(9,day+1))}</button>
</div>`;
}
paint();
</script>
</body>
</html>
