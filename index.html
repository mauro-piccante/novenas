<!DOCTYPE html>
<html lang='es'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover'>
<meta name='theme-color' content='#3a2c26'>
<title>Novenas</title>
<link rel='icon' href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233a2c26'/%3E%3Cpath d='M16 7v18M10 13h12' stroke='%23e2c07e' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel='preconnect' href='https://fonts.googleapis.com'>
<link href='https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap' rel='stylesheet'>
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#2a2620;--muted:#7a6f60;--gold:#b0833a;--line:#e6dccb}
@media (prefers-color-scheme:dark){:root{--bg:#14110e;--card:#1e1a16;--ink:#ece6da;--muted:#a79f90;--gold:#d9b06a;--line:#322b23}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom);min-height:100vh}
header{background:linear-gradient(160deg,#2a201b,#3a2c26 55%,#55402f);color:#f7f1e3;padding:calc(54px + env(safe-area-inset-top)) 20px 26px;text-align:center;position:relative}
header .cross{font-size:22px;color:#e2c07e;letter-spacing:.3em}
header h1{font-weight:600;font-size:2em;line-height:1.1;margin:6px 0 4px}
header p{font-style:italic;opacity:.85}
.tools{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;display:flex;gap:6px}
.tools button{background:rgba(255,255,255,.14);border:0;color:#fff;font:600 13px Inter,sans-serif;border-radius:8px;padding:6px 9px;cursor:pointer}
.tools button.on{background:#f7f1e3;color:#3a2c26}
main{max-width:560px;margin:0 auto;padding:20px 16px 30px;display:grid;gap:14px}
a.n{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;text-decoration:none;color:inherit;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:transform .15s,box-shadow .15s}
a.n:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.08)}
a.n:active{transform:scale(.99)}
.ic{flex:0 0 52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:22px;background:var(--c)}
.tx{flex:1;min-width:0}
.tx strong{display:block;font-size:1.15em;font-weight:600;line-height:1.2;color:var(--c2,var(--ink))}
.tx span{display:block;font:500 12px/1.5 Inter,sans-serif;color:var(--muted);margin-top:4px;letter-spacing:.02em}
.ar{font:400 22px Inter,sans-serif;color:var(--muted)}
footer{text-align:center;font:400 12px/1.6 Inter,sans-serif;color:var(--muted);padding:0 20px 30px}
</style>
</head>
<body>
<header>
  <div class='tools'><button id='bES' onclick='setLang("es")'>ES</button><button id='bIT' onclick='setLang("it")'>IT</button></div>
  <div class='cross'>✦ ✝ ✦</div>
  <h1 id='h1'></h1>
  <p id='sub'></p>
</header>
<main id='list'></main>
<footer id='foot'></footer>
<script>
const N=[
 {slug:'desatanudos',c:'#a4232c',ic:'∞',
  es:['Novena a María Desatanudos','9 días'],
  it:['Novena a Maria che scioglie i nodi','9 giorni']},
 {slug:'san-jose',c:'#6b4423',ic:'✿',
  es:['Treintena a San José','30 días · Fiesta: 19 de marzo'],
  it:['Trentena a San Giuseppe','30 giorni · Festa: 19 marzo']},
 {slug:'san-rafael',c:'#1f5a47',ic:'✧',
  es:['Novena a San Rafael Arcángel','9 días · Fiesta: 29 de septiembre'],
  it:['Novena a San Raffaele Arcangelo','9 giorni · Festa: 29 settembre']},
 {slug:'santa-teresita',c:'#8e3448',ic:'🌹',
  es:['Novena de las Rosas a Santa Teresita','9 días · Fiesta: 1 de octubre'],
  it:['Novena delle Rose a Santa Teresa di Gesù Bambino','9 giorni · Festa: 1 ottobre']}
];
const T={
 es:{title:'Novenas',sub:'Para rezar día a día',foot:'Cada oración en español e italiano.<br>Lo que marcas se guarda solo en este dispositivo.'},
 it:{title:'Novene',sub:'Da pregare giorno per giorno',foot:'Ogni preghiera in spagnolo e italiano.<br>Ciò che segni resta solo su questo dispositivo.'}
};
function load(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const qs=new URLSearchParams(location.search).get('lang');
let lang=(qs==='es'||qs==='it')?qs:load('novenas-lang',(navigator.language||'').toLowerCase().startsWith('it')?'it':'es');
if(lang!=='es'&&lang!=='it')lang='es';
function setLang(l){lang=l;save('novenas-lang',l);try{history.replaceState(null,'','?lang='+l)}catch(e){}paint()}
function paint(){
 const L=T[lang];
 document.documentElement.lang=lang;document.title=L.title;
 document.getElementById('h1').textContent=L.title;
 document.getElementById('sub').textContent=L.sub;
 document.getElementById('foot').innerHTML=L.foot;
 document.getElementById('bES').className=lang==='es'?'on':'';
 document.getElementById('bIT').className=lang==='it'?'on':'';
 document.getElementById('list').innerHTML=N.map(n=>`<a class='n' href='./${n.slug}/?lang=${lang}' style='--c:${n.c}'><span class='ic'>${n.ic}</span><span class='tx'><strong>${n[lang][0]}</strong><span>${n[lang][1]}</span></span><span class='ar'>›</span></a>`).join('');
}
paint();
</script>
</body>
</html>
