vento, sollevò il nastro nuziale dei coniugi Langenmantel, chiedendo che tutti i nodi venissero sciolti. Il nastro a cui si fa riferimento nel racconto era legato a una tradizione dell’epoca: durante la celebrazione del sacramento del matrimonio, le mani unite degli sposi venivano legate con un nastro bianco, preparato per l’occasione, come segno del nodo invisibile e indissolubile che li univa per tutta la vita. A ogni litigio, Sophie aveva fatto un piccolo nodo nel suo nastro nuziale; quello stesso nastro, pieno di nodi, fu consegnato al padre gesuita perché recitasse la sua preghiera speciale. I nodi si sciolsero miracolosamente e il nastro rimase bianco come il primo giorno di matrimonio.","Dopo questo, la coppia sperimentò gli effetti positivi della preghiera, evitando così il divorzio. Così il nastro – finalmente senza nodi – indicava il vincolo coniugale pacificato.","Passarono gli anni e il nipote di Wolfgang e Sophie, Hieronymus Ambrosius von Langenmantel (1641-1718), scelse la vita religiosa e divenne canonico della chiesa di Sankt Peter ad Augusta (1666-1709). Hieronymus decise di dedicare una delle cappelle della chiesa alla memoria della sua famiglia e, a tale scopo, commissionò una pala d’altare che raccontasse la storia del matrimonio dei suoi nonni, salvato grazie all’intercessione della Vergine Maria. L’altare fu dedicato a Nostra Signora del Buon Consiglio e il quadro fu commissionato a Johann Georg Melchior Schmidtner che, in questo dipinto così singolare e suggestivo, raffigurò la Vergine come colei che «scioglie i nodi del nastro nuziale»."]},{"titulo":"Descrizione del quadro","parrafos":["Ben visibile, nella parte alta del quadro, c’è una colomba, il simbolo più comune per rappresentare lo Spirito Santo, in riferimento al battesimo di Gesù nel Giordano (Mc 1,10; Mt 3,16; Lc 3,22; Gv 1,32). Nel nostro caso, lo Spirito è la forza dolce e soave che si effonde su Maria. Maria è tutta circondata dalla luce di Dio e vive in Dio. Questo simbolo manifesta chiaramente una condizione che riguarda tutto l’essere di Maria: lei è la «piena di grazia», colmata dell’amore di Dio. Possiamo cogliere la presenza dello Spirito Santo anche nel vento che muove il manto della Vergine. Anche se il vento non si vede, si fa sentire; non ha un volto da offrire al nostro sguardo, ma se ne avverte la presenza: è una forza che avvolge tutta la persona. Tutta la vita di Maria si svolge sotto l’azione dello Spirito Santo, di cui è sposa (Lc 1,35), per la maternità universale di tutti coloro che sono generati da Dio nella fede in Cristo.","L’immagine centrale è quella di una giovane donna, bella e dolcissima, a figura intera. Sulla spalla e sul fianco porta un manto azzurro, come mosso dal vento. A partire dal sec. XIII, la Chiesa stabilì che nei quadri, negli affreschi, nei mosaici e nelle vetrate, nelle icone e sugli altari, il manto di Maria dovesse essere azzurro, e più precisamente blu oltremare, il colore più raro e costoso nella tavolozza dei pittori medievali, ottenuto dalla polvere del prezioso lapislazzuli. Simboleggia così la trascendenza, la vita divina. Il manto azzurro che copre Maria è segno della grazia divina che la avvolse fin dal suo concepimento verginale. Il colore rosso, tratto dalla terra, indica la dimensione umana. La tunica rossa, la sua totale sottomissione alla volontà del Padre, che rese possibile l’incarnazione del Figlio. Per questo Maria ha la veste di colore rosso, perché è una creatura, ma il suo manto è azzurro per indicare che è la «piena di grazia», colmata dell’amore di Dio. Dal punto di vista umano, Maria è soltanto un’umile ragazza del popolo, non gode di alcun titolo o ruolo speciale nella società, ma nell’ordine della grazia lei è la tutta santa, la tutta bella; la sua mente, la sua volontà, il suo cuore sono aperti alla grazia di Dio, attenti a ogni ispirazione divina, in una completa disponibilità a compiere la sua volontà: «Ecco la serva del Signore» (Lc 1,38).","Sul capo Maria ha una corona di dodici stelle, simbolo di trionfo e di vittoria. Il numero dodici è, per tradizione, molto ricco di simboli: essendo il prodotto di tre (che simboleggia la divinità) per quattro (che simboleggia l’umanità), indica l’unione perfetta tra l’umano e il divino. Nel mondo ebraico, il dodici rappresentava la pienezza: dodici sono le tribù in cui si divide il popolo d’Israele, dodici sono gli apostoli scelti da Gesù; è un numero perfetto per indicare la grande famiglia dei credenti. La corona ricorda anche il capitolo 12 dell’Apocalisse, in cui si racconta la visione della lotta tra la donna e il drago. Si tratta della lotta tra il popolo di Dio, la Chiesa, e Satana. Ma dove c’è la Chiesa c’è Maria, e dove c’è Maria c’è la Chiesa; il grembo verginale e fecondo di Maria è il compendio della realtà della Chiesa, vergine feconda. Maria è primizia e immagine della Chiesa. Inoltre, la figura della donna è da una parte gloriosa, trionfante, e dall’altra ancora nell’afflizione. Così è, infatti, la Chiesa: se in cielo è già associata alla gloria del suo Signore, nella storia vive continuamente le prove e le sfide che comporta il conflitto tra Dio e il maligno, il nemico di sempre. In questa lotta, che i discepoli di Gesù devono affrontare, Maria non ci lascia soli. Anche se Maria è entrata una volta per sempre nella gloria del cielo, questo non vuol dire che sia lontana, separata da noi; al contrario, Maria ci accompagna, lotta con noi, sostiene i cristiani nel combattimento contro le forze del male. La preghiera con Maria, in particolare il Rosario, ha anche questa dimensione di «lotta», cioè è una preghiera che sostiene nella battaglia contro il maligno e le sue forze complici. Anche il Rosario ci sostiene nella battaglia.","La Vergine ha un volto tenero e dolce, in un atteggiamento pieno di pace; tiene gli occhi socchiusi perché è tutta concentrata sulla missione che le è stata affidata: sciogliere i nodi, grandi e piccoli, di un nastro bianco aggrovigliato. La mediazione materna di Maria si spiega in particolare con la sua intercessione. Come disse a Gesù a Cana: «Non hanno vino» (Gv 2,3), così ora in cielo presenta al Figlio tutte le nostre necessità, interponendo costantemente la sua materna intercessione.","Maria ha la luna sotto i piedi (Ap 12,1-2), con i quali schiaccia la testa del serpente (Gen 3,15): Maria è la riparatrice del peccato, colei che recupera l’integrità originaria vincendo il male. Lei è, dunque, la nuova Eva, l’inizio della nuova creazione: Maria è l’Immacolata, ma anche la Regina dell’universo. Così è pienamente associata alla vittoria di Gesù Cristo, suo Figlio, sul peccato e sulla morte. Per questo schiaccia la testa del serpente, simbolo di Satana. Diceva san Bernardo: «Oh, quanto tremano i demoni al solo sentir pronunciare il nome di Maria!». Se nelle tentazioni i cristiani avessero il buon senso di invocare con fiducia il nome di Maria, non cadrebbero, «perché i demoni fuggono e l’Inferno trema al suono di questo nome perfetto!».","È chiaro che nel corso di tutta la storia umana, così come nella vita di ciascuno di noi, Maria ci sostiene perché non cadiamo nell’errore dei nostri progenitori, ma rimaniamo fedeli a Dio, vincendo gli assalti del demonio.","Anche gli angeli, servitori e strumenti di Dio per accompagnare gli uomini e custodirli nel loro cammino (Es 23,20-22), occupano un posto di rilievo nel quadro. A destra si vede un angelo che porge a Maria un nastro pieno di nodi di ogni tipo. Con gli occhi rivolti alla Vergine ci invita a non dubitare, anche se i nodi sono molti e difficili da sciogliere. Dall’altro lato, il sinistro, dove si riflette la luce della misericordia e della salvezza divina, un altro angelo riceve tra le mani il nastro, che ora è liscio. L’angelo guarda il fedele, al quale mostra con sguardo eloquente il nastro senza nodi, per indicare che la sua preghiera è stata esaudita e il nodo sciolto per intercessione di Maria.","Infine, nella parte inferiore del quadro, si distingue un altro angelo: è Raffaele (che significa “Dio guarisce”). La sua presenza è il segno della delicatezza con cui Dio si serve di intermediari per soccorrere prontamente chi confida in lui (Tb 3,16-17).","Un Dio che si mette al passo degli uomini e cammina con loro, rispettandone i tempi, conducendoli verso la felicità. L’arcangelo tiene Tobia per mano (lo si riconosce dal pesce che tiene in mano e dal cane che lo segue: il cane è segno della fedeltà a Dio) e lo guida lungo il cammino. La storia di Tobia è narrata nella Bibbia, nel libro che porta il suo nome. Racconta come Dio, servendosi di Raffaele, guidi le due coppie di sposi — Tobi e Anna, Tobia e Sara — per liberarle dal male presente nelle loro relazioni familiari e coniugali. In particolare, l’amore tra Tobia e Sara è il segno del desiderio di Dio e della totale consacrazione a lui, anche quando le difficoltà della vita sembrano insuperabili, facendo di loro un esempio per tutte le coppie di sposi. I due giovani sono immagine della coppia che non esclude Dio dalla propria vita, ma ne fa il centro, perché solo con lui e per mezzo di lui possono sovrabbondare la grazia e l’amore. La loro storia ci insegna che solo la preghiera e la consacrazione a Dio possono scacciare il male e il demonio, la cui azione misteriosa, ma reale, opera spesso all’interno della famiglia per distruggerla. Per questo il loro caso risulta estremamente fecondo e ispiratore in ogni cammino nuziale, rendendo naturale parlare di difficoltà e di fatica, ma anche della bellezza e della gioia di amarsi.","In Tobia si può vedere la figura di Wolfgang Langenmantel che, accompagnato dal suo angelo custode per chiedere aiuto a Dio in un momento di difficoltà, cammina verso il convento dei Gesuiti, che nel quadro si colloca tra il cielo e la terra, ancora nell’oscurità ma illuminato dalla luce della grazia divina."]},{"titulo":"Origine della devozione","parrafos":["Nel 1986 papa Francesco, quando era ancora un semplice sacerdote gesuita, si recò a Francoforte per preparare la sua tesi di dottorato sul teologo Romano Guardini, maestro di due futuri papi, Paolo VI e Benedetto XVI. Rimase in Germania pochi mesi e non visitò mai la chiesa di Sankt Peter am Perlach ad Augusta, dove è custodito il quadro della Vergine che scioglie i nodi. Fu una religiosa, che lo conosceva piuttosto bene, a inviargli per Natale una cartolina con l’immagine della Vergine che scioglie i nodi. Quando la vide, se ne innamorò all’istante. Ne rimase colpito, al punto da distribuirne alcune riproduzioni a Buenos Aires, cominciando dai sacerdoti e dai fedeli, e trovando una grande accoglienza. Una delle immagini fu esposta all’Università del Salvador; proprio qui ebbe inizio la diffusione di questa nuova devozione.","Nominato in seguito vescovo ausiliare di Buenos Aires, padre Bergoglio consolidò il suo culto, proseguendo con l’inaugurazione di cappelle in suo onore e utilizzando l’immaginetta con la sua effigie perfino come biglietto da visita personale, che inseriva nella sua corrispondenza insieme a quella di san Giuseppe. Fu anche l’immagine che scelse per il ricordino della sua ordinazione episcopale.","Monsignor Jorge Bergoglio proseguì instancabilmente la sua opera di diffusione di questa devozione, concedendo il proprio Imprimatur alla pubblicazione della «Preghiera a Maria che scioglie i nodi».","Nel settembre del 1996 padre Rodolfo Arroyo, che pochi mesi prima era stato nominato parroco di San José del Talar, decise di portare l’immagine nella sua chiesa, situata nel centro di Buenos Aires. In meno di tre mesi un’artista locale, Ana María Betta de Berti, dipinse una riproduzione del quadro originale tedesco e la donò alla parrocchia. Il cardinale Bergoglio, celebrando la Messa a San José del Talar l’8 dicembre 2011, dichiarò la chiesa «Santuario di Nostra Signora che scioglie i nodi». Da quel giorno la sua festa si celebra l’8 dicembre e ogni giorno 8 del mese. Nel 1997 fu collocata una riproduzione del quadro nella chiesa di San Juan Bautista. Il parroco, padre Juan Ramón Celeiro, vedendo il continuo afflusso di fedeli, decise di scrivere una novena per aiutare la gente a pregare."]},{"titulo":"Significato teologico","parrafos":["La scena descritta nel dipinto, e in particolare il gesto di Maria, sono ricchi di significati teologici molto profondi, sottolineati e suggeriti da Bergoglio, che richiamano la prima dottrina mariana sviluppatasi nella Chiesa già all’inizio del II secolo sulla contrapposizione tra Maria ed Eva, derivata da quella tra Cristo e Adamo. Essa mette in risalto con straordinario vigore il ruolo di Maria accanto a Cristo, di grande attualità nell’odierna riflessione mariologica.","Questo insegnamento è stato ripreso e sintetizzato mirabilmente nella Costituzione dogmatica del Concilio Vaticano II sulla Chiesa, la Lumen gentium, in particolare nel capitolo VIII, in cui si delinea la figura di Maria e la sua funzione nella storia della salvezza. Al numero 56 leggiamo: «Il Padre delle misericordie ha voluto che l’accettazione da parte della predestinata madre precedesse l’incarnazione, perché così, come una donna aveva contribuito a dare la morte, così una donna contribuisse a dare la vita. [...] Giustamente quindi i santi Padri ritengono che Maria non fu strumento meramente passivo nelle mani di Dio, ma che cooperò alla salvezza dell’uomo con libera fede e obbedienza. Infatti, come dice sant’Ireneo, essa “obbedendo divenne causa della salvezza per sé e per tutto il genere umano” (Adversus haereses, III, 22, 4). Onde non pochi antichi Padri nella loro predicazione volentieri affermano con lui che “il nodo della disobbedienza di Eva ha avuto la sua soluzione coll’obbedienza di Maria; ciò che la vergine Eva legò con la sua incredulità, la vergine Maria sciolse con la sua fede” (Adversus haereses, III, 22, 4); e, fatto il paragone con Eva, chiamano Maria “la madre dei viventi” (sant’Epifanio, Haereses, 78, 18) e affermano ancor più spesso: “la morte per mezzo di Eva, la vita per mezzo di Maria”».","Come si può facilmente notare, la frase di Ireneo: «il nodo della disobbedienza di Eva si è sciolto con l’obbedienza di Maria; ciò che la vergine Eva legò con l’incredulità, la Vergine Maria lo sciolse con la fede», spiega ciò che il quadro di Maria che scioglie i nodi vuole comunicare in modo visibile. Per comprendere meglio questa relazione, vale la pena soffermarsi brevemente sull’insegnamento del grande vescovo di Lione."]},{"titulo":"La nuova Eva accanto al nuovo Adamo","parrafos":["Nel contesto della dottrina della «ricapitolazione» di tutte le cose in Cristo, Ireneo (130 ca. - 202 ca.) spiega il ruolo della Vergine nel piano di salvezza, ricorrendo al parallelismo Eva-Maria. Fedele all’insegnamento di san Paolo (cfr. Rm 5,12-21), la sua dottrina della ricapitolazione mette in evidenza i due grandi obiettivi raggiunti da Cristo nella sua opera redentrice: un risultato negativo, che consiste nella distruzione del peccato e della morte, le due principali conseguenze della disobbedienza di Adamo; e un risultato positivo, cioè la restaurazione di tutto il genere umano secondo l’immagine di Dio distrutta dal peccato originale. Questi due risultati il nuovo Adamo li ha conseguiti mediante la sua totale obbedienza al Padre, compensando in questo modo la disobbedienza del primo Adamo e riaprendo vittoriosamente l’antico conflitto contro Satana. È qui, in questo punto, che Ireneo paragona Maria a Eva, aggiungendo un secondo parallelismo che spiega meglio il primo, quello tra Cristo e Adamo.","«Come Eva, che pur avendo Adamo per marito era vergine [...], disobbedendo divenne causa di morte per sé e per tutto il genere umano, allo stesso modo Maria, che pur avendo uno sposo era ancora vergine, obbedendo divenne causa di salvezza per sé e per tutto il genere umano [...]. Pertanto il processo della disobbedienza di Eva si è risolto grazie all’obbedienza di Maria. Ciò che la vergine Eva legò a causa della sua incredulità, la Vergine Maria lo sciolse mediante la sua fede» (Adversus haereses, III, 22,4).","Ireneo stabilisce chiaramente un perfetto parallelismo tra le due donne, tanto nella convergenza quanto nell’antitesi, così come l’Apostolo aveva fatto con Adamo e Cristo. Eva e Maria, entrambe sposate, erano ancora vergini. Ma mentre Eva disobbedì, causando la rovina e la morte per sé e per il genere umano, Maria con la sua obbedienza fu causa di salvezza. La disobbedienza di Eva impose all’umanità legami di schiavitù spirituale, mentre l’obbedienza di Maria sciolse quei legami, riportando l’uomo alla sua libertà originaria. La disobbedienza di Eva è conseguenza della sua incredulità, mentre l’obbedienza di Maria è frutto della sua fede."]},{"titulo":"Maria, «avvocata» di Eva","parrafos":["In un altro passo, dove l’antitesi Eva-Maria procede in parallelo con l’antitesi paolina Adamo-Cristo, sant’Ireneo attribuisce alla Vergine l’appellativo di «avvocata di Eva»: «Come Eva fu sedotta dalla parola dell’angelo (decaduto) fino al punto di fuggire da Dio, avendo trasgredito la sua parola, così Maria ricevette il lieto annuncio per mezzo della parola dell’angelo, in modo tale che, obbedendo alla sua parola, portò Dio dentro di sé. E come quella si lasciò sedurre fino a disobbedire a Dio, così questa si lasciò persuadere a obbedire a Dio. Per questo la Vergine Maria diventa avvocata della vergine Eva.","Come tutto il genere umano fu legato alla morte a causa di una vergine, allo stesso modo fu liberato per mezzo di una Vergine, poiché la disobbedienza di una vergine fu compensata dall’obbedienza della Vergine.","Se il peccato del primo uomo fu riparato dalla retta condotta del Figlio primogenito (di Dio), se l’astuzia del serpente fu vinta dalla semplicità della colomba (Maria), e se sono stati spezzati i lacci che ci tenevano legati alla morte, gli eretici sono stolti: ignorano l’economia di Dio, ignorano la sua opera con l’uomo» (Adversus haereses, V, 19,1).","Sembra chiaro, secondo questi testi, che Ireneo non solo attribuisce a Maria un ruolo all’interno dell’opera della redenzione, ma specifica che questo ruolo è strettamente unito all’azione compiuta dal Salvatore, nuovo Adamo, allo stesso modo in cui Eva ebbe una funzione, purtroppo negativa, accanto al primo Adamo.","La Vergine non si limita a svolgere una funzione su un piano meramente personale, soltanto parallelo a quello di Eva. Fa qualcosa di più, perché con la sua semplicità distrugge l’orgoglio e l’astuzia del serpente, che è l’autore dei mali di Eva.","Ma Ireneo va ancora oltre. In una pagina della sua Dimostrazione della predicazione apostolica scrive espressamente che, come Adamo è stato «ricapitolato» in Cristo, allo stesso modo Eva è stata «ricapitolata» in Maria. «Era conveniente e giusto che Adamo fosse ricapitolato in Cristo, perché la morte fosse assorbita dall’immortalità, e che Eva fosse ricapitolata in Maria, perché la Vergine, divenuta avvocata di un’altra vergine, potesse annullare e distruggere, con la sua obbedienza verginale, la disobbedienza verginale» (n. 33).","Nei testi citati è facile osservare un certo sviluppo progressivo. Il principio della ricapitolazione si integra con un altro principio, quello della «ricircolazione», che introduce nella teologia di Ireneo una nota storico-salvifica. Se il primo afferma che l’umanità, caduta a causa del suo primo capo, Adamo, doveva essere ricondotta a Dio da un altro uomo che fosse il suo secondo capo, cioè Cristo, il principio della ricircolazione afferma che questo processo di restaurazione compiuto dal Salvatore doveva corrispondere, passo dopo passo, su un piano antitetico, alla storia della caduta. Maria entra così, in questo processo, come l’antitipo di Eva. La Vergine quindi intercede per i peccatori che, come Eva, non obbediscono alla Parola di Dio.","Il grande vescovo di Lione attribuisce alla Vergine il titolo di «avvocata», che divenne poi molto comune tra i cristiani. Nei secoli successivi la teologia cattolica, per illustrare la dottrina sulla collaborazione e cooperazione di Maria alla redenzione degli uomini e sulla sua mediazione della grazia divina, utilizzò un’espressione molto forte: corredenzione. È di grande attualità e certamente sarà in grado di illuminare il dibattito attuale sulla collaborazione di Maria alla redenzione degli uomini e sul suo ruolo di mediatrice.","Nella Chiesa, questi insegnamenti non solo sono stati ripresi e rivalutati dalla dottrina della Lumen gentium, ma hanno esercitato un notevole influsso perfino nel culto; infatti, sono stati inclusi nel Prefazio IV dell’Avvento: «La grazia che Eva ci tolse ci è ridonata in Maria»."]},{"titulo":"La novena","parrafos":["Con la novena a «Maria che scioglie i nodi» bussiamo umilmente alla porta del cielo, chiedendo alla Vergine di intercedere presso Dio per un’intenzione particolare. Non si tratta di una formula magica, ma di un appello insistente, fatto con fede e abbandono, da una persona bisognosa a Colei che scioglie i nodi della nostra vita, mossa dal suo straordinario potere di intercessione presso il Figlio, Gesù. «Maria si pone tra il Figlio suo e gli uomini nella realtà delle loro privazioni, indigenze e sofferenze. Si pone “in mezzo”, cioè fa da mediatrice non come un’estranea, ma nella sua posizione di madre, consapevole che come tale può — anzi “ha il diritto di” — far presente al Figlio i bisogni degli uomini» (Giovanni Paolo II, Redemptoris Mater, 21). Ella, dunque, vive la sua presenza all’interno del mistero della nostra redenzione perché come Madre intercede presso il Figlio: coopera con la sua intercessione perché i nodi della nostra vita si sciolgano, perché la tristezza della nostra condizione si trasformi nella gioia della salvezza.","Maria, condividendo la nostra condizione umana, è capace di compatire ogni debolezza. Pur non avendo conosciuto il peccato, ella comprende l’uomo peccatore e lo ama con amore di Madre. «Nelle necessità gettatevi tra le braccia di Maria santissima, ricorrete a lei come a una madre misericordiosa, e poi state tranquilli, non scoraggiatevi, ma piuttosto confidate in lei» (san Paolo della Croce).","La più antica preghiera mariana esprime profondamente questa convinzione: «Sotto la tua protezione cerchiamo rifugio, santa Madre di Dio: non disprezzare le suppliche di noi che siamo nella prova, ma liberaci sempre da ogni pericolo».","Chi meglio di Maria, donna, sposa, madre, vedova, con il cuore trafitto da una spada per la morte del Figlio suo, può aiutarci a sciogliere i nodi problematici, guidandoci verso la vita nuova che ci ha donato il Risorto?","Affidiamo a questa tenera madre le nostre angosce, i nostri nodi e, da quel momento, tutto cambierà. La nostra vita ordinaria diventerà festa, stupore, gioia senza fine."]},{"titulo":"Che cosa si intende per «nodi»","parrafos":["Con la parola «nodi» si intendono tutti quei problemi presenti nella nostra vita, tutti quei problemi che, spesso, ci portiamo dietro da anni e non sappiamo come risolvere; tutti quei peccati che ci incatenano e ci impediscono di accogliere Dio nella nostra vita e di gettarci tra le sue braccia come bambini; tutti quei rancori che rendono difficile amarci umilmente e con sincerità all’interno delle nostre famiglie e che impediscono che si compia il comandamento di Gesù: «Amatevi gli uni gli altri come io ho amato voi» (cfr. Gv 13,34).","L’elenco potrebbe continuare, perché sono molti i nodi che soffocano la nostra anima, che ci abbattono, che ci tolgono la gioia del cuore e persino la voglia di vivere.","La Vergine Maria viene incontro a ciascuno di noi perché le offriamo tutti questi nodi, che lei scioglierà uno dopo l’altro. Maria è colei che, con il suo amore materno, si prende cura dei fratelli del Figlio suo ancora pellegrinanti e posti in mezzo a pericoli e affanni, fino a che non siano condotti nella patria celeste. «Tutti - spiegava molte volte l’allora cardinale Bergoglio - abbiamo nodi nel cuore, mancanze, e attraversiamo difficoltà. Il nostro buon Padre, che distribuisce la grazia a tutti i suoi figli, vuole che ci fidiamo di Lei, che le consegniamo i nodi dei nostri mali, le matasse delle nostre miserie che ci impediscono di unirci a Dio, perché Lei li sciolga e ci avvicini a suo figlio Gesù. Questo è il significato dell’immagine».","Confidiamo, allora, nella grandezza della nostra Madre «che scioglie i nodi» e lasciamoci condurre perché lei ci faccia vedere le meraviglie che Dio ha preparato per noi."]},{"titulo":"Quando recitare la novena","parrafos":["Oggi la Vergine è invocata in modo speciale da molte coppie di sposi per problemi in famiglia, per le difficoltà della vita matrimoniale, per l’incomprensione tra genitori e figli, per questioni di salute, per tensioni e problemi in ambito professionale, per la casa o gli studi, per guarire dalla dipendenza dall’alcol, dalla droga, dal gioco d’azzardo, dalla pornografia, dalle pratiche sataniche... Ma la novena è efficace anche per sciogliere tutti quei nodi che ci impediscono di aprirci all’amore di Dio Padre e ai fratelli, tutte quelle difficoltà, piccole e grandi, che la vita ci riserva quotidianamente.","Il vescovo ausiliare di Madrid e segretario generale della Conferenza Episcopale Spagnola, Juan Antonio Martínez Camino, ha proposto di pregare la Vergine che scioglie i nodi per papa Francesco, perché lo custodisca e lo sostenga con la sua materna sollecitudine nella missione che gli è stata affidata.","Ricordiamo anche che la santissima Vergine, come Porta del cielo, è colei che scioglie l’ultimo nodo, quello delle anime del Purgatorio. Si può recitare la novena in occasione delle feste del 15 agosto, del 28 settembre e dell’8 dicembre."]},{"titulo":"Come si recita la novena","parrafos":["La prima e migliore disposizione perché la nostra preghiera sia efficace è vivere in stato di grazia o, se così non è, almeno desiderare di tornare a tale stato il più rapidamente possibile mediante il sacramento della Riconciliazione.","Ogni novena scioglie un solo nodo, per questo si deve recitare una novena a Maria che scioglie i nodi per ogni nodo che opprime la nostra vita.","La novena si può recitare per un’altra persona solo se il nodo di cui soffre questa persona riguarda anche chi la recita. In altre parole, si può recitare la novena quando il nodo di un’altra persona costituisce un nodo nella nostra vita, nodo che chiediamo a Maria di sciogliere.","La novena inizia con le preghiere iniziali. Di particolare importanza è il breve esame di coscienza con il quale chiediamo umilmente il perdono dei nostri peccati e formuliamo il fermo proposito di non commetterli più. La novena comprende la preghiera del Rosario. Attraverso di esso Maria condurrà silenziosamente il fedele alla scoperta della sua identità, mediante l’itinerario di fede che lei stessa ha percorso: assimilare la nostra vita a quella di Gesù, rivivendo i misteri della nostra salvezza. Non è un caso che Maria si sia presentata a Fatima con il titolo speciale di «Vergine del Rosario». Padre Pio da Pietrelcina, a chi gli chiedeva perché recitasse tanti Rosari ogni giorno, rispondeva: «Se la santa Vergine l’ha sempre raccomandato vivamente ovunque sia apparsa, non ti pare che debba esserci un motivo speciale?». Lucia di Fatima assicurava che, in questo mondo così agitato, «se tutti recitassero il Rosario ogni giorno, la Vergine opererebbe miracoli». Papa Francesco ci ricorda anche che «la preghiera con Maria, in particolare il Rosario, ha una dimensione “agonistica”, cioè di lotta, una preghiera che sostiene nella battaglia contro il maligno e i suoi complici».","Dopo aver recitato le prime tre decine del Rosario si passa alla novena propria di ciascun giorno, nella quale si supplica la Vergine di sciogliere specificamente il nodo per il quale facciamo la novena.","Ogni persona ha un nodo da presentare alla Vergine perché lo sciolga. È meglio cominciare dal più semplice, perché sia più chiaro come arrivare a quello principale.","Meditiamo ogni parola della novena e, uno a uno, i nostri nodi si scioglieranno.","Si prosegue poi con le ultime due decine del Rosario e le Litanie lauretane.","Si termina con le preghiere finali.","Perché questa novena sia efficace e produca i frutti sperati sono necessarie l’umiltà, la fiducia e la ferma speranza di essere esauditi, se ne deriva la gloria di Dio e il nostro vero bene. È necessaria anche la perseveranza: non dobbiamo stancarci di pregare se Dio non ci esaudisce subito, ma dobbiamo continuare a pregare con ancora più fervore perché: «La preghiera coraggiosa, umile e forte, compie miracoli. La preghiera fa miracoli, ma dobbiamo credere!» (papa Francesco). La cosa più importante è che siamo consapevoli che la Vergine Maria è la nostra consigliera, la nostra avvocata e la nostra mediatrice in ogni momento."]}],"intro_novena":{"titulo":"Introduzione","parrafos":["La novena che segue si recita per nove giorni consecutivi, con costanza e senza interruzioni, ogni volta che si vuole chiedere a Maria di sciogliere un nodo della nostra vita."]},"sugerencias":["Come insegna la santa madre Chiesa, la vita spirituale, i pii esercizi e le devozioni sono strettamente legati alla vita sacramentale e sono tanto più efficaci e fruttuosi quanto più si corrisponde alla grazia del Signore. Perciò, durante la novena è consigliabile accostarsi al sacramento della Riconciliazione per chiedere perdono a Dio dei propri peccati, partecipare alla santa Messa quotidiana (quando è possibile) e ricevere la santa Comunione, fonte e culmine di tutta la vita cristiana.","Inoltre, ogni giorno della novena è consigliabile:","Lodare, benedire e ringraziare la santissima Trinità: Dio Padre per il dono della creazione; Dio Figlio per il dono della redenzione; Dio Spirito Santo per quello della santificazione.","Perdonare sempre e tutti. Vivere con impegno e costanza la preghiera personale, familiare e comunitaria. Compiere opere di carità.","Abbandonarsi alla volontà di Dio.","Seguendo questi suggerimenti e impegnandosi ogni giorno in un cammino di conversione, che porti a un reale cambiamento di vita, si vedranno realizzate le meraviglie che Dio ha riservato a ciascuno dei suoi figli, secondo i suoi tempi e la sua volontà.","La novena a Maria che scioglie i nodi, infatti, è molto efficace, se si crede fermamente, per superare periodi di sofferenza, di malattia, angoscia, decadenza morale, problemi familiari, matrimonio in crisi, mancanza di lavoro; per essere illuminati al momento di prendere le decisioni più difficili, per essere guariti, consolati e per chiedere qualsiasi aiuto nelle piccole e grandi necessità di ogni giorno; anche come ringraziamento per le immense grazie che continuamente riceviamo dal Signore."],"esquema":["Preghiere iniziali Rosario: prime tre decine Novena del giorno corrispondente Rosario: ultime due decine Preghiere finali"]}</script>
