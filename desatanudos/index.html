la obediencia de María. Lo que ató la virgen Eva a causa de su incredulidad, la Virgen María lo desató mediante su fe» (Adversus haereses, III, 22,4).","Ireneo establece claramente un paralelismo perfecto entre las dos mujeres, tanto en la convergencia como la antítesis, igual que el apóstol había hecho con Adán y Cristo. Eva y María, estando las dos esposadas, eran todavía vírgenes. Pero mientras Eva desobedeció, causando la ruina y la muerte para sí y para el genero humano, María con su obediencia fue causa de salvación. La desobediencia de Eva impuso a la humanidad lazos de esclavitud espiritual, mientras que la obediencia de María desató esos lazos, llevando de nuevo al hombre a su primitiva libertad. La desobediencia de Eva es consecuencia de su incredulidad, en cambio la obediencia de María es fruto de su fe."]},{"titulo":"María, «abogada» de Eva","parrafos":["En otro pasaje, donde la antítesis Eva-María va en paralelo con la antítesis paulina Adán-Cristo, san Ireneo atribuye a la Virgen el apelativo de «abogada de Eva»: «Así como Eva fue seducida por la palabra del ángel (caído) hasta el punto de huir de Dios, habiendo transgredido su palabra, así María recibió el gozoso anuncio por medio de la palabra del ángel, de tal modo que, obedeciendo a su palabra, llevó a Dios dentro de sí. Y como aquella se dejó seducir hasta desobedecer a Dios, así esta se dejó persuadir para obedecer a Dios. Por esto, la Virgen María se convierte en abogada de la virgen Eva.","Como todo el género humano fue ligado a la muerte a causa de una virgen, igualmente fue liberado por medio de una Virgen, pues la desobediencia de una virgen fue compensada por la obediencia de la Virgen.","Si el pecado del primer hombre fue reparado por la recta conducta del Hijo primogénito (de Dios), si la astucia de la serpiente fue vencida por la simplicidad de la paloma (María), y si han sido rotos los lazos que nos tenían atados a la muerte, los herejes son tontos: ignoran la economía de Dios, ignoran su obra con el hombre» (Adversus haereses, V, 19,1).","Parece claro, según estos textos, que Ireneo no solo atribuye a María un papel dentro de la obra de la redención, sino que especifica que este papel está estrechamente unido a la acción realizada por el Salvador, nuevo Adán, de la misma manera que Eva tuvo una función, desgraciadamente negativa, junto al primer Adán.","La Virgen no se limita a llevar a cabo una función en un plano meramente personal, solo paralelo al de Eva. Hace algo más, porque con su simplicidad destruye el orgullo y la astucia de la serpiente, que es la autora de los males de Eva.","Pero Ireneo va más allá todavía. En una página de su Demostración de la doctrina apostólica escribe expresamente que, como Adán ha sido «recapitulado» en Cristo, de la misma manera Eva ha sido «recapitulada» en María. «Era conveniente y justo que Adán fuera recapitulado en Cristo, para que la muerte fuese absorbida por la inmortalidad, y que Eva fuera recapitulada en María, para que la Virgen, convertida en abogada de otra virgen, pudiese anular y destruir, con su obediencia virginal, la desobediencia virginal» (n. 33).","En los textos citados es fácil observar un cierto desarrollo progresivo. El principio de la recapitulación se integra con otro principio, el de la «recirculación», que introduce en la teología de Ireneo una nota histórico-salvífica. Si el primero afirma que la humanidad, caída a causa de su primera cabeza, Adán, debía ser reconducida a Dios por otro hombre que fuera su segunda cabeza, es decir Cristo, el principio de la recirculación afirma que este proceso de restauración llevado a cabo por el Salvador debía corresponder, paso a paso, en un plano antitético, a la historia de la caída. María entra así, en este proceso, como el antitipo de Eva. La Virgen por tanto intercede por los pecadores que, como Eva, no obedecen la Palabra de Dios.","El gran obispo de Lion atribuye a la Virgen el título de «abogada», que se hizo muy común posteriormente entre los cristianos. En los siglos siguientes la teología católica, para ilustrar la doctrina acerca de la colaboración y cooperación de María en la redención de los hombres y su mediación de la gracia divina, utilizó una expresión muy fuerte: corredención. Es de una gran actualidad y ciertamente será capaz de iluminar el debate actual sobre la colaboración de María en la redención de los hombres y su papel como mediadora.","En la Iglesia, estas enseñanzas no solo han sido retomadas y revalorizadas por la doctrina de la Lumen gentium, sino que han desempeñado una notable influencia incluso en el culto; de hecho, se han incluido en el Prefacio IV de Adviento: «La gracia que Eva nos arrebató nos ha sido devuelta en María»."]},{"titulo":"La novena","parrafos":["Con la novena a «María Desatanudos» llamamos humildemente a la puerta del cielo, pidiendo a la Virgen que interceda ante Dios por una intención particular. No se trata de una fórmula mágica, sino de una llamada insistente, hecha con fe y abandono, de una persona necesitada a Aquella que desata los nudos de nuestras vidas movida por su extraordinario poder de intercesión ante el Hijo, Jesús. «María se pone entre su Hijo y los hombres en la realidad de sus privaciones, indigencias y sufrimientos. Se pone “en medio”, o sea hace mediadora no como una persona extraña, sino en su papel de madre, consciente de que como tal puede — más bien “tiene el derecho de” — hacer presente al Hijo las necesidades de los hombres» (Juan Pablo II, Redemptoris Mater, 21). Ella, por tanto, vive su presencia dentro del misterio de nuestra redención porque como Madre intercede ante el Hijo: coopera con su intercesión para que los nudos de nuestra vida se desaten, para que la tristeza de nuestra condición se transforme en la alegría de la salvación.","María, compartiendo nuestra condición humana, es capaz de compadecer toda debilidad. Aun no habiendo conocido el pecado, ella comprende al hombre pecador y lo ama con amor de Madre. «En las necesidades arrojaos a los brazos de María santísima, recurrid a ella como a una madre misericordiosa, y luego estad tranquilos, no os desaniméis, sino más bien confiad en ella» (San Pablo de la Cruz).","La oración mariana más antigua expresa profundamente esta convicción: «Bajo tu protección nos acogemos, santa Madre de Dios; no deseches las súplicas que te dirigimos en nuestras necesidades; antes bien, líbranos siempre de todo peligro».","¿Quién mejor que María, mujer, esposa, madre, viuda, con el corazón traspasado por una espada por la muerte de su Hijo, puede ayudarnos a desatar los nudos problemáticos, guiándonos hacia la vida nueva que nos dio el Resucitado?","Confiemos a esta tierna madre nuestras angustias, nuestros nudos y, desde ese momento, todo cambiará. Nuestra vida ordinaria se volverá fiesta, asombro, alegría sin fin."]},{"titulo":"Qué se entiende por «nudos»","parrafos":["Con la palabra «nudos» se entiende todos aquellos problemas presentes en nuestra vida, todos aquellos problemas que, con frecuencia, llevamos desde hace años y no sabemos cómo resolver; todos aquellos pecados que nos encadenan y nos impiden acoger a Dios en nuestra vida y echarnos en sus brazos como niños; todos aquellos rencores que hacen difícil amarnos humildemente y con sinceridad dentro de nuestras familias y que impiden que se cumpla el mandamiento de Jesús: «Amaos los unos a los otros, como yo os he amado» (cfr. Jn 13,34).","La lista podría continuar, porque son muchos los nudos que ahogan nuestra alma, que nos derriban, que nos quitan la alegría del corazón e incluso las ganas de vivir.","La Virgen María viene al encuentro de cada uno de nosotros para que le ofrezcamos todos estos nudos, que ella desatará uno tras otro. María es aquella que, con su amor maternal, cuida de los hermanos de su Hijo todavía peregrinos y en medio de peligros y afanes, hasta que sean conducidos a la patria celestial. «Todos - explicaba muchas veces el entonces cardenal Bergoglio - tenemos nudos en el corazón, carencias, y atravesamos dificultades. Nuestro buen Padre, que distribuye la gracia a todos sus hijos, quiere que nos fiemos de Ella, que le entreguemos los nudos de nuestros males, las madejas de nuestras miserias que nos impiden unirnos a Dios, para que Ella los desate y nos acerque a su hijo Jesús. Este es el significado de la imagen».","Confiemos, entonces, en la grandeza de nuestra Madre «que desata los nudos» y dejémonos llevar para que ella nos haga ver las maravillas que Dios ha preparado para nosotros."]},{"titulo":"Cuándo rezar la novena","parrafos":["Hoy a la Virgen la invocan de modo especial muchas parejas de esposos por problemas en la familia, por las dificultades de la vida matrimonial, por la incomprensión entre padres e hijos, por cuestiones de salud, por tensiones y problemas en el ámbito profesional, por la casa o los estudios, para curar la adicción al alcohol, la droga, los juegos de azar, la pornografía, las prácticas satánicas... Pero la novena es eficaz también para desatar todos aquellos nudos que nos impiden abrirnos al amor de Dios Padre y a los hermanos, todas aquellas dificultades, pequeñas y grandes, que la vida nos reserva cotidianamente.","El obispo auxiliar de Madrid y secretario general de la Conferencia Episcopal Española, Juan Antonio Martínez Camino, ha propuesto rezar a la Virgen Desatanudos por el papa Francisco, para que lo custodie y lo sostenga con su maternal solicitud en la misión que se le ha confiado.","Recordemos también que la santísima Virgen, como Puerta del cielo, es la que desata el último nudo, el de las almas del Purgatorio. Se puede rezar la novena en las fiestas de los días 15 de agosto, 28 de septiembre y 8 de diciembre."]},{"titulo":"Cómo se reza la novena","parrafos":["La primera y mejor disposición para que nuestra oración sea eficaz es vivir en estado de gracia o, no siendo así, al menos desear volver a tal estado lo más rápidamente posible mediante el sacramento de la Reconciliación.","Cada novena desata un solo nudo, por eso se debe rezar una novena a María Desatanudos por cada nudo que oprime nuestra vida.","La novena se puede rezar por otra persona solo si el nudo que padece esta persona afecta también a quien la reza. En otras palabras, se puede rezar la novena cuando el nudo de otra persona constituye un nudo en nuestra vida, nudo que pedimos que desate María.","La novena comienza con las oraciones iniciales. De especial importancia es el breve examen de conciencia con el que pedimos humildemente el perdón de nuestros pecados y formulamos el firme propósito de no cometerlos más. La novena comprende la oración del Rosario. A través de él María conducirá silenciosamente al fiel al descubrimiento de su identidad, mediante el itinerario de fe que ella misma ha recorrido: asimilar nuestra vida a la de Jesús, reviviendo los misterios de nuestra salvación. No es casual que María se presentase en Fátima con el título especial de «Virgen del Rosario». El padre Pío de Pietrelcina, a quien le preguntaba por qué rezaba tantos Rosarios cada día, respondía: «Si la santa Virgen lo ha recomendado siempre vivamente allí donde se ha aparecido, ¿no te parece que debe ser por un motivo especial?». Lucía de Fátima aseguraba que, en este mundo tan agitado, «si todos rezaran el Rosario cada día, la Virgen obraría milagros». El papa Francisco nos recuerda también que «la oración con María, en especial el Rosario, tiene una dimensión “agonística”, es decir, de lucha, una oración que sostiene en la batalla contra el maligno y sus cómplices».","Después de rezar las tres primeras decenas del Rosario se pasa a la novena propia de cada día, en la que se suplica a la Virgen que desate específicamente el nudo por el que hacemos la novena.","Cada persona tiene un nudo que presentar a la Virgen para que lo desate. Es mejor empezar con el más simple, para que quede más claro cómo llegar al principal.","Meditemos cada palabra de la novena y, uno a uno, nuestros nudos se desatarán.","Se sigue luego con las dos últimas decenas del Rosario y las Letanías Lauretanas.","Se termina con las oraciones finales.","Para que esta novena sea eficaz y produzca los frutos esperados son necesarias la humildad, la confianza y la firme esperanza de ser escuchados, si de ello deriva la gloria de Dios y nuestro verdadero bien. Es necesaria también la perseverancia: no debemos cansarnos de rezar si Dios no nos escucha pronto, sino que debemos seguir rezando incluso con más fervor porque: «La oración audaz, humilde y fuerte, realiza milagros. La oración hace milagros, ¡pero debemos creer!» (Papa Francisco). Lo más importante es que seamos conscientes de que la Virgen María es nuestra consejera, nuestra abogada y nuestra mediadora en todo momento."]}],"intro_novena":{"titulo":"Introducción","parrafos":["La siguiente novena se reza durante nueve días consecutivos, con constancia y sin interrupción, cada vez que se quiere pedir a María que desate un nudo de nuestra vida."]},"sugerencias":["Como enseña la santa madre Iglesia, la vida espiritual, los ejercicios de piedad y las devociones están estrechamente ligados a la vida sacramental y son tanto más eficaces y fructíferos cuanto más se corresponde a la gracia del Señor. Por tanto, durante la novena es aconsejable acercarse al sacramento de la Reconciliación para pedir perdón a Dios por los propios pecados, participar en la santa Misa cotidiana (cuando esto sea posible) y recibir la sagrada Comunión, fuente y culmen de toda la vida cristiana.","Además, cada día de la novena es aconsejable:","Alabar, bendecir y dar gracias a la santísima Trinidad: a Dios Padre por el don de la creación; a Dios Hijo por el don de la redención; a Dios Espíritu Santo por el de la santificación.","Perdonar siempre y a todos. Vivir con empeño y constancia la oración personal, familiar y comunitaria. Realizar obras de caridad.","Abandonarse a la voluntad de Dios.","Siguiendo estas sugerencias y esforzándose cotidianamente en un camino de conversión, que lleve a cabo un cambio real de vida, se verán realizadas las maravillas que Dios ha reservado para cada uno de sus hijos, según sus tiempos y su voluntad.","La novena a María Desatanudos, de hecho, es muy eficaz, si se cree firmemente, para superar períodos de sufrimiento, de enfermedad, angustia, decadencia moral, problemas familiares, matrimonio en crisis, falta de trabajo; para ser iluminados a la hora de tomar las decisiones más difíciles, para ser curados, consolados y para pedir cualquier ayuda en las pequeñas y grandes necesidades de cada día; también como agradecimiento por las inmensas gracias que continuamente recibimos del Señor."],"esquema":["Oraciones iniciales Rosario: tres primeras decenas Novena del día correspondiente Rosario: dos últimas decenas Oraciones finales"]}</script>
<script type="application/json" id="data-it">{"titulo":"Novena a Maria che scioglie i nodi","iniciales":{"intro":["Nel nome del Padre e del Figlio e dello Spirito Santo. Amen.","All’inizio della preghiera invochiamo il Padre per mezzo di Gesù Cristo nostro Signore perché ci doni lo Spirito Santo. Egli è il maestro interiore che ci insegna a pregare: «Nessuno può dire: “Gesù è Signore!”, se non sotto l’azione dello Spirito Santo» (1Cor 12,3). Ecco perché la Chiesa ci invita a implorarlo ogni giorno, soprattutto all’inizio e al termine di ogni azione importante."],"bloques":[{"titulo":"Sequenza allo Spirito Santo","tipo":"verso","estrofas":[["Vieni, Santo Spirito,","manda a noi dal cielo","un raggio della tua luce.","Vieni, padre dei poveri,","vieni, datore dei doni,","vieni, luce dei cuori."],["Consolatore perfetto,","ospite dolce dell’anima,","dolcissimo sollievo.","Nella fatica, riposo,","nella calura, riparo,","nel pianto, conforto."],["O luce beatissima,","invadi nell’intimo","il cuore dei tuoi fedeli.","Senza la tua forza,","nulla è nell’uomo,","nulla senza colpa."],["Lava ciò che è sordido,","bagna ciò che è arido,","sana ciò che sanguina.","Piega ciò che è rigido,","scalda ciò che è gelido,","drizza ciò che è sviato."],["Dona ai tuoi fedeli,","che solo in te confidano,","i tuoi santi doni.","Dona virtù e premio,","dona morte santa,","dona gioia eterna. Amen."]]},{"titulo":"Credo","tipo":"texto","parrafos":["Io credo in Dio, Padre onnipotente, creatore del cielo e della terra; e in Gesù Cristo, suo unico Figlio, nostro Signore, (inchino) il quale fu concepito di Spirito Santo, nacque da Maria Vergine, patì sotto Ponzio Pilato, fu crocifisso, morì e fu sepolto; discese agli inferi; il terzo giorno risuscitò da morte; salì al cielo, siede alla destra di Dio Padre onnipotente; di là verrà a giudicare i vivi e i morti.","Credo nello Spirito Santo, la santa Chiesa cattolica, la comunione dei santi, la remissione dei peccati, la risurrezione della carne, la vita eterna. Amen."]},{"titulo":"Atto di dolore","tipo":"texto","rubrica":"Dopo aver invocato lo Spirito Santo con la Sequenza e aver professato la nostra fede con il Credo, restiamo qualche istante in silenzio ed esaminiamo brevemente la nostra coscienza. Se essa ci rimprovera qualche peccato grave, proponiamoci di accostarci al più presto al sacramento della Riconciliazione perché, come ci ricorda papa Francesco, «il confessionale non dev’essere una sala di tortura bensì il luogo della misericordia del Signore che ci stimola a fare il bene possibile». Riconosciamoci, dunque, bisognosi della misericordia del Padre e chiediamo umilmente perdono dei nostri peccati. Poi formuliamo il fermo proposito di non peccare più.","parrafos":["Mio Dio, mi pento e mi dolgo con tutto il cuore dei miei peccati, perché peccando ho meritato i tuoi castighi, e molto più perché ho offeso te, infinitamente buono e degno di essere amato sopra ogni cosa. Propongo con il tuo santo aiuto di non offenderti mai più e di fuggire le occasioni prossime di peccato. Signore, misericordia, perdonami."]},{"titulo":"A Maria che scioglie i nodi","tipo":"texto","parrafos":["Nostra Signora che scioglie i nodi, tu sai che la mia vita è piena di «nodi» che mi soffocano, mi abbattono, mi opprimono e mi rendono schiavo. Mi affido a te con fiducia perché tu li sciolga e, per la tua potente intercessione, il Signore mi conceda la pace del cuore, la salute del corpo e dello spirito, e mi conduca alla gioia senza fine.","Maria, non lasciarmi cadere nella tentazione del maligno, ma liberami da ogni schiavitù, paura e insicurezza. Donami la tua grazia per seguire la via giusta e non cadere nell’errore.","Sciogli oggi i miei nodi e, quando verrà la mia ora, sciogli il nodo definitivo della mia morte perché, finalmente e definitivamente libero da ogni peccato, io possa entrare nella beatitudine eterna. Amen."]}]},"dias":[{"n":1,"lectura":"L’angelo Gabriele fu mandato da Dio in una città della Galilea, chiamata Nàzaret, a una vergine, promessa sposa di un uomo della casa di Davide, di nome Giuseppe. La vergine si chiamava Maria. L’angelo, entrando da lei, disse: «Rallègrati, piena di grazia: il Signore è con te» (Lc 1,26-28).","suplica":["Maria, tu sei la piena di grazia; la fede mi dice che, con il tuo potere presso Dio, mi concederai ciò che ti chiedo perché, essendo Madre, vuoi ascoltarmi. Ti prego di accogliere la mia supplica: sono certo che hai sempre un rimedio per le mie debolezze, anche quando sembra che non ci sia più nulla da fare.","Maria, piena di grazia, che sciogli i nodi che soffocano i tuoi figli, tendi verso di me le tue mani misericordiose. Ti consegno oggi questo nodo (citar) e tutte le sue conseguenze negative nella mia vita. Ti do questo nodo (citar) che mi tormenta e mi impedisce di vivere nella pace di Dio.","O Maria che sciogli i nodi, so che non si è mai udito che alcuno di quanti sono ricorsi alla tua protezione, implorando il tuo aiuto e chiedendo il tuo soccorso, sia stato da te abbandonato. Per questo credo che tu puoi sciogliere il mio nodo, perché Gesù, il tuo amatissimo Figlio, ti concede ogni potere. Confido che lo scioglierai perché sei mia Madre. So che lo farai perché mi ami con lo stesso amore di Dio. Grazie, Madre mia amata."]},{"n":2,"lectura":"«Non temere, Maria, perché hai trovato grazia presso Dio» (Lc 1,30).","suplica":["Maria, Madre del bell’amore, il mio cuore si rivolge a te perché hai trovato grazia presso Dio. Tu che, accogliendo il saluto dell’angelo nello stupore di tutto il creato, hai generato il tuo Creatore. Madre sempre vergine, abbi pietà di me, peccatore. Sono travolto dalle onde della superbia, dell’ambizione, della calunnia, della gelosia, dell’ira, dell’avarizia e della seduzione della carne.","Mi rivolgo a te, Maria che sciogli i nodi, perché tu chieda per me a tuo Figlio la purezza del cuore, il distacco, l’umiltà, l’abbandono e la fiducia in Dio. In questo giorno mi impegnerò a praticare qualcuna di queste virtù come prova del mio amore.","Metto nelle tue mani questo nodo (citar) che mi impedisce di riflettere la gloria di Dio. Non disprezzare la mia supplica, ma ascoltami propizia ed esaudiscimi.","Donami, Madre di Dio e Madre mia, una scintilla del tuo amore per Gesù."]},{"n":3,"lectura":"«Grandi cose ha fatto per me l’Onnipotente e Santo è il suo nome; di generazione in generazione la sua misericordia per quelli che lo temono. Ha spiegato la potenza del suo braccio, ha disperso i superbi nei pensieri del loro cuore; ha rovesciato i potenti dai troni, ha innalzato gli umili; ha ricolmato di beni gli affamati, ha rimandato i ricchi a mani vuote» (Lc 1,49-53).","suplica":["Sia in ciascuno l’anima di Maria per magnificare il Signore; sia in ciascuno l’anima di Maria per esultare in Dio. Madre di Dio e Madre nostra, accresci la mia fede, fragile e insicura.","Maria mediatrice, le tue mani ricevono e distribuiscono tutte le ricchezze del Re; rivolgi a me i tuoi occhi misericordiosi. Io pongo nelle tue sante mani questo nodo della mia vita (citar) e con esso tutto il rancore e il risentimento che genera.","Aiutami in questo momento a perdonare tutte le persone che, consapevolmente o inconsapevolmente, hanno provocato questo nodo. Davanti a te, cara Madre, e nel nome di tuo Figlio Gesù, mio Salvatore, che, pur così offeso, ha saputo perdonare, io perdono ora queste persone (citar) per sempre."]},{"n":4,"lectura":"In quei giorni Maria si alzò e andò in fretta verso la regione montuosa, in una città di Giuda. Entrata nella casa di Zaccaria, salutò Elisabetta. Appena Elisabetta ebbe udito il saluto di Maria, il bambino sussultò nel suo grembo (Lc 1,39-41).","suplica":["Madre grande nella carità, piena di tenerezza verso i bisognosi, vieni in mio aiuto come hai fatto con Elisabetta. Metto nelle tue mani questo nodo (citar) che mi impedisce di essere in pace, paralizza la mia anima e mi impedisce di camminare verso il Signore e di mettere la mia vita al suo servizio.","Madre, sciogli questo nodo della mia vita (citar). Chiedi a Gesù di guarire la mia fede paralizzata, che si lascia abbattere dalle difficoltà.","Cammina con me, Madre amata, perché io comprenda che gli ostacoli che incontro sul mio cammino sono occasioni per rafforzare la mia fede e imparare a rendere grazie a Dio, che non smette di sostenermi con la sua provvidenza."]},{"n":5,"lectura":"Sua madre custodiva tutte queste cose nel suo cuore (Lc 2,51).","suplica":["Maria, che sciogli i nodi più intricati, generosa e piena di compassione, mi rivolgo a te per mettere ancora una volta nelle tue mani questo nodo (citar). Ti chiedo la sapienza di Dio, per agire nella luce dello Spirito Santo e sciogliere tutte le difficoltà.","Le tue parole sono così piene di dolcezza che in te si riflette il cuore di Dio.","Liberami dall’amarezza, dalla collera e dall’odio che questo nodo (citar), che con insistenza ti presento, ha fatto nascere in me.","Madre amata, donami la tua dolcezza e la tua sapienza perché impari a meditare in silenzio, nel mio cuore, parlando con il Signore in un dialogo d’amore di tutto ciò che mi accade, anche delle piccole cose. Non permettere che io dimentichi di soppesarle, valutarle e guardarle con gli occhi della fede, per scoprire in esse la volontà di Dio."]},{"n":6,"lectura":"Stavano presso la croce di Gesù sua madre, la sorella di sua madre, Maria madre di Clèopa e Maria di Màgdala. Gesù allora, vedendo la madre e accanto a lei il discepolo che egli amava, disse alla madre: «Donna, ecco tuo figlio!». Poi disse al discepolo: «Ecco tua madre!». E da quell’ora il discepolo l’accolse con sé (Gv 19,25-27).","suplica":["Madre, come l’apostolo Giovanni, voglio accoglierti nella mia casa, nel più intimo del mio cuore, per imparare da te a conformarmi a tuo Figlio. Sono davanti a te per affidarmi alle tue cure materne.","Regina di misericordia, ti affido questo nodo della mia vita (citar) e ti chiedo di donarmi un cuore che sappia essere paziente, mentre sciogli questo groviglio.","Insegnami a perseverare nell’ascolto della parola di tuo Figlio, a ricevere con costanza i sacramenti della Riconciliazione e dell’Eucaristia e, come hai fatto nel Cenacolo in attesa della Pentecoste, intercedi presso il tuo amato Figlio perché effonda in abbondanza su di me lo Spirito Santo, Spirito di verità che è sorgente di vita. Accoglilo per me e con me, come nella prima comunità, riunita attorno a te il giorno di Pentecoste.","Lo Spirito apra il mio cuore alla pace, alla giustizia e all’amore."]},{"n":7,"lectura":"«Io porrò inimicizia fra te e la donna, fra la tua stirpe e la sua stirpe: questa ti schiaccerà la testa e tu le insidierai il calcagno» (Gen 3,15).","suplica":["Maria purissima e immacolata, oggi mi rivolgo a te: ti supplico di sciogliere questo nodo della mia vita (citar) e di liberarmi dalle opere del male. Dio ti ha concesso un grande potere su tutti i demoni. Io oggi rinuncio al male e a tutti i legami che mi hanno legato a esso. Proclamo che Gesù è il mio unico Salvatore, il mio unico Signore.","O Maria che sciogli i nodi, schiaccia la testa del maligno. Distruggi le trappole che hanno provocato questi nodi nella mia vita. Madre, che conosci le mie sofferenze e le mie speranze, aiutami nelle prove quotidiane che la vita mi riserva e fa’ che le tenebre non prevalgano sulla luce.","A te, Aurora della salvezza, affido il mio cammino per scoprire sotto la tua guida Cristo, luce del mondo e unico Salvatore, che regna con il Padre e lo Spirito Santo nei secoli dei secoli. Signore, liberami per il tuo preziosissimo Sangue."]},{"n":8,"lectura":"Appena Elisabetta ebbe udito il saluto di Maria, il bambino sussultò nel suo grembo. Elisabetta fu colmata di Spirito Santo ed esclamò a gran voce: «Benedetta tu fra le donne e benedetto il frutto del tuo grembo! A che cosa devo che la madre del mio Signore venga da me? Ecco, appena il tuo saluto è giunto ai miei orecchi, il bambino ha sussultato di gioia nel mio grembo. E beata colei che ha creduto nell’adempimento di ciò che il Signore le ha detto» (Lc 1,41-45).","suplica":["Vergine Madre di Dio, ricca di misericordia, abbi pietà di me e sciogli questo nodo della mia vita (citar). Ho bisogno che tu mi visiti, come hai visitato Elisabetta.","Portami a Gesù, perché egli mi porti allo Spirito Santo. Insegnami a praticare la virtù dell’umiltà, la carità e, come Elisabetta, concedimi di essere colmato di Spirito Santo e della gioia senza fine.","Maria, Madre mia, ti consegno il mio cuore e tutto ciò che ho: la mia casa, la mia famiglia, i miei beni interiori ed esteriori. Ti appartengo per sempre. Metti in me il tuo cuore, perché io possa compiere la volontà di Dio tutti i giorni della mia vita."]},{"n":9,"lectura":"Il terzo giorno vi fu una festa di nozze a Cana di Galilea e c’era la madre di Gesù. Fu invitato alle nozze anche Gesù con i suoi discepoli. Venuto a mancare il vino, la madre di Gesù gli disse: «Non hanno vino». E Gesù le rispose: «Donna, che vuoi da me? Non è ancora giunta la mia ora». Sua madre disse ai servitori: «Qualsiasi cosa vi dica, fatela» (Gv 2,1-5).","suplica":["A te ricorro, o Vergine delle vergini, a te vengo e davanti a te grido come un povero peccatore. Non disprezzare la mia supplica, ma ascoltami propizia ed esaudiscimi. Ti prego di sciogliere questo nodo della mia vita (citar). Tu conosci il dolore e la sofferenza che mi provoca.","Grazie, Madre, perché nella tua misericordia asciughi le lacrime dei miei occhi. Grazie perché mi accogli tra le tue braccia e mi prepari a ricevere un’altra grazia di Dio. Maria che sciogli i nodi, Madre mia amata, ti ringrazio perché sciogli i nodi della mia vita. Nessun tuo gesto, neppure il più piccolo, è banale, ma è pieno di significato. Maria, sii per me esempio e guida. Voglio imitare le tue virtù nelle circostanze concrete in cui Dio mi chiede di vivere. Avvolgimi con il tuo manto d’amore, mettimi sotto la tua protezione e riempimi della pace che solo Dio mi può dare."]}],"jaculatoria":["O Maria, Madre del Buon Consiglio, prendi questo nodo (citar) che mi ostacola e con la forza della tua mano scioglilo.","Maria che sciogli i nodi, prega per me."],"rosario":{"estructura":["1) In ciascuno dei misteri, prega in questo modo:","Enuncia il mistero e leggi il versetto biblico corrispondente, seguito da una breve pausa di riflessione.","Fermati un momento a meditare il mistero che stai celebrando. Apri il tuo cuore alla Vergine Maria e chiedi al Signore di concederti la grazia o la virtù di cui hai bisogno.","2) Recita ogni decina in questo modo:","Padre nostro 10 Ave Maria Gloria al Padre","3) Quando avrai percorso le cinque decine e meditato i cinque misteri, per concludere la preghiera del santo Rosario, recita la Salve Regina e le Litanie lauretane."],"misterios":{"gozo":{"intro":["«Il Vangelo di san Luca dice che, nella famiglia di Nazaret, Gesù “cresceva e si fortificava, pieno di sapienza, e la grazia di Dio era su di lui”. La Madonna fa proprio questo in noi, ci aiuta a crescere umanamente e nella fede, ad essere forti e non cedere alla tentazione dell’essere uomini e cristiani in modo superficiale, ma a vivere con responsabilità, a tendere sempre più in alto» (papa Francesco)."],"misterios":[{"titulo":"L’annuncio dell’angelo a Maria","cita":"L’angelo [Gabriele], entrando da lei, disse: «Rallègrati, piena di grazia: il Signore è con te. Concepirai un figlio, lo darai alla luce e lo chiamerai Gesù» (Lc 1,28.31).","meditacion":["Dio ci sorprende; è proprio nella povertà, nella debolezza, nell’umiltà che si manifesta e ci dona il suo amore che ci salva, ci guarisce, ci dà forza. Chiede solo che seguiamo la sua parola e ci fidiamo di lui. Questa è l’esperienza della Vergine Maria: davanti all’annuncio dell’angelo, non nasconde la sua meraviglia.","È lo stupore di vedere che Dio, per farsi uomo, ha scelto proprio lei, una semplice ragazza di Nazaret, che non vive nei palazzi del potere e della ricchezza, che non ha compiuto imprese straordinarie, ma che è aperta a Dio, sa fidarsi di lui, anche se non comprende tutto: «Ecco la serva del Signore: avvenga per me secondo la tua parola» (Lc 1,38). È la sua risposta. Dio ci sorprende sempre, rompe i nostri schemi, mette in crisi i nostri progetti e ci dice: fidati di me, non avere paura, lasciati sorprendere, esci da te stesso e seguimi! Oggi chiediamoci se abbiamo paura di quello che Dio potrebbe chiederci o di quello che ci chiede. Mi lascio sorprendere da Dio, come ha fatto Maria, o mi chiudo nelle mie sicurezze, sicurezze materiali, sicurezze intellettuali, sicurezze ideologiche, sicurezze dei miei progetti? Lascio veramente entrare Dio nella mia vita? Come gli rispondo?"]},{"titulo":"La visita di Maria a santa Elisabetta","cita":"Appena Elisabetta ebbe udito il saluto di Maria, il bambino sussultò nel suo grembo. Elisabetta fu colmata di Spirito Santo ed esclamò a gran voce: «Benedetta tu fra le donne e benedetto il frutto del tuo grembo!» (Lc 1,41-42).","meditacion":["Maria, dopo l’annunciazione, il primo gesto che compie è di carità verso l’anziana parente Elisabetta; e le prime parole che pronuncia sono: «L’anima mia magnifica il Signore», cioè un canto di lode e di ringraziamento a Dio, non solo per quello che ha operato in lei, ma per la sua azione in tutta la storia della salvezza. Tutto è suo dono. Se noi possiamo capire che tutto è dono di Dio, quanta felicità nel nostro cuore! Dire grazie è così facile, eppure così difficile! Quante volte ci diciamo grazie in famiglia? È una delle parole chiave della convivenza. «Permesso», «scusa», «grazie»: se in una famiglia si dicono queste tre parole, la famiglia va avanti. «Permesso», «scusami», «grazie». Quante volte diciamo «grazie» in famiglia? Quante volte diciamo grazie a chi ci aiuta, ci è vicino, ci accompagna nella vita? Spesso diamo tutto per scontato! E questo avviene anche con Dio. È facile andare dal Signore a chiedere qualcosa, ma andare a ringraziarlo: «Mah, non mi viene»."]},{"titulo":"La nascita di Gesù a Betlemme","cita":"«Oggi, nella città di Davide, è nato per voi un Salvatore, che è Cristo Signore. Questo per voi il segno: troverete un bambino avvolto in fasce, adagiato in una mangiatoia» (Lc 2,11-12).","meditacion":["Guardiamo a Dio come al Dio della vita, guardiamo alla sua legge, al messaggio del Vangelo come a una via di libertà e di vita. Il Dio vivente ci fa liberi! Diciamo sì all’amore e no all’egoismo, diciamo sì alla vita e no alla morte, diciamo sì alla libertà e no alla schiavitù dei tanti idoli del nostro tempo. In una parola, diciamo sì a Dio, che è amore, vita e libertà, e mai delude (cfr 1Gv 4,8; Gv 11,25; 8,32), a Dio che è il Vivente e il Misericordioso. Solo la fede nel Dio vivente ci salva; nel Dio che in Gesù Cristo ci ha donato la sua vita con il dono dello Spirito Santo e ci fa vivere da veri figli di Dio con la sua misericordia. Questa fede ci rende liberi e felici."]},{"titulo":"La presentazione di Gesù al tempio","cita":"Quando furono compiuti i giorni della loro purificazione rituale, secondo la legge di Mosè, portarono il bambino a Gerusalemme per presentarlo al Signore (Lc 2,22).","meditacion":["Quante difficoltà ci sono nella vita di ognuno, nella nostra gente, nelle nostre comunità! Ma per quanto grandi possano apparire, Dio non lascia mai che ne siamo sommersi. Il «drago», il male, c’è nella nostra storia, ma non è lui il più forte. Il più forte è Dio, e Dio è la nostra speranza! Non perdiamo mai la speranza! Non spegniamola mai nel nostro cuore! Un popolo ha futuro se va avanti con i giovani, con la loro forza, perché lo portano avanti; e con gli anziani, perché loro sono quelli che danno la saggezza della vita."]},{"titulo":"Il ritrovamento di Gesù tra i dottori nel tempio","cita":"«Non sapevate che io devo occuparmi delle cose del Padre mio?». Sua madre custodiva tutte queste cose nel suo cuore (Lc 2,49.51).","meditacion":["Non basta leggere le Sacre Scritture, bisogna ascoltare Gesù che parla in esse; è proprio Gesù che parla nelle Scritture, è Gesù che parla in esse. Bisogna essere come antenne che ricevono, sintonizzate sulla Parola di Dio, per essere antenne che trasmettono! Si riceve e si trasmette. È lo Spirito di Dio che rende vive le Scritture, le fa comprendere in profondità, nel loro senso vero e pieno. Chiediamoci: che posto ha la Parola di Dio nella mia vita, la vita di ogni giorno? Sono sintonizzato su Dio o sulle tante parole di moda, o su me stesso? Una domanda che ognuno di noi deve farsi: sono un cristiano «a singhiozzo», o sono un cristiano sempre? La cultura del provvisorio, del relativo entra anche nel vivere la fede. Dio ci chiede di essergli fedeli, ogni giorno, nelle azioni quotidiane e aggiunge che, anche se a volte non gli siamo fedeli, lui è sempre fedele e con la sua misericordia non si stanca di tenderci la mano per risollevarci, di incoraggiarci a riprendere il cammino, di ritornare a lui e dirgli la nostra debolezza perché ci doni la sua forza. Questo è il cammino definitivo: sempre col Signore, anche nelle nostre debolezze, anche nei nostri peccati. Mai andare sulla strada del provvisorio. Questo ci uccide. La fede è fedeltà definitiva, come quella di Maria."]}]},"luz":{"intro":["«Maria è madre, e una madre si preoccupa soprattutto della salute dei suoi figli, sa curarla sempre con grande e tenero amore. La Madonna custodisce la nostra salute. Che cosa vuol dire questo, che la Madonna custodisce la nostra salute? Penso soprattutto a tre aspetti: ci aiuta a crescere, ad affrontare la vita, ad essere liberi» (papa Francesco)."],"misterios":[{"titulo":"Il battesimo di Gesù al Giordano","cita":"Ed ecco, in quei giorni, Gesù venne da Nàzaret di Galilea e fu battezzato nel Giordano da Giovanni. E subito, uscendo dall’acqua, vide squarciarsi i cieli e lo Spirito discendere verso di lui come una colomba (Mc 1,9-10).","meditacion":["La Chiesa ci dona la vita di fede nel Battesimo: quello è il momento in cui ci fa nascere come figli di Dio, il momento in cui ci dona la vita di Dio, ci genera come madre. Il legame è vitale, come quello che si ha con la propria mamma, perché, come afferma sant’Agostino, «la Chiesa è realmente madre dei cristiani». Chiediamoci: come vedo io la Chiesa? Se sono riconoscente ai miei genitori perché mi hanno dato la vita, sono riconoscente alla Chiesa perché mi ha generato nella fede attraverso il Battesimo? Quanti cristiani ricordano la data del proprio Battesimo? La data del Battesimo è la data della nostra nascita alla Chiesa, la data nella quale la nostra mamma Chiesa ci ha partorito! Andate a cercare bene qual è la data del vostro Battesimo, per festeggiarla, per ringraziare il Signore di questo dono. Lo farete? Amiamo la Chiesa come si ama la propria mamma, sapendo anche comprendere i suoi difetti."]},{"titulo":"Le nozze di Cana","cita":"[Vi fu una festa di nozze a Cana di Galilea e,] venuto a mancare il vino, la madre di Gesù gli disse: «Non hanno vino». E Gesù le rispose: «Donna, che vuoi da me? Non è ancora giunta la mia ora». Sua madre disse ai servitori: «Qualsiasi cosa vi dica, fatela» (Gv 2,3-5).","meditacion":["Siamo venuti a bussare alla porta della casa di Maria. Lei ci ha aperto, ci ha fatto entrare e ci mostra suo Figlio. Ora lei ci chiede: «Qualsiasi cosa vi dica, fatela». Sì, Madre, noi ci impegniamo a fare quello che Gesù ci dirà! E lo faremo con speranza, fiduciosi nelle sorprese di Dio e pieni di gioia."]},{"titulo":"L’annuncio del regno di Dio","cita":"Gesù andò nella Galilea, proclamando il vangelo di Dio, e diceva: «Il tempo è compiuto e il regno di Dio è vicino; convertitevi e credete nel Vangelo» (Mc 1,14-15).","meditacion":["Condividere l’esperienza della fede, testimoniare la fede, annunciare il Vangelo è il mandato che il Signore affida a tutta la Chiesa, anche a te; è un comando che, però, non nasce dalla volontà di dominio, dalla volontà di potere, ma dalla forza dell’amore, dal fatto che Gesù per primo è venuto in mezzo a noi e ci ha dato tutto se stesso, ha dato la sua vita per salvarci e mostrarci l’amore e la misericordia di Dio. Gesù non ci tratta da schiavi, ma da persone libere, da amici, da fratelli; e non solo ci invia, ma ci accompagna, è sempre accanto a noi in questa missione d’amore. Dove ci invia Gesù? Non ci sono confini, non ci sono limiti: ci invia a tutti. Il Vangelo è per tutti e non solo per alcuni. Non è solo per quelli che ci sembrano più vicini, più ricettivi, più accoglienti. È per tutti. Non abbiate paura di portare Cristo in ogni ambiente, fino alle periferie esistenziali, anche a chi sembra più lontano, più indifferente. Il Signore cerca tutti, vuole che tutti sentano il calore della sua misericordia e del suo amore."]},{"titulo":"La trasfigurazione di Gesù","cita":"Gesù prese con sé Pietro, Giovanni e Giacomo e salì sul monte a pregare. Mentre pregava, il suo volto cambiò d’aspetto e la sua veste divenne candida e sfolgorante (Lc 9,28-29).","meditacion":["Predichiamo il Vangelo con l’esempio e poi con le parole! Prima di tutto, nella nostra vita gli altri devono poter leggere il Vangelo. Anche qui senza timore, con i nostri difetti, che cerchiamo di correggere, con i nostri limiti, che il Signore conosce, ma anche con la nostra generosità, lasciando che lui agisca in noi."]},{"titulo":"L’istituzione dell’Eucaristia","cita":"«Prendete, mangiate: questo è il mio corpo». Poi prese il calice, rese grazie e lo diede loro, dicendo: «Bevetene tutti, perché questo è il mio sangue dell’alleanza, che è versato per molti per il perdono dei peccati» (Mt 26,26-28).","meditacion":["Lontano da Dio il vino della gioia, il vino della speranza, si esaurisce. Se ci avviciniamo a lui, se rimaniamo con lui, ciò che è difficoltà, ciò che è peccato, si trasforma in vino nuovo di amicizia con lui. Dio riserva sempre il meglio per noi. Ma chiede che noi ci lasciamo sorprendere dal suo amore, che accogliamo le sue sorprese. Fidiamoci di Dio!"]}]},"dolor":{"intro":["«Gesù Cristo, con la sua passione, morte e risurrezione, ci porta la salvezza, ci dona la grazia e la gioia di essere figli di Dio, di chiamarlo in verità con il nome di Padre» (papa Francesco)."],"misterios":[{"titulo":"L’agonia di Gesù nell’orto degli Ulivi","cita":"Entrato nella lotta, pregava più intensamente, e il suo sudore diventò come gocce di sangue che cadono a terra (Lc 22,44).","meditacion":["In ogni fratello e sorella in difficoltà noi abbracciamo la carne sofferente di Cristo. Abbiamo tutti bisogno di guardare l’altro con gli occhi di amore di Cristo, imparare ad abbracciare chi è nel bisogno, per esprimere vicinanza, affetto, amore. Ma abbracciare non è sufficiente. Tendiamo la mano a chi è in difficoltà, a chi è caduto nel buio della dipendenza, magari senza sapere come, e diciamogli: «Puoi rialzarti, puoi risalire; è faticoso, ma è possibile, se tu lo vuoi»."]},{"titulo":"La flagellazione di Gesù","cita":"Allora Pilato fece prendere Gesù e lo fece flagellare (Gv 19,1).","meditacion":["Il cristiano, prima di chiacchierare, deve mordersi la lingua. Voi non sapete il male che fanno le chiacchiere, quanto feriscono. È meglio mordersi la lingua; questo ci farà bene: la lingua si gonfia e non si può parlare, così non si può chiacchierare. Ogni volta che giudichiamo i nostri fratelli nel nostro cuore, e peggio quando ne parliamo con gli altri, siamo cristiani omicidi. Un cristiano omicida... Non lo dico io, eh, lo dice il Signore! Su questo non ci sono sfumature. Se parli male del fratello, uccidi il fratello. E noi, ogni volta che lo facciamo, imitiamo il gesto di Caino, il primo omicida della storia."]},{"titulo":"L’incoronazione di spine di Gesù","cita":"[I soldati] intrecciarono una corona di spine, gliela posero sul capo e gli misero una canna nella mano destra (Mt 27,29).","meditacion":["La cosa più importante è camminare insieme, collaborando, aiutandosi a vicenda; chiedersi scusa, riconoscere i propri sbagli, ma anche accettare le scuse degli altri perdonando – quanto è importante questo! –. Alle volte penso ai matrimoni che, dopo tanti anni, si separano. «Non ci intendiamo, ci siamo allontanati». Forse non hanno saputo chiedere scusa a tempo; forse non hanno saputo perdonare a tempo. E sempre, ai novelli sposi, io do questo consiglio: «Litigate quanto volete. Se volano i piatti, lasciateli. Ma mai finire la giornata senza fare la pace! Mai!». Se i matrimoni imparano a dire: «Scusa, ero stanco», o soltanto un gestino, è questa la pace, e poi riprendere la vita il giorno dopo. Questo è un bel segreto, e questo evita queste separazioni dolorose. Quanto è importante camminare uniti, senza fughe in avanti, senza nostalgie del passato! E mentre si cammina si parla, ci si conosce, ci si racconta gli uni agli altri, si cresce come famiglia. Qui chiediamoci: come camminiamo? Camminiamo insieme? Che cosa faccio io perché la famiglia cammini unita?"]},{"titulo":"La salita di Gesù al Calvario con la croce","cita":"Allora lo consegnò loro perché fosse crocifisso. Essi presero Gesù ed egli, portando la croce, si avviò verso il luogo detto «del Cranio», in ebraico Gòlgota (Gv 19,16-17).","meditacion":["Dove c’è la croce, per noi cristiani c’è la speranza, sempre. Se non c’è la speranza, noi non siamo cristiani. Per questo a me piace dire: non lasciatevi rubare la speranza. Che non ci rubino la speranza, perché questa forza è una grazia, un dono di Dio che ci porta avanti guardando il cielo."]},{"titulo":"La crocifissione e morte di Gesù","cita":"Uno dei soldati con una lancia gli colpì il fianco, e subito ne uscì sangue e acqua (Gv 19,34).","meditacion":["Il Crocifisso non ci parla di sconfitta, di fallimento; paradossalmente ci parla di una morte che è vita, che genera vita, perché ci parla di amore, perché è l’Amore di Dio incarnato, e l’Amore non muore, anzi, sconfigge il male e la morte. Chi si lascia guardare da Gesù crocifisso viene ri-creato, diventa una «nuova creatura». Da qui parte tutto: è l’esperienza della grazia che trasforma, l’essere amati senza merito, pur essendo peccatori."]}]},"gloria":{"intro":["«La Vergine Santa ha fatto della sua esistenza un incessante e prezioso dono a Dio, perché amava il Signore. Maria è un esempio e uno stimolo per tutti noi a vivere la carità verso il prossimo, non per una sorta di dovere sociale, ma partendo dall’amore di Dio, dalla carità di Dio. Maria è quella che ci porta a Gesù e ci insegna come andare da Gesù; è la Madre di Gesù e nostra e fa famiglia, con noi e con Gesù» (papa Francesco)."],"misterios":[{"titulo":"La risurrezione di Gesù","cita":"L’angelo disse alle donne: «Voi non abbiate paura! So che cercate Gesù, il crocifisso. Non è qui: è risorto!» (Mt 28,5-6).","meditacion":["Il cristiano è gioioso, non è mai triste. Dio ci accompagna. Vorrei ripetervelo: non lasciatevi rubare la speranza! Non lasciatevi rubare la speranza! Ma vorrei dire anche: non rubiamo la speranza, anzi diventiamo portatori di speranza!"]},{"titulo":"L’ascensione di Gesù al cielo","cita":"Il Signore Gesù, dopo aver parlato con loro, fu elevato in cielo e sedette alla destra di Dio (Mc 16,19).","meditacion":["Gesù ci ha mostrato che il volto di Dio è quello di un Padre che ci ama. Il peccato e la morte sono stati sconfitti. Il cristiano non può essere pessimista! Non ha la faccia di chi sembra trovarsi in un lutto perpetuo. Se siamo davvero innamorati di Cristo e sentiamo quanto ci ama, il nostro cuore si «infiammerà» di una gioia tale che contagerà quanti vivono vicini a noi."]},{"titulo":"La discesa dello Spirito Santo","cita":"Apparvero loro lingue come di fuoco, che si dividevano, e si posarono su ciascuno di loro, e tutti furono colmati di Spirito Santo (At 2,3-4).","meditacion":["Siamo aperti allo Spirito Santo? Ci lasciamo guidare da lui? Il cristiano è un uomo spirituale, ma questo non significa che sia una persona che vive «tra le nuvole», fuori dalla realtà, come se fosse un fantasma. No! Il cristiano è una persona che pensa e agisce nella vita quotidiana secondo Dio, una persona che lascia che lo Spirito Santo animi, nutra la sua vita, perché sia piena, da veri figli. Questo significa realismo e fecondità. Chi si lascia condurre dallo Spirito Santo è realista, sa misurare e valutare la realtà, ed è anche fecondo: la sua vita genera vita attorno a sé."]},{"titulo":"L’assunzione di Maria al cielo","cita":"Grandi cose ha fatto per me l’Onnipotente e Santo è il suo nome (Lc 1,49).","meditacion":["Il Signore vi è vicino e vi porta per mano. Guardatelo nei momenti più duri e vi darà consolazione e speranza. Confidate anche nell’amore materno di Maria, sua Madre. Abbiamo una Madre che sempre intercede per la vita dei suoi figli, per noi."]},{"titulo":"L’incoronazione di Maria","cita":"Un segno grandioso apparve nel cielo: una donna vestita di sole, con la luna sotto i suoi piedi e, sul capo, una corona di dodici stelle (Ap 12,1).","meditacion":["Tenete sempre la Madonna con voi, pregate il Rosario, per favore... Non lasciatelo! Tenete sempre la Madonna con voi nella vostra casa, come l’aveva l’apostolo Giovanni. Che lei sempre vi accompagni e vi protegga. E pregate anche per me, perché anch’io ho bisogno di preghiere, perché sono un povero peccatore."]}]}},"salve":["Salve, Regina, madre di misericordia, vita, dolcezza e speranza nostra, salve. A te ricorriamo, esuli figli di Eva; a te sospiriamo, gementi e piangenti in questa valle di lacrime. Orsù dunque, avvocata nostra, rivolgi a noi gli occhi tuoi misericordiosi. E mostraci, dopo questo esilio, Gesù, il frutto benedetto del tuo seno. O clemente, o pia, o dolce Vergine Maria!"],"letanias":[{"i":"Signore, pietà","r":"Signore, pietà"},{"i":"Cristo, pietà","r":"Cristo, pietà"},{"i":"Signore, pietà","r":"Signore, pietà"},{"i":"Cristo, ascoltaci","r":"Cristo, ascoltaci"},{"i":"Cristo, esaudiscici","r":"Cristo, esaudiscici"},{"i":"Padre del cielo, che sei Dio","r":"abbi pietà di noi"},{"i":"Figlio, Redentore del mondo, che sei Dio","r":"abbi pietà di noi"},{"i":"Spirito Santo, che sei Dio","r":"abbi pietà di noi"},{"i":"Santa Trinità, unico Dio","r":"abbi pietà di noi"},{"i":"Santa Maria","r":"prega per noi"},{"i":"Santa Madre di Dio","r":"prega per noi"},{"i":"Santa Vergine delle vergini","r":"prega per noi"},{"i":"Madre di Cristo","r":"prega per noi"},{"i":"Madre della Chiesa","r":"prega per noi"},{"i":"Madre della divina grazia","r":"prega per noi"},{"i":"Madre purissima","r":"prega per noi"},{"i":"Madre castissima","r":"prega per noi"},{"i":"Madre sempre vergine","r":"prega per noi"},{"i":"Madre immacolata","r":"prega per noi"},{"i":"Madre degna d’amore","r":"prega per noi"},{"i":"Madre ammirabile","r":"prega per noi"},{"i":"Madre del buon consiglio","r":"prega per noi"},{"i":"Madre del Creatore","r":"prega per noi"},{"i":"Madre del Salvatore","r":"prega per noi"},{"i":"Vergine prudentissima","r":"prega per noi"},{"i":"Vergine degna di onore","r":"prega per noi"},{"i":"Vergine degna di lode","r":"prega per noi"},{"i":"Vergine potente","r":"prega per noi"},{"i":"Vergine clemente","r":"prega per noi"},{"i":"Vergine fedele","r":"prega per noi"},{"i":"Specchio di giustizia","r":"prega per noi"},{"i":"Sede della sapienza","r":"prega per noi"},{"i":"Causa della nostra letizia","r":"prega per noi"},{"i":"Vaso spirituale","r":"prega per noi"},{"i":"Vaso d’onore","r":"prega per noi"},{"i":"Vaso insigne di devozione","r":"prega per noi"},{"i":"Rosa mistica","r":"prega per noi"},{"i":"Torre di Davide","r":"prega per noi"},{"i":"Torre d’avorio","r":"prega per noi"},{"i":"Casa d’oro","r":"prega per noi"},{"i":"Arca dell’alleanza","r":"prega per noi"},{"i":"Porta del cielo","r":"prega per noi"},{"i":"Stella del mattino","r":"prega per noi"},{"i":"Salute degli infermi","r":"prega per noi"},{"i":"Rifugio dei peccatori","r":"prega per noi"},{"i":"Consolatrice degli afflitti","r":"prega per noi"},{"i":"Aiuto dei cristiani","r":"prega per noi"},{"i":"Regina degli Angeli","r":"prega per noi"},{"i":"Regina dei Patriarchi","r":"prega per noi"},{"i":"Regina dei Profeti","r":"prega per noi"},{"i":"Regina degli Apostoli","r":"prega per noi"},{"i":"Regina dei Martiri","r":"prega per noi"},{"i":"Regina dei Confessori","r":"prega per noi"},{"i":"Regina delle Vergini","r":"prega per noi"},{"i":"Regina di tutti i Santi","r":"prega per noi"},{"i":"Regina concepita senza peccato originale","r":"prega per noi"},{"i":"Regina assunta in cielo","r":"prega per noi"},{"i":"Regina del santo Rosario","r":"prega per noi"},{"i":"Regina della famiglia","r":"prega per noi"},{"i":"Regina della pace","r":"prega per noi"}],"cordero":[["Agnello di Dio, che togli i peccati del mondo,","perdonaci, o Signore."],["Agnello di Dio, che togli i peccati del mondo,","ascoltaci, o Signore."],["Agnello di Dio, che togli i peccati del mondo,","abbi pietà di noi."]],"versiculo":["Prega per noi, santa Madre di Dio,","perché siamo resi degni delle promesse di Cristo."],"oremos":["Concedi ai tuoi fedeli, Signore Dio nostro, di godere sempre la salute del corpo e dello spirito, e per la gloriosa intercessione di Maria santissima, sempre vergine, salvaci dai mali che ora ci rattristano e guidaci alla gioia senza fine. Per Cristo nostro Signore. Amen."],"cierre_decena":{"rubrica":"Puoi concludere la recita di ogni decina con una delle seguenti invocazioni:","opcionales":[{"texto":"«O Gesù, perdona le nostre colpe, preservaci dal fuoco dell’inferno, porta in cielo tutte le anime, specialmente le più bisognose della tua misericordia».","nota":"(La Madonna di Fatima, 13 luglio 1917)"},{"texto":"«Mio Dio, io credo, adoro, spero e ti amo. Ti chiedo perdono per quelli che non credono, non adorano, non sperano e non ti amano».","nota":""},{"texto":"«Santissima Trinità, Padre, Figlio e Spirito Santo, ti adoro profondamente e ti offro il preziosissimo Corpo, Sangue, Anima e Divinità di Gesù Cristo, presente in tutti i tabernacoli della terra, in riparazione degli oltraggi, sacrilegi e indifferenze con cui Egli stesso è offeso. E per i meriti infiniti del suo Sacratissimo Cuore e del Cuore Immacolato di Maria, ti domando la conversione dei poveri peccatori».","nota":"(L’angelo della pace ai tre pastorelli di Fatima, nel 1916)"}],"fijas":[{"i":"Regina della pace,","r":"prega per noi."},{"i":"San Giuseppe,","r":"prega per noi."},{"i":"Santi arcangeli Michele, Gabriele e Raffaele,","r":"pregate per noi."}],"oraciones":[{"titulo":"Angelo custode","texto":"Angelo di Dio, che sei il mio custode, illumina, custodisci, reggi e governa me, che ti fui affidato dalla pietà celeste. Amen."},{"titulo":"Per i defunti","texto":"L’eterno riposo dona loro, o Signore, e splenda ad essi la luce perpetua. Riposino in pace. Amen."}],"alabados":["Sempre siano lodati","i santi nomi di Gesù, Giuseppe e Maria."]},"base":[{"titulo":"Padre nostro","texto":"Padre nostro, che sei nei cieli, sia santificato il tuo nome, venga il tuo regno, sia fatta la tua volontà, come in cielo così in terra. Dacci oggi il nostro pane quotidiano, e rimetti a noi i nostri debiti come anche noi li rimettiamo ai nostri debitori, e non abbandonarci alla tentazione, ma liberaci dal male. Amen."},{"titulo":"Ave Maria","texto":"Ave, o Maria, piena di grazia, il Signore è con te. Tu sei benedetta fra le donne e benedetto è il frutto del tuo seno, Gesù. Santa Maria, Madre di Dio, prega per noi peccatori, adesso e nell’ora della nostra morte. Amen."},{"titulo":"Gloria","texto":"Gloria al Padre e al Figlio e allo Spirito Santo. Come era nel principio, e ora e sempre, nei secoli dei secoli. Amen."}]},"finales":[{"titulo":"Alla Madre di Dio che scioglie i nodi","tipo":"lista","antes":["Nostra Signora che scioglie i nodi, non si è mai udito che alcuno di quanti sono ricorsi alla tua protezione, implorando il tuo aiuto e chiedendo il tuo soccorso, sia stato da te abbandonato. Animato da tale fiducia, anch’io ricorro a te, o Madre, Vergine delle vergini! E, pur gemendo sotto il peso dei miei peccati, oso comparire alla tua presenza sovrana.","Non disprezzare le mie suppliche, o Madre di Dio, ma piega ad esse il tuo orecchio e degnati di esaudirle benigna.","Tu sei colei che scioglie tutti i nodi!","Con le tue mani colme dell’amore di Dio sciogli, come fossero nodi, i problemi e gli ostacoli che incontro sul mio cammino, ed essi diventano come un nastro diritto, come una strada piana.","Rivolgi a me il tuo sguardo pieno di compassione, guarda quanti nodi opprimono la mia vita. Tu conosci le mie sofferenze e il mio dolore. Tu sai quanto mi paralizzano questi nodi.","Santa Maria, Madre di Dio e Vergine piena di grazia, a te Dio ha affidato il compito di sciogliere i nodi della vita dei tuoi figli, per questo oggi metto nelle tue mani:"],"items":["i nodi di tutte le mie difficoltà materiali e spirituali, familiari, scolastiche, professionali, in tutte le mie relazioni;","i nodi di tutti i problemi che mi angosciano da anni e che non so come risolvere;","i nodi di tutte quelle situazioni bloccate o ingarbugliate, per le quali non vedo soluzione;","i nodi delle liti familiari, dell’incomprensione tra genitori e figli, tra anziani e giovani; della mancanza di rispetto, della violenza;","i nodi del rancore e del risentimento tra gli sposi, la mancanza di pace e di gioia in famiglia;","i nodi dei tradimenti tra i coniugi, degli sposi che si separano, della divisione nelle famiglie;","i nodi provocati dal figlio che si droga, che è malato, che ha lasciato la casa, che si è allontanato da Dio, che si è tolto la vita;","i nodi dell’alcolismo, del gioco d’azzardo, tutti i miei vizi e quelli delle persone che amo;","i nodi delle ferite che mi hanno causato gli altri;","i nodi delle ferite che io ho causato agli altri;","i nodi del rancore e dell’odio che mi tormentano;","i nodi del senso di colpa, dell’aborto, delle malattie, della disoccupazione, delle paure, della discordia, del fallimento, dei debiti, della tristezza, del divorzio, delle preoccupazioni economiche, dello stress, della solitudine;","i nodi dell’occultismo, della magia, della superstizione;","i nodi dell’incredulità, della superbia, dell’invidia, della gelosia e dei sospetti;","i nodi dell’avidità di denaro, di potere, della vanità;","i nodi dei pettegolezzi, delle chiacchiere oziose, della diffamazione, delle indiscrezioni e del parlare male degli altri;","i nodi che io stesso mi sono procurato a causa del mio orgoglio;","i nodi del mio cuore, che mi impediscono di essere libero e di amare con generosità."],"despues":["Maria, nelle tue mani non c’è nodo che non possa essere sciolto. Per il tuo potere di intercessione presso tuo Figlio Gesù, mio Salvatore, ricevi oggi in particolare questo nodo (citar). Per la gloria di Dio, ti chiedo di scioglierlo, e di scioglierlo per sempre.","Spero in te, l’unica Consolatrice che Dio mi ha dato; tu sei la fortezza delle mie fragili forze, la ricchezza delle mie miserie, la liberazione da tutto ciò che mi impedisce di stare con Cristo; accogli la mia richiesta. Guardami, guidami, proteggimi, tu sei il mio unico e sicuro rifugio. Maria che sciogli i nodi, prega per me tuo Figlio Gesù Cristo, nostro Signore, adesso e nell’ora della mia morte. Amen."]},{"titulo":"Preghiera a Maria che scioglie i nodi","tipo":"texto","parrafos":["O Maria, Madre di Cristo e della Chiesa, Regina dei popoli e delle famiglie, tu che hai portato nel tuo grembo il Figlio di Dio, che ha spezzato il giogo che ci incatenava al peccato, concedici la grazia di vivere nella vera libertà dei figli di Dio. Con le tue sante mani, Vergine purissima, Regina della pace, sciogli i numerosi e intricati nodi che complicano e rattristano la nostra vita. Aiutaci a metterci al servizio del bene con cuore semplice e puro, sempre disposti al perdono e alla riconciliazione. Fa’ che, nulla anteponendo all’amore di Cristo, nel suo stesso amore amiamo sinceramente i nostri fratelli. Amen."]},{"titulo":"Ringraziamento a Maria che scioglie i nodi","tipo":"texto","parrafos":["Maria che sciogli i nodi, con il cuore lieto e l’animo colmo della più viva gratitudine, torno a te per ringraziarti delle grazie ricevute.","Voglio essere completamente tuo. Aiutami a percorrere con te il cammino della fedeltà assoluta a Gesù nella sua Chiesa.","Grazie, Vergine santa, perché mi tieni sempre amorevolmente per mano e guidi il mio cuore verso Gesù.","Grazie perché mi insegni a cercare il mio bene solo in Dio, che è sorgente di ogni pace e di ogni grazia.","Grazie perché mi insegni a voler compiere unicamente la sua volontà, per realizzare in me il disegno che egli ha stabilito dall’eternità.","Grazie perché mi insegni a vivere con Gesù e per Gesù. Grazie perché, se cado, mi aiuti a tornare a lui con il sacramento del Perdono e della gioia. Così, Vergine santa, con la pace di Dio nel cuore, potrò portare a tutti la vera gioia e la pace. Donami un grande amore per tutti i sacramenti, segni che tuo Figlio ci ha lasciato per incontrarlo.","Grazie, Maria, perché proteggi la mia famiglia; fa’ che rimanga sempre unita e salda nell’amore infinito di Dio.","Grazie, Maria, perché dispensi alla mia famiglia le grazie spirituali e materiali di cui ha bisogno; accresci in particolare la fede, la speranza e la carità.","Grazie per avermi fatto conoscere la potenza di questa novena. Amen."]}],"otras":[{"titulo":"Preghiera a Maria che scioglie i nodi","nota":"Con l’imprimatur dell’allora arcivescovo di Buenos Aires, mons. Bergoglio.","parrafos":["Santa Maria, piena della Presenza di Dio, durante i giorni della tua vita accettasti con tutta umiltà la volontà del Padre, e il maligno non fu mai capace di avvilupparti con i suoi inganni. Già insieme a tuo Figlio intercedesti per le nostre difficoltà e, con tutta semplicità e pazienza, ci desti l’esempio di come sbrogliare la matassa delle nostre vite. E rimanendo per sempre Madre nostra, metti in ordine e rendi più chiari i legami che ci uniscono al Signore.","Santa Maria, Madre di Dio e Madre nostra, tu che con cuore materno sciogli i nodi che intralciano la nostra vita, ti chiediamo di ricevere nelle tue mani... e di liberarci dai legami e dalle confusioni con cui ci tormenta colui che è nostro nemico.","Per la tua grazia, per la tua intercessione, con il tuo esempio, liberaci da ogni male, Signora nostra, e sciogli i nodi che ci impediscono di unirci a Dio perché, liberi da ogni confusione ed errore, lo troviamo in tutte le cose, abbiamo in lui riposti i nostri cuori e possiamo servirlo sempre nei nostri fratelli. Amen."]},{"titulo":"Supplica a Maria che scioglie i nodi","nota":"recitata su Tv2000","parrafos":["Santa Maria, Madre di Dio, tu che sei stata donna e madre, che hai risposto a Dio: «Sia fatta la tua volontà», infondi in noi la tua forza, la forza della tua fede e del tuo amore.","Vergine Maria, oggi vengo a te con il cuore pieno di sofferenze. Vengo a piangere le mie sofferenze tra le braccia di una Madre che ci ascolta sempre, che tutto sopporta, che tutto crede. Per questo ricorro a te, Maria, Madre mia: liberami e togli i nodi che mi impediscono di essere felice, di avvicinarmi a te e a tuo Figlio.","La mia preghiera trasformi il mio cuore di pietra e mi permetta di sperare in un mondo migliore e più generoso.","Maria, tu che sciogli i nodi, ascolta la mia preghiera. Amen."]},{"titulo":"Tu sei colei che scioglie tutti i nostri nodi","nota":"Mons. Marco Frisina","parrafos":["Santa Maria, Madre di Dio e Vergine piena di grazia, tu sei colei che scioglie tutti i nostri nodi! Con le tue mani piene dell’amore di Dio sciogli, come fossero nodi, gli ostacoli lungo il nostro cammino che, nelle tue mani, diventano un nastro diritto, come un sentiero spianato dall’amore di Dio!","O santa e ammirabile Vergine e Madre! Sciogli tutti i nodi che noi stessi ci siamo fatti a causa della nostra ostinazione, e anche tutti quelli che ostacolano il nostro cammino.","Illuminali con la luce dei tuoi occhi perché diventino trasparenti e, pieni di gratitudine, possiamo sciogliere con le tue mani ciò che a noi sembra impossibile.","O Maria, tu che sciogli i nodi, sii la nostra cara Madre, prendi le nostre mani e rendile docili e piene della tua forza perché le tue mani, attraverso le nostre, portino pace, sollievo e aiuto. Amen."]},{"titulo":"Supplica a Maria che scioglie i nodi","nota":"Sant’Alfonso Maria de’ Liguori","parrafos":["O Vergine immacolata, Vergine benedetta, tu sei la dispensatrice universale di tutte le grazie. Sei la speranza di tutti gli uomini e la mia speranza. Rendo grazie sempre e in ogni momento al mio amato Signore Gesù, che mi ha concesso di conoscerti e mi ha fatto comprendere che posso ricevere le grazie divine e salvarmi. Così sei tu stessa, augusta Madre di Dio, perché so, grazie ai meriti di Gesù Cristo e alla tua intercessione, che posso ottenere la salvezza eterna.","O Signora mia, così sollecita nel visitare Elisabetta per santificarla, ti prego: affrettati a venire a visitare la mia anima. Tu sai, meglio di me, quanto è misera e quanti mali la affliggono: affetti disordinati, cattive abitudini, tanti peccati commessi e infermità che possono portarla soltanto alla morte eterna. Solo da te dipende guarire la mia anima da tutte le sue infermità e sciogliere tutti i nodi che la affliggono. Prega per me, o Vergine Maria, e raccomandami al tuo divin Figlio. Tu conosci, meglio di me, le mie miserie e i miei bisogni.","O Madre mia e dolce Regina, prega per me il tuo divin Figlio e ottienimi le grazie necessarie ed essenziali per la mia salvezza eterna. Mi abbandono completamente a te. Le tue preghiere non sono mai state respinte da lui: sono le preghiere di una Madre al suo Figlio, e questo Figlio ti ama tanto da fare tutto ciò che vuoi per accrescere la tua gloria e testimoniare il grande amore che ha per te.","«O Signore, fermiamoci qui: mi consacro pienamente a te nel corpo e nell’anima e tu prenditi cura della mia salvezza. Così sia» (sant’Alfonso Maria de’ Liguori)."]},{"titulo":"Alla Madre del Buon Consiglio","nota":"Pio XII","parrafos":["Vergine Santa, ai tuoi piedi ci conduce l’incertezza nella ricerca del vero e del bene, per invocarti con il dolce titolo di Madre del Buon Consiglio. Vieni in nostro aiuto, mentre, per le vie del mondo, le tenebre dell’errore e del male cercano la nostra rovina, fuorviando le menti e i cuori.","Tu, Sede della Sapienza e Stella del mare, illumina i dubbiosi e gli erranti, perché i falsi beni non li ingannino; da’ loro forza per resistere alle passioni e al peccato. Intercedi presso tuo Figlio, o Madre del Buon Consiglio, perché amiamo la virtù e, nei momenti difficili e incerti, abbracciamo ciò che conviene alla nostra salvezza. Se la tua mano ci sostiene, cammineremo saldi per i sentieri additati dalla vita e dalle parole di Gesù, nostro Redentore; e, dopo aver seguito, liberi e sicuri nelle lotte terrene, sotto la tua materna stella, il Sole della verità e della giustizia, godremo con te la pace eterna nel porto della salvezza. Amen."]}],"letanias_bc":[{"i":"Signore, pietà","r":"Signore, pietà"},{"i":"Cristo, pietà","r":"Cristo, pietà"},{"i":"Signore, pietà","r":"Signore, pietà"},{"i":"Santa Vergine Maria, Madre nostra,","r":"proteggici e consigliaci"},{"i":"Figlia dilettissima dell’eterno Padre","r":"proteggici e consigliaci"},{"i":"Madre augusta del Figlio di Dio","r":"proteggici e consigliaci"},{"i":"Divina Sposa dello Spirito Santo","r":"proteggici e consigliaci"},{"i":"Tempio vivo della Santissima Trinità","r":"proteggici e consigliaci"},{"i":"Regina del cielo e della terra","r":"proteggici e consigliaci"},{"i":"Sede della divina sapienza","r":"proteggici e consigliaci"},{"i":"Depositaria dei segreti dell’Altissimo","r":"proteggici e consigliaci"},{"i":"Vergine prudentissima","r":"proteggici e consigliaci"},{"i":"Nelle nostre perplessità e nei nostri dubbi","r":"proteggici e consigliaci"},{"i":"Nelle nostre angosce e nelle nostre tribolazioni","r":"proteggici e consigliaci"},{"i":"Nelle nostre occupazioni e nelle nostre imprese","r":"proteggici e consigliaci"},{"i":"Nei pericoli e nelle tentazioni nei combattimenti contro il demonio, il mondo e la carne","r":"proteggici e consigliaci"},{"i":"Nei nostri scoraggiamenti","r":"proteggici e consigliaci"},{"i":"In tutte le nostre necessità","r":"proteggici e consigliaci"},{"i":"Nell’ora della nostra morte","r":"proteggici e consigliaci"},{"i":"Per la tua immacolata concezione e la tua felice natività","r":"proteggici e consigliaci"},{"i":"Per la tua benedetta visitazione e la tua divina maternità","r":"proteggici e consigliaci"},{"i":"Per la tua santa purificazione e i dolori e le angosce del tuo cuore materno","r":"proteggici e consigliaci"},{"i":"Per la tua preziosa morte e la tua trionfale assunzione","r":"proteggici e consigliaci"}],"oremos_bc":["O Dio, che ci hai dato per Madre la Madre del tuo dilettissimo Figlio e ti sei degnato di glorificare la sua bella immagine con una miracolosa apparizione, ricordaci, ti supplichiamo, che seguendo sempre i suoi consigli possiamo vivere secondo il tuo Cuore e giungere alla patria celeste. Per Gesù Cristo nostro Signore. Amen."],"lecturas":[{"titulo":"Maria ci aiuta a sciogliere i nodi dolorosi della vita","parrafos":["Lasciamoci conquistare dalle parole di papa Francesco nella sua straordinaria catechesi, tenuta in occasione della preghiera mariana (organizzata nell’ambito dell’Anno della Fede) dei giorni 12-13 ottobre 2013, sul ruolo della Vergine che scioglie i nodi dolorosi della nostra vita. Il Papa, con la semplicità che lo caratterizza, ci assicura che Maria, «donna di fede, vera credente», scioglie i nodi della nostra vita, anche quelli «più intricati». La commemorazione dell’ultima apparizione della Vergine di Fatima (13 ottobre 1917) si è conclusa con la celebrazione della santa Messa e con l’atto di consacrazione a Maria.","Cari fratelli e sorelle, questo incontro dell’Anno della fede è dedicato a Maria, Madre di Cristo e della Chiesa, Madre nostra. La sua immagine, venuta da Fatima, ci aiuta a sentire la sua presenza in mezzo a noi. C’è una realtà: Maria sempre ci porta a Gesù. È una donna di fede, una vera credente. Possiamo chiederci: com’è la fede di Maria?","1. Il primo elemento della sua fede è questo: la fede di Maria scioglie il nodo del peccato (cfr Conc. Ecum. Vat. II, Cost. dogm. Lumen gentium, 56). Che cosa significa? I Padri conciliari [del Vaticano II] hanno ripreso un’espressione di sant’Ireneo che dice così: «Il nodo della disobbedienza di Eva è stato sciolto dall’obbedienza di Maria. Ciò che la vergine Eva aveva legato con la sua incredulità, la Vergine Maria l’ha sciolto con la sua fede» (Adversus Haereses, III, 22, 4).","Il «nodo» della disobbedienza, il «nodo» dell’incredulità. Quando un bambino disobbedisce alla mamma o al papà, potremmo dire che si forma un piccolo «nodo». Questo succede se il bambino agisce rendendosi conto di quello che fa, specialmente se c’è di mezzo una bugia; in quel momento non si fida della mamma o del papà. Voi sapete quante volte succede questo. Allora il rapporto con i genitori ha bisogno di essere ripulito da questa mancanza e infatti si chiede scusa, perché ci sia di nuovo armonia e fiducia. Qualcosa di simile avviene nel nostro rapporto con Dio. Quando non lo ascoltiamo, non seguiamo la sua volontà, compiamo azioni concrete in cui dimostriamo mancanza di fiducia in lui - e questo è il peccato -, si forma come un nodo nella nostra interiorità. E questi nodi ci tolgono la pace e la serenità. Sono pericolosi, perché più nodi possono diventare un groviglio, che è sempre più doloroso e più difficile da sciogliere.","Ma alla misericordia di Dio - lo sappiamo - nulla è impossibile. Anche i nodi più aggrovigliati si sciolgono con la sua grazia. E Maria, che con il suo «sì» ha aperto la porta a Dio per sciogliere il nodo dell’antica disobbedienza, è la madre che con pazienza e tenerezza ci porta a Dio, perché egli sciolga i nodi della nostra anima con la sua misericordia di Padre. Ognuno di noi ne ha qualcuno, e possiamo domandarci nel nostro cuore: quali sono i nodi che ci sono nella mia vita? «Padre, i miei non si possono sciogliere». Ma questo è uno sbaglio. Tutti i nodi del cuore, tutti i nodi della coscienza si possono sciogliere. Chiedo a Maria che mi aiuti ad avere fiducia nella misericordia di Dio per scioglierli, per cambiare? Lei, donna di fede, sicuramente ci dirà: «Va’ avanti, va’ dal Signore: Lui comprende». E lei ci porta per mano, Madre, Madre, verso l’abbraccio del Padre, del Padre della misericordia.","2. Secondo elemento: la fede di Maria dona carne umana a Gesù. Dice il Concilio: «Per la sua fede e obbedienza generò sulla terra lo stesso Figlio del Padre, senza conoscere uomo, adombrata dallo Spirito Santo» (Cost. dogm. Lumen gentium, 63). Questo è un punto su cui i Padri della Chiesa hanno molto insistito: Maria ha concepito Gesù nella fede, e poi nella carne, quando ha detto «sì» all’annuncio che Dio le ha rivolto mediante l’angelo. Che cosa vuol dire? Che Dio non ha voluto farsi uomo ignorando la nostra libertà, ha voluto passare attraverso il libero assenso di Maria, attraverso il suo «sì». Le ha chiesto: «Sei disposta a questo?». E lei ha detto: «sì».","Ma ciò che è avvenuto nella Vergine Madre in modo unico, succede anche a noi sul piano spirituale quando accogliamo la Parola di Dio con cuore buono e sincero e la mettiamo in pratica. È come se Dio prendesse carne in noi. Egli viene ad abitare in noi, perché prende dimora in coloro che lo amano e osservano la sua Parola. Non è facile capire questo, ma, sì, è facile sentirlo nel cuore.","Pensiamo che l’incarnazione di Gesù sia soltanto un fatto del passato, che non ci riguarda personalmente? Credere in Gesù significa offrirgli la nostra carne, con l’umiltà e il coraggio di Maria, perché egli possa continuare ad abitare in mezzo agli uomini; significa offrirgli le nostre mani per accarezzare i piccoli e i poveri; i nostri piedi per andare incontro ai fratelli; le nostre braccia per sostenere chi è debole e per lavorare nella vigna del Signore; la nostra mente per pensare e fare progetti alla luce del Vangelo; e, soprattutto, il nostro cuore per amare e prendere decisioni secondo la volontà di Dio. Tutto questo avviene grazie all’azione dello Spirito Santo. E così siamo gli strumenti di Dio perché Gesù agisca nel mondo attraverso di noi.","3. E l’ultimo elemento è la fede di Maria come cammino: il Concilio afferma che Maria «avanzò nella peregrinazione della fede» (ibid., 58). Per questo lei ci precede in questo pellegrinaggio, ci accompagna, ci sostiene. In che senso la fede di Maria è stata un cammino? Nel senso che tutta la sua vita è stata un seguire il suo Figlio: è lui – Gesù – la via, è lui il cammino. Progredire nella fede, avanzare in questo pellegrinaggio spirituale che è la fede, non è altro che seguire Gesù; ascoltarlo e lasciarsi guidare dalle sue parole; vedere come egli si comporta e mettere i nostri piedi nelle sue orme, avere i suoi stessi sentimenti e atteggiamenti. E quali sono i sentimenti e gli atteggiamenti di Gesù? Umiltà, misericordia, vicinanza, ma anche un fermo rifiuto dell’ipocrisia, della doppiezza, dell’idolatria. La via di Gesù è quella dell’amore fedele fino alla fine, fino al sacrificio della vita; è la via della croce. Per questo il cammino della fede passa attraverso la croce, e Maria lo ha capito fin dall’inizio, quando Erode voleva uccidere Gesù appena nato. Ma poi questa croce è diventata più pesante, quando Gesù è stato rifiutato: Maria era sempre con Gesù, seguiva Gesù mescolata in mezzo al popolo, e sentiva le chiacchiere, l’odio di quelli che non volevano bene a Gesù. E questa croce, lei l’ha portata. La fede di Maria ha affrontato allora l’incomprensione e il disprezzo. Quando è venuta l’«ora» di Gesù, cioè l’ora della passione, la fede di Maria è stata allora la fiammella accesa nella notte, quella fiammella in piena notte. Maria ha vegliato durante la notte del Sabato santo. La sua fiamma, piccola ma chiara, è rimasta accesa fino all’alba della Risurrezione; e quando le è giunta la notizia che il sepolcro era vuoto, il suo cuore si è colmato della gioia della fede, la fede cristiana nella morte e risurrezione di Gesù Cristo. Perché la fede ci porta sempre alla gioia, e lei è la Madre della gioia. Che lei ci insegni a camminare su questa strada della gioia e a vivere questa gioia. Questo è il punto culminante – questa gioia, questo incontro fra Gesù e Maria –, ma immaginiamo come è stato... Questo incontro è il punto culminante del cammino della fede di Maria e di tutta la Chiesa. Com’è la nostra fede? La teniamo accesa, come Maria, anche nei momenti difficili, nei momenti di oscurità? Ho sentito la gioia della fede?","Questa sera, Madre, ti ringraziamo per la tua fede di donna forte e umile; e rinnoviamo il nostro affidarci a te, Madre della nostra fede. Amen."]},{"titulo":"Atto di consacrazione a Maria","parrafos":["Beata Vergine Maria di Fatima, con rinnovata gratitudine per la tua presenza materna uniamo la nostra voce a quella di tutte le generazioni che ti chiamano beata. Celebriamo in te le grandi opere di Dio, che mai si stanca di chinarsi con misericordia sull’umanità, afflitta dal male e ferita dal peccato, per guarirla e salvarla. Accogli con benevolenza di Madre l’atto di consacrazione che oggi facciamo con fiducia, dinanzi a questa tua immagine a noi tanto cara. Siamo certi che ognuno di noi è prezioso ai tuoi occhi e che nulla di ciò che abita nei nostri cuori ti è estraneo. Ci lasciamo raggiungere dal tuo dolcissimo sguardo e riceviamo la consolante carezza del tuo sorriso. Custodisci la nostra vita fra le tue braccia: benedici e rafforza ogni desiderio di bene; ravviva e alimenta la fede; sostieni e illumina la speranza; suscita e anima la carità; guida tutti noi nel cammino della santità. Insegnaci il tuo stesso amore di predilezione per i piccoli e i poveri, per gli esclusi e i sofferenti, per i peccatori e gli smarriti di cuore: raduna tutti sotto la tua protezione e tutti consegnali al tuo amato Figlio, nostro Signore Gesù Cristo. Amen."]},{"titulo":"Maria che scioglie i nodi","parrafos":["L’arte cristiana è sempre stata un mezzo efficace per esprimere la fede profonda dell’essere umano. Ha donato all’umanità splendide opere d’arte che sono sintesi di bellezza e compendi di verità di fede; attraverso colori e forme, luci e ombre, si esprime il proprio credo religioso, che si trasmette di generazione in generazione nella forma originale e semplice dell’immagine.","È il caso anche di un quadro che raffigura la Vergine mentre scioglie una serie di nodi di un nastro. Il bellissimo dipinto, recentemente attribuito al pittore bavarese Johann Georg Melchior Schmidtner (1625-1705), fu realizzato intorno al 1700 su commissione di un nobile prelato e collocato nella chiesa di Sankt Peter am Perlach, officiata dai Gesuiti, nel cuore della città di Augusta, in Baviera (Germania)."]},{"titulo":"Storia","parrafos":["All’origine della devozione a Maria «che scioglie i nodi» non c’è un’apparizione della Vergine, ma una storia di vita quotidiana, una storia familiare.","Il nobile Wolfgang Langenmantel aveva sposato Sophie Imhoff nel 1612. Pochi anni dopo, il loro matrimonio entrò in crisi, tanto che i due sposi cominciarono a considerare l’idea del divorzio. Le incomprensioni e i litigi avevano deteriorato il loro rapporto ed erano vicini alla rottura definitiva. Prima della separazione completa, Wolfgang decise di recarsi a Ingolstadt (a circa settanta chilometri a nord di Augusta) per consultare il padre gesuita Jakob Rem.","Il sacerdote, grazie alla sua esperienza e al suo discernimento, ebbe l’ispirazione di affidare la situazione di Wolfgang a Maria, sotto il titolo di «Madre tre volte ammirabile» (Mater ter admirabilis), che egli stesso aveva coniato. Il nobile si recò al convento in quattro occasioni, nell’arco di 28 giorni, e, grazie alla preghiera rivolta alla Vergine insieme al gesuita, ottenne cambiamenti molto positivi nella sua situazione familiare.","L’ultimo sabato del mese, il 23 settembre 1615, padre Jakob Rem, mentre pregava davanti all’immagine della Vergine che si trovava nella cappella del con
