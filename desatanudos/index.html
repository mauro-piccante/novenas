<script type="application/json" id="data">{"titulo":"Novena a María Desatanudos","iniciales":{"intro":["En el nombre del Padre, y del Hijo, y del Espíritu Santo. Amén.","Al empezar la oración, invocamos al Padre por medio de Jesucristo nuestro Señor para que nos done el Espíritu Santo. Él es el maestro interior que nos enseña a rezar: «Nadie puede decir: “¡Jesús es Señor!”, sino bajo la acción del Espíritu Santo» (1Cor 12,3). He aquí por qué la Iglesia nos invita a implorarlo cada día, sobre todo al comienzo y al final de cualquier acto importante."],"bloques":[{"titulo":"Secuencia del Espíritu Santo","tipo":"verso","estrofas":[["Ven, Espíritu divino,","manda tu luz desde el cielo.","Padre amoroso del pobre;","don, en tus dones espléndido;","luz que penetra las almas;","fuente del mayor consuelo."],["Ven, dulce huésped del alma,","descanso de nuestro esfuerzo,","tregua en el duro trabajo,","brisa en las horas de fuego,","gozo que enjuga las lágrimas","y reconforta en los duelos."],["Entra hasta el fondo del alma,","divina luz, y enriquécenos.","Mira el vacío del hombre","si tú le faltas por dentro;","mira el poder del pecado,","cuando no envías tu aliento."],["Riega la tierra en sequía,","sana el corazón enfermo,","lava las manchas, infunde","calor de vida en el hielo,","doma el espíritu indómito,","guía al que tuerce el sendero."],["Reparte tus siete dones","según la fe de tus siervos;","por tu bondad y tu gracia","dale al esfuerzo su mérito;","salva al que busca salvarse","y danos tu gozo eterno. Amén."]]},{"titulo":"Credo","tipo":"texto","parrafos":["Creo en un solo Dios, Padre todopoderoso, Creador del cielo y de la tierra. Creo en Jesucristo, su único Hijo, nuestro Señor, (inclinación) que fue concebido por obra y gracia del Espíritu Santo, nació de santa María Virgen, padeció bajo el poder de Poncio Pilato, fue crucificado, muerto y sepultado, descendió a los infiernos, al tercer día resucitó de entre los muertos, subió a los cielos y está sentado a la derecha de Dios, Padre todopoderoso. Desde allí ha de venir a juzgar a vivos y muertos.","Creo en el Espíritu Santo, la santa Iglesia católica, la comunión de los santos, el perdón de los pecados, la resurrección de la carne y la vida eterna. Amén."]},{"titulo":"Acto de contrición","tipo":"texto","rubrica":"Después de haber invocado al Espíritu Santo con la Secuencia y haber profesado nuestra fe con el Credo, permanecemos unos instantes en silencio y examinamos brevemente nuestra conciencia. Si esta nos reprocha algún pecado grave, propongámonos acercarnos cuanto antes al sacramento de la Reconciliación porque, como nos recuerda el papa Francisco: «El confesionario no es una sala de tortura, sino el lugar de la misericordia en el que el Señor nos estimula a hacer lo mejor que podamos». Reconozcámonos, por tanto, necesitados de la misericordia del Padre y pidamos humildemente perdón por nuestros pecados. Después, formulamos el firme propósito de no volver a pecar.","parrafos":["Pésame Dios mío y me arrepiento de todo corazón de haberte ofendido, porque pecando he merecido tu castigo, pero mucho más me pesa porque te he ofendido a ti, infinitamente bueno y digno de ser amado sobre todas las cosas. Propongo con tu divina gracia no ofenderte más y evitar las ocasiones próximas de pecado. Señor, perdóname, ten misericordia."]},{"titulo":"A María Desatanudos","tipo":"texto","parrafos":["Nuestra Señora Desatanudos, tú sabes que mi vida está llena de «nudos» que me sofocan, me hunden, me oprimen y me esclavizan. Me encomiendo a ti con confianza para que tú los desates y, por tu potente intercesión, el Señor me conceda la paz del corazón, la salud del cuerpo y del espíritu, y me conduzca a la alegría sin fin.","María, no me dejes caer en la tentación del maligno, sino líbrame de toda esclavitud, miedo e inseguridad. Dame tu gracia para seguir el camino justo y no caer en el error.","Desata hoy mis nudos y, cuando llegue mi hora, desata el nudo definitivo de mi muerte para que, al fin y definitivamente libre de todo pecado, pueda entrar en la eterna bienaventuranza. Amén."]}]},"dias":[{"n":1,"lectura":"El ángel Gabriel fue enviado por Dios a una ciudad de Galilea llamada Nazaret, a una virgen desposada con un hombre llamado José, de la casa de David; el nombre de la virgen era María. El ángel, entrando en su presencia, dijo: «Alégrate, llena de gracia, el Señor está contigo» (Lc 1,26-28).","suplica":["María, tú eres la llena de gracia; la fe me dice que, con tu poder ante Dios, me concederás lo que te pido porque, siendo Madre, quieres escucharme. Te ruego que escuches mi súplica, estoy seguro de que siempre tienes un remedio para mis debilidades, aunque parezca no hay nada que hacer.","María, llena de gracia, que deshaces los nudos que sofocan a tus hijos, tiende hacia mí tus manos misericordiosas. Te entrego hoy este nudo (citar) y todas sus consecuencias negativas en mi vida. Te doy este nudo (citar) que me atormenta y me impide vivir en la paz de Dios.","Oh María Desatanudos, sé que nunca se ha oído decir que ninguno de los que han acudido a tu protección, implorando tu asistencia y reclamando tu socorro, haya sido abandonado de ti. Por eso creo que tú puedes deshacer mi nudo, porque Jesús, tu amadísimo Hijo, te concede todo el poder. Confío en que lo desatarás porque eres mi Madre. Sé que lo harás porque me amas con el mismo amor de Dios. Gracias, amada Madre mía."]},{"n":2,"lectura":"«No temas, María, porque has encontrado gracia ante Dios» (Lc 1,30).","suplica":["María, Madre del amor hermoso, mi corazón se dirige a ti porque has encontrado gracia ante Dios. Tú que, acogiendo el saludo del ángel en el asombro de toda la creación, has engendrado a tu Creador. Madre siempre virgen, ten piedad de mí, pecador. Estoy abatido por las olas de la soberbia, la ambición, la calumnia, los celos, la ira, la avaricia y la seducción de la carne.","Me dirijo a ti, María Desatanudos, para que pidas por mí a tu Hijo la pureza de corazón, el desapego, la humildad, el abandono y la confianza en Dios. En este día me esforzaré por practicar alguna de estas virtudes como prueba de mi amor.","Pongo en tus manos este nudo (citar) que me impide reflejar la gloria de Dios. No desprecies mi súplica, sino óyeme propicia y escúchame.","Dame, Madre de Dios y Madre mía, una chispa de tu amor por Jesús."]},{"n":3,"lectura":"«El Poderoso ha hecho obras grandes en mí: su nombre es santo, y su misericordia llega a sus fieles de generación en generación. Él hace proezas con su brazo: dispersa a los soberbios de corazón, derriba del trono a los poderosos y enaltece a los humildes, a los hambrientos los colma de bienes y a los ricos los despide vacíos» (Lc 1,49-53).","suplica":["Que el alma de María esté en todos para glorificar al Señor; que el alma de María esté en todos para exultar en Dios. Madre de Dios y Madre nuestra, aumenta mi fe, frágil e insegura.","María mediadora, tus manos reciben y distribuyen todas las riquezas del Rey; vuelve a mí tus ojos misericordiosos. Yo pongo en tus santas manos este nudo de mi vida (citar) y con él todo el rencor y el resentimiento que genera.","Ayúdame en este momento a perdonar a todas las personas que, consciente o inconscientemente, han provocado este nudo. Ante ti, querida Madre, y en nombre de tu Hijo Jesús, mi Salvador, que habiendo sido tan ofendido supo perdonar, yo perdono ahora a estas personas (citar) para siempre."]},{"n":4,"lectura":"En aquellos mismos días, María se levantó y se puso en camino de prisa hacia la montaña, a una ciudad de Judá; entró en casa de Zacarías y saludó a Isabel. Aconteció que, en cuanto Isabel oyó el saludo de María, saltó la criatura en su vientre (Lc 1,39-41).","suplica":["Madre grande en la caridad, cariñosa con los necesitados, ven en mi ayuda como hiciste con Isabel. Pongo en tus manos este nudo (citar) que me impide estar en paz, paraliza mi alma, impidiéndome andar hacia el Señor y poner mi vida a su servicio.","Madre, desata este nudo de mi vida (citar). Pide a Jesús que cure mi fe paralizada, que se deja abatir por las dificultades.","Camina conmigo, Madre amada, para que comprenda que los obstáculos que encuentro en mi camino son ocasiones para fortalecer mi fe y aprender a dar gracias a Dios, que no deja de sostenerme con su providencia."]},{"n":5,"lectura":"Su madre conservaba todas estas cosas en su corazón (Lc 2,51).","suplica":["María, que desatas los nudos más intrincados, generosa y llena de compasión, me dirijo a ti para poner otra vez en tus manos este nudo (citar). Te pido la sabiduría de Dios, para actuar bajo la luz del Espíritu Santo y desatar todas las dificultades.","Tus palabras están tan llenas de dulzura que en ti se refleja el corazón de Dios.","Líbrame de la amargura, la cólera y el odio que este nudo (citar), que con insistencia te presento, ha hecho nacer en mí.","Madre amada, dame tu dulzura y sabiduría para que aprenda a meditar en silencio, en mi corazón, hablando con el Señor en un diálogo amoroso de todo lo que me sucede, también de las cosas pequeñas. No permitas que me olvide de sopesarlas, valorarlas y verlas con ojos de fe, para descubrir en ellas la voluntad de Dios."]},{"n":6,"lectura":"Junto a la cruz de Jesús estaban su madre, la hermana de su madre, María, la de Cleofás, y María, la Magdalena. Jesús, al ver a su madre y junto a ella al discípulo al que amaba, dijo a su madre: «Mujer, ahí tienes a tu hijo». Luego, dijo al discípulo: «Ahí tienes a tu madre». Y desde aquella hora, el discípulo la recibió como algo propio (Jn 19,25-27).","suplica":["Madre, como el apóstol Juan, quiero tenerte en mi casa, en lo más íntimo de mi corazón, para aprender de ti a conformarme a tu Hijo. Estoy ante ti para entregarme a tu cuidado maternal.","Reina de misericordia, te confío este nudo de mi vida (citar) y te pido que me des un corazón que sepa ser paciente, mientras deshaces este enredo.","Enséñame a perseverar en la escucha de la palabra de tu Hijo, a recibir con constancia los sacramentos de la Reconciliación y la Eucaristía y, como hiciste en el Cenáculo en espera de Pentecostés, intercede ante tu querido Hijo para que derrame con abundancia el Espíritu Santo sobre mí, Espíritu de verdad que es fuente de vida. Acógelo por mí y conmigo, como en la primera comunidad, unida en torno a ti el día de Pentecostés.","Que el Espíritu abra mi corazón a la paz, la justicia y el amor."]},{"n":7,"lectura":"«Pongo hostilidad entre ti y la mujer, entre tu descendencia y su descendencia; esta te aplastará la cabeza cuando tú la hieras en el talón» (Gén 3,15).","suplica":["María purísima e inmaculada, hoy me dirijo a ti: te suplico que desates este nudo de mi vida (citar) y me libres de las obras del mal. Dios te ha concedido un gran poder sobre todos los demonios. Yo hoy renuncio al mal y a todas las ataduras que me han ligado a él. Proclamo que Jesús es mi único Salvador, mi único Señor.","Oh María Desatanudos, aplasta la cabeza del maligno. Destruye las trampas que han provocado estos nudos en mi vida. Madre, que conoces mis sufrimientos y esperanzas, ayúdame en las pruebas cotidianas que la vida me reserva y haz que las tinieblas no prevalezcan sobre la luz.","A ti, Aurora de la salvación, confío mi camino para descubrir bajo tu guía a Cristo, luz del mundo y único Salvador, que reina con el Padre y el Espíritu Santo por los siglos de los siglos. Señor, libérame por tu preciosísima Sangre."]},{"n":8,"lectura":"Aconteció que, en cuanto Isabel oyó el saludo de María, saltó la criatura en su vientre. Se llenó Isabel de Espíritu Santo y, levantando la voz, exclamó: «¡Bendita tú entre las mujeres, y bendito el fruto de tu vientre! ¿Quién soy yo para que me visite la madre de mi Señor? Pues, en cuanto tu saludo llegó a mis oídos, la criatura saltó de alegría en mi vientre. Bienaventurada la que ha creído, porque lo que le ha dicho el Señor se cumplirá» (Lc 1,41-45).","suplica":["Virgen Madre de Dios, rica en misericordia, ten piedad de mí y desata este nudo de mi vida (citar). Necesito que tú me visites, como visitaste a Isabel.","Llévame a Jesús, para que él me lleve al Espíritu Santo. Enséñame a practicar la virtud de la humildad, la caridad y, como Isabel, concédeme ser colmado del Espíritu Santo y de la alegría sin fin.","María, Madre mía, te entrego mi corazón y todo lo que tengo: mi casa, mi familia, mis bienes interiores y exteriores. Te pertenezco para siempre. Pon en mí tu corazón, para que pueda cumplir la voluntad de Dios todos los días de mi vida."]},{"n":9,"lectura":"A los tres días, había una boda en Caná de Galilea, y la madre de Jesús estaba allí. Jesús y sus discípulos estaban también invitados a la boda. Faltó el vino, y la madre de Jesús le dice: «No tienen vino». Jesús le dice: «Mujer, ¿qué tengo yo que ver contigo? Todavía no ha llegado mi hora». Su madre dice a los sirvientes: «Haced lo que él os diga» (Jn 2,1-5).","suplica":["A ti recurro, oh Virgen de las vírgenes, a ti vengo y ante ti clamo como un pobre pecador. No desprecies mi súplica, sino óyeme propicia y escúchame. Te ruego que deshagas este nudo de mi vida (citar). Tú sabes el dolor y el sufrimiento que me produce.","Gracias, Madre, porque en tu misericordia enjugas las lágrimas de mis ojos. Gracias por acogerme en tus brazos y prepararme para recibir otra gracia de Dios. María Desatanudos, amada Madre mía, te doy las gracias por desatar los nudos de mi vida. Ningún gesto tuyo, ni el más pequeño, es banal, sino lleno de significado. María, sé para mí ejemplo y guía. Quiero imitar tus virtudes en las circunstancias concretas en las que Dios me pide vivir. Envuélveme con tu manto de amor, ponme bajo tu protección y lléname de la paz que solo Dios me puede dar."]}],"jaculatoria":["Oh María, Madre del Buen Consejo, toma este nudo (citar) que me obstaculiza y con la fuerza de tu mano desátalo.","María Desatanudos, ruega por mí."],"rosario":{"estructura":["1) En cada uno de los misterios, reza del siguiente modo:","Enuncia el misterio y lee el versículo bíblico apropiado, seguido de una breve pausa de reflexión.","Detente un momento a meditar el misterio que estás celebrando. Abre tu corazón a la Virgen María y pide al Señor que te conceda la gracia o la virtud que necesitas.","2) Reza cada decena del siguiente modo:","Padrenuestro 10 Avemarías Gloria al Padre","3) Cuando hayas recorrido las cinco decenas y meditado los cinco misterios, para concluir la oración del santo Rosario, reza el Salve Regina y las Letanías Lauretanas."],"misterios":{"gozo":{"intro":["«El Evangelio de san Lucas dice que, en la familia de Nazaret, Jesús “iba creciendo y robusteciéndose, lleno de sabiduría; y la gracia de Dios estaba con él”. La Virgen hace precisamente esto en nosotros, nos ayuda a crecer humanamente y en la fe, a ser fuertes y no ceder a la tentación de ser hombres y cristianos de modo superficial, sino a vivir con responsabilidad, a tender siempre a lo alto» (Papa Francisco)."],"misterios":[{"titulo":"La anunciación del ángel a María","cita":"El ángel [Gabriel], entrando en su presencia, dijo: «Alégrate, llena de gracia, el Señor está contigo. Concebirás en tu vientre y darás a luz un hijo, y le pondrás por nombre Jesús» (Lc 1,28.31).","meditacion":["Dios nos sorprende; es precisamente en la pobreza, en la debilidad, en la humildad donde se manifiesta y nos da su amor que nos salva, nos cura, nos da fuerza. Solo pide que sigamos su palabra y confiemos en él. Esta es la experiencia de la Virgen María: ante el anuncio del ángel, no esconde su maravilla.","Es el asombro de ver que Dios, para hacerse hombre la eligió precisamente a ella, una simple muchacha de Nazaret que no vive en los palacios del poder y de la riqueza, que no ha llevado a cabo empresas extraordinarias, sino que está abierta a Dios, sabe confiar en él, aunque no comprenda todo: «He aquí la esclava del Señor, hágase en mí según su palabra» (Lc 1,38). Esta es su respuesta. Dios nos sorprende siempre, rompe nuestros esquemas, mete en crisis nuestros proyectos y nos dice: ¡confía en mí, no tengas miedo, déjate sorprender, sal de ti mismo y sígueme! Hoy preguntémonos si tenemos miedo de lo que Dios puede pedirnos o de lo que nos pide. ¿Me dejo sorprender por Dios, como hizo María, o me encierro en mis seguridades, seguridades materiales, seguridades intelectuales, seguridades ideológicas, la seguridad de mis proyectos? ¿Dejo realmente a Dios entrar en mi vida? ¿Cómo le respondo?"]},{"titulo":"La visita de María a santa Isabel","cita":"Aconteció que, en cuanto Isabel oyó el saludo de María, saltó la criatura en su vientre. Se llenó Isabel de Espíritu Santo y, levantando la voz, exclamó: «¡Bendita tú entre las mujeres, y bendito el fruto de tu vientre!» (Lc 1,41-42).","meditacion":["María, después de la anunciación, el primer gesto que hace es de caridad hacia la anciana pariente Isabel; y las primeras palabras que pronuncia son: «Mi alma glorifica al Señor», es decir un canto de alabanza y agradecimiento a Dios, no solo por lo que ha hecho en ella, sino por su acción en toda la historia de la salvación. Todo es don suyo. Si podemos entender que todo es don de Dios, ¡cuánta felicidad en nuestro corazón! Decir gracias es tan fácil, ¡y tan difícil! ¿Cuántas veces decimos gracias en la familia? Es una de las palabras clave de la convivencia. «Por favor», «perdona», «gracias», si en una familia se dicen estas tres palabras, la familia va hacia adelante. «Por favor», «perdóname», «gracias», ¿Cuántas veces decimos «gracias» en la familia? ¿Cuántas veces decimos gracias a quien nos ayuda, está cerca, nos acompaña en la vida? ¡Con frecuencia damos todo por descontado! Y esto también sucede con Dios. Es fácil ir al Señor y pedirle cualquier cosa, pero ir a darle gracias: «No, no me sale»."]},{"titulo":"El nacimiento de Jesús en Belén","cita":"«Hoy, en la ciudad de David, os ha nacido un Salvador, el Mesías, el Señor. Y aquí tenéis la señal: encontraréis un niño envuelto en pañales y acostado en un pesebre» (Lc 2,11-12).","meditacion":["Miremos a Dios como al Dios de la vida; miremos su ley, el mensaje del Evangelio, como un camino de libertad y de vida. ¡El Dios vivo nos hace libres! Digamos sí al amor y no al egoísmo, digamos sí a la vida y no a la muerte, digamos sí a la libertad y no a la esclavitud de tantos ídolos de nuestro tiempo. En una palabra, digamos sí a Dios, que es amor, libertad y vida, y nunca defrauda (cfr. 1Jn 4,8; Jn 11,25; 8,32), a Dios que es el Viviente y el Misericordioso. Solo la fe en el Dios vivo nos salva; en el Dios que en Jesucristo nos ha entregado su vida con el don del Espíritu Santo y nos hace vivir como verdaderos hijos de Dios con su misericordia. Esta fe nos hace libres y felices."]},{"titulo":"La presentación de Jesús en el templo","cita":"Cuando se cumplieron los días de su purificación, según la ley de Moisés, lo llevaron a Jerusalén para presentarlo al Señor (Lc 2,22).","meditacion":["¡Cuántas dificultades hay en la vida de cada uno, en nuestra gente, en nuestras comunidades! Pero por muy grandes que parezcan, Dios no deja nunca que nos sobrepasen. El «dragón», el mal, está en nuestra historia, pero él no es el más fuerte. ¡El más fuerte es Dios, y Dios es nuestra esperanza! ¡No perdamos nunca la esperanza! ¡No la apaguemos nunca en nuestro corazón! Un pueblo tiene futuro si va hacia adelante con los jóvenes, con su fuerza, para que lo lleven adelante; y con los ancianos, porque ellos son los que dan la sabiduría de la vida."]},{"titulo":"El niño Jesús hallado entre los doctores","cita":"«¿No sabíais que yo debía estar en las cosas de mi Padre?». Su madre conservaba todo esto en su corazón (Lc 2,49.51).","meditacion":["No basta con leer las Sagradas Escrituras, es necesario escuchar a Jesús, que habla en ellas; es precisamente Jesús quien habla en las Escrituras, es Jesús quien habla en ellas. ¡Es necesario ser como antenas que reciben, sintonizadas en la Palabra de Dios, para ser antenas que transmiten! Se recibe y se transmite. El Espíritu de Dios es quien hace vivas las Escrituras, hace que se comprendan en profundidad, en su sentido auténtico y pleno. Preguntémonos: ¿Qué lugar ocupa la Palabra de Dios en mi vida, en la vida diaria? ¿Estoy sintonizado con Dios o con tantas palabras de moda, o conmigo mismo? Una pregunta que cada uno debe hacerse: ¿soy un cristiano «a ratos», o soy siempre cristiano? La cultura de lo provisional, de lo relativo influye también a la hora de vivir la fe. Dios nos pide que seamos fieles, todos los días, en las acciones cotidianas y añade que, aunque a veces no le seamos fieles, él siempre es fiel y con su misericordia no se cansa nunca de tendernos la mano para levantarnos, animarnos a retomar el camino, volver a él y contarle nuestra debilidad para que nos dé su fuerza. Este es el camino definitivo: siempre con el Señor, incluso en nuestras debilidades, incluso en nuestros pecados. No ir nunca por el camino de lo provisional. Esto nos mata. La fe es fidelidad definitiva, como la de María."]}]},"luz":{"intro":["«María es madre, es una madre que se preocupa sobre todo de la salud de sus hijos, sabe curarla siempre con un amor grande y tierno. La Virgen custodia nuestra salud. ¿Qué quiere decir esto, que la Virgen custodia nuestra salud? Pienso, sobre todo, en tres aspectos: nos ayuda a crecer, a afrontar la vida y a ser libres» (Papa Francisco)."],"misterios":[{"titulo":"El bautismo de Jesús en el Jordán","cita":"Y sucedió que por aquellos días llegó Jesús desde Nazaret de Galilea y fue bautizado por Juan en el Jordán. Apenas salió del agua, vio rasgarse los cielos y al Espíritu que bajaba hacia él como una paloma (Mc 1,9-10).","meditacion":["La Iglesia nos da la vida de fe en el Bautismo; ese es el momento en que nacemos como hijos de Dios, el momento en el que nos da la vida de Dios, nos engendra como madre. El vínculo es vital, como el que se tiene como nuestra mamá porque, como afirma san Agustín: «La Iglesia es realmente la madre de los cristianos». Preguntémonos: ¿Cómo veo yo la Iglesia? Si soy agradecido con mis padres porque me han dado la vida, ¿soy agradecido con la Iglesia porque me ha engendrado en la fe a través del Bautismo? ¿Cuántos cristianos recuerdan la fecha de su Bautismo? ¡La fecha del Bautismo es la fecha de nuestro nacimiento en la Iglesia, la fecha en la que nuestra mamá, la Iglesia, nos ha parido! Buscad bien cuál fue la fecha de vuestro Bautismo, para celebrarla, para dar gracias a Dios por este don. ¿Lo haréis? Amemos a la Iglesia como amamos a nuestra mamá, sabiendo también comprender sus defectos."]},{"titulo":"Las bodas de Caná","cita":"[Había una boda en Caná de Galilea y] faltó el vino, y la madre de Jesús le dice: «No tienen vino». Jesús le dice: «Mujer, ¿qué tengo yo que ver contigo? Todavía no ha llegado mi hora». Su madre dice a los sirvientes: «Haced lo que él os diga» (Jn 2,3-5).","meditacion":["Hemos venido a llamar a la puerta de la casa de María. Ella nos ha abierto, nos ha hecho entrar y nos muestra a su Hijo. Ahora nos dice: «Haced lo que él os diga». ¡Sí, Madre, nos esforzaremos por hacer lo que él nos diga! Y lo haremos con esperanza, confiando en las sorpresas de Dios y llenos de alegría."]},{"titulo":"El anuncio del reino de Dios","cita":"Jesús se marchó a Galilea a proclamar el Evangelio de Dios; decía: «Se ha cumplido el tiempo y está cerca el reino de Dios. Convertíos y creed en el Evangelio» (Mc 1,14-15).","meditacion":["Compartir la experiencia de la fe, testimoniar la fe, anunciar el Evangelio es el mandamiento que el Señor confía a toda la Iglesia, también a ti; es un mandamiento que, sin embargo, no nace de la voluntad de dominio, de la voluntad de poder, sino de la fuerza del amor, del hecho de que Jesús, en primer lugar, ha venido en medio de nosotros y se nos ha dado por completo, ha dado su vida para salvarnos y mostrarnos el amor y la misericordia de Dios. Jesús no nos trata como esclavos, sino como personas libres, amigos, hermanos; no solo nos envía, sino que nos acompaña, está siempre junto a nosotros en esta misión de amor. ¿A dónde nos envía Jesús? No hay límites, no hay límites: nos envía a todos. El Evangelio es para todos y no solo para algunos. No es solo para los que nos parecen más cercanos, receptivos, amables. Es para todos. No tengáis miedo de llevar a Cristo a todas partes, hasta las periferias existenciales, incluso a quien parece estar más alejado, indiferente. El Señor busca a todos, quiere que todos sientan el calor de su misericordia y de su amor."]},{"titulo":"La transfiguración de Jesús","cita":"Jesús tomó consigo a Pedro, a Juan y a Santiago y subió a lo alto del monte para orar. Y, mientras oraba, el aspecto de su rostro cambió y sus vestidos brillaban de resplandor (Lc 9,28-29).","meditacion":["¡Prediquemos el Evangelio con el ejemplo y luego con las palabras! Lo primero de todo es que, en nuestra vida, los demás deben poder leer el Evangelio. También aquí sin temor, con nuestros defectos, que intentamos corregir, con nuestros límites que el Señor conoce, pero también con nuestra generosidad dejando que él actúe en nosotros."]},{"titulo":"La institución de la Eucaristía","cita":"«Tomad, comed: esto es mi cuerpo». Después tomó el cáliz, pronunció la acción de gracias y dijo: «Bebed todos; porque esta es mi sangre de la alianza, que es derramada por muchos para el perdón de los pecados» (Mt 26,26-28).","meditacion":["Lejos de Dios se agota el vino de la alegría, el vino de la esperanza. Si nos acercamos a él, nos quedamos con él, lo que es dificultad, lo que es pecado se transforma en vino nuevo de amistad con él. Dios siempre reserva lo mejor para nosotros. Pero pide que nos dejemos sorprender por su amor, que acojamos sus sorpresas. ¡Confiemos en Dios!"]}]},"dolor":{"intro":["«Jesucristo, con su pasión, muerte y resurrección, nos trae la salvación, nos da la gracia y la alegría de ser hijos de Dios, de llamarlo en verdad con el nombre de Padre» (Papa Francisco)."],"misterios":[{"titulo":"La agonía de Jesús en el huerto de los Olivos","cita":"En medio de su angustia, oraba con más intensidad. Y le entró un sudor que caía hasta el suelo como si fueran gotas espesas de sangre (Lc 22,44).","meditacion":["En cada hermano y hermana en dificultad abrazamos la carne sufriente de Cristo. Todos necesitamos mirar al otro con los ojos de amor de Cristo, aprender a abrazar a quien está necesitado, para manifestar cercanía, afecto, amor. Pero abrazar no es suficiente. Tendamos la mano a quien está necesitado, a quien ha caído en la oscuridad de la dependencia, quizá sin saber cómo, y digámosle: «Puedes levantarte de nuevo, alzarte; sí, es difícil, pero es posible, si quieres»."]},{"titulo":"La flagelación de Jesús","cita":"Entonces Pilato tomó a Jesús y lo mandó azotar (Jn 19,1).","meditacion":["El cristiano, antes de murmurar debe morderse la lengua. No sabéis qué mal hace el cotilleo, cuánto hiere. Es mejor morderse la lengua; eso nos hará bien: la lengua se inflama y no se puede hablar, así no se puede murmurar. Cada vez que juzgamos a nuestros hermanos en nuestro corazón, y peor cuando hablamos de ello con otros, somos cristianos homicidas. Un cristiano homicida... ¡No lo digo yo, eh, lo dice el Señor! En esto no hay matices. Si hablas mal del hermano, matas al hermano. Y nosotros, cada vez que lo hacemos, imitamos el gesto de Caín, el primer homicida de la historia."]},{"titulo":"La coronación de espinas de Jesús","cita":"[Los soldados] trenzando una corona de espinas se la ciñeron a la cabeza y le pusieron una caña en la mano derecha (Mt 27,29).","meditacion":["Lo más importante es caminar juntos, colaborando, ayudándonos; pedir perdón, reconocer los propios errores, pero también aceptar las excusas de los demás perdonando — ¡qué importante es esto! —. A veces pienso en los matrimonios que, después de muchos años, se separan. «No nos entendemos, nos hemos alejado». Quizá no han sabido pedir perdón a tiempo; quizá no han sabido perdonar a tiempo. Y siempre, a los jóvenes esposos, les doy este consejo: «Peleaos cuanto queráis. Si vuelan los platos, dejadlos. ¡Pero nunca terminéis la jornada sin hacer las paces! ¡Nunca!». Si los matrimonios aprenden a decir: «Perdona, estaba cansado», o solo un pequeño gesto, esta es la paz, y luego retomar la vida al día siguiente. Este es un hermoso secreto, y esto evita esas separaciones dolorosas. ¡Qué importante es caminar unidos, sin huir hacia adelante, sin nostalgias del pasado! Y mientras se camina, se habla, se conoce, se cuentan unos a otros, se crece como familia. Aquí, preguntémonos: ¿Cómo caminamos? ¿Caminamos juntos? ¿Qué hago yo para que la familia camine unida?"]},{"titulo":"La subida de Jesús al Calvario con la cruz","cita":"Entonces se lo entregó para que lo crucificaran. Tomaron a Jesús y, cargando él mismo con la cruz, salió al sitio llamado «de la Calavera», que en hebreo se dice Gólgota (Jn 19,16-17).","meditacion":["Donde hay cruz, para nosotros los cristianos, hay esperanza, siempre. Si no hay esperanza, no somos cristianos. Por eso a mí me gusta decir: no os dejéis robar la esperanza. Que no nos roben la esperanza, porque esta fuerza es una gracia, un don de Dios que nos lleva hacia adelante mirando al cielo."]},{"titulo":"La crucifixión y muerte de Jesús","cita":"Uno de los soldados, con la lanza, le traspasó el costado, y al punto salió sangre y agua (Jn 19,34).","meditacion":["El Crucificado no nos habla de derrota, de fracaso; paradójicamente nos habla de una muerte que es vida, que engendra vida, porque nos habla de amor, porque es el Amor de Dios encarnado, y el Amor no muere, al contrario, derrota al mal y a la muerte. Quien se deja mirar por Jesús crucificado es re-creado, se convierte en una «nueva criatura». De aquí sale todo: es la experiencia de la gracia que transforma, ser amados sin mérito, aunque seamos pecadores."]}]},"gloria":{"intro":["«La santa Virgen hizo de su existencia un incesante y precioso don a Dios, porque amaba al Señor. María es ejemplo y estímulo para todos nosotros para vivir la caridad hacia el prójimo, no por una especie de deber social, sino partiendo del amor de Dios, de la caridad de Dios. María es la que nos lleva a Jesús y nos enseña cómo ir a Jesús; es la Madre de Jesús y nuestra y forma familia, con nosotros y con Jesús» (Papa Francisco)."],"misterios":[{"titulo":"La resurrección de Jesús","cita":"El ángel habló a las mujeres: «Vosotras no temáis, ya sé que buscáis a Jesús el crucificado. No está aquí: ¡ha resucitado!» (Mt 28,5-6).","meditacion":["El cristiano está alegre, nunca está triste. Dios nos acompaña. Me gustaría repetíroslo: ¡No os dejéis robar la esperanza! ¡No os dejéis robar la esperanza! Pero quisiera añadir: ¡No robemos la esperanza, más aún, seamos portadores de esperanza!"]},{"titulo":"La ascensión de Jesús","cita":"Después de hablarles, el Señor Jesús fue llevado al cielo y se sentó a la derecha de Dios (Mc 16,19).","meditacion":["Jesús nos ha mostrado que el rostro de Dios es el de un Padre que nos ama. El pecado y la muerte han sido derrotados. ¡El cristiano no puede ser pesimista! No tiene la cara de quien parece estar en luto perpetuo. Si estamos de verdad enamorados de Cristo y sentimos cuánto nos ama, nuestro corazón se «inflamará» de una alegría tal que contagiará a los que viven junto a nosotros."]},{"titulo":"La venida del Espíritu Santo","cita":"Vieron aparecer unas lenguas, como llamaradas, que se dividían, posándose encima de cada uno de ellos. Se llenaron todos de Espíritu Santo (Hch 2,3-4).","meditacion":["¿Estamos abiertos al Espíritu Santo? ¿Nos dejamos guiar por él? El cristiano es un hombre espiritual, pero esto no significa que sea una persona que vive «en las nubes», fuera de la realidad, como si fuera un fantasma. ¡No! El cristiano es una persona que piensa y actúa en la vida cotidiana según Dios, una persona que deja que el Espíritu Santo anime, alimente su vida, para que sea plena, como verdaderos hijos. Esto significa realismo y fecundidad. Quien se deja conducir por el Espíritu Santo es realista, sabe medir y valorar la realidad, y es también fecundo: su vida engendra vida a su alrededor."]},{"titulo":"La asunción de María al cielo","cita":"El Poderoso ha hecho obras grandes en mí y su nombre es santo (Lc 1,49).","meditacion":["El Señor está cerca de vosotros y os lleva de la mano. Miradle en los momentos más duros y os dará consuelo y esperanza. Confiad también en el amor maternal de María, su Madre. Tenemos una Madre que siempre intercede por la vida de sus hijos, por nosotros."]},{"titulo":"La coronación de María","cita":"Un gran signo apareció en el cielo: una mujer vestida del sol, y la luna bajo sus pies y una corona de doce estrellas sobre su cabeza (Ap 12,1).","meditacion":["¡Tened siempre a la Virgen con vosotros, rezad el Rosario, por favor... No lo dejéis! Tened siempre a la Virgen con vosotros en vuestra casa, como la tenía el apóstol Juan. Que ella siempre os acompañe y os proteja. Y rezad también por mí, porque yo también necesito de oraciones, porque soy un pobre pecador."]}]}},"salve":["Dios te salve, Reina y Madre de misericordia, vida, dulzura y esperanza nuestra; Dios te salve. A ti llamamos los desterrados hijos de Eva; a ti suspiramos, gimiendo y llorando, en este valle de lágrimas. Ea, pues, Señora, abogada nuestra, vuelve a nosotros esos tus ojos misericordiosos, y, después de este destierro, muéstranos a Jesús, fruto bendito de tu vientre. ¡Oh, clementísima, oh piadosa, oh dulce Virgen María!"],"letanias":[{"i":"Señor, ten piedad","r":"Señor, ten piedad"},{"i":"Cristo, ten piedad","r":"Cristo, ten piedad"},{"i":"Señor, ten piedad","r":"Señor, ten piedad"},{"i":"Cristo, óyenos","r":"Cristo, óyenos"},{"i":"Cristo, escúchanos","r":"Cristo, escúchanos"},{"i":"Dios, Padre celestial","r":"ten piedad de nosotros"},{"i":"Dios, Hijo Redentor del mundo","r":"ten piedad de nosotros"},{"i":"Dios, Espíritu Santo","r":"ten piedad de nosotros"},{"i":"Trinidad Santa, un solo Dios","r":"ten piedad de nosotros"},{"i":"Santa María","r":"ruega por nosotros"},{"i":"Santa Madre de Dios","r":"ruega por nosotros"},{"i":"Santa Virgen de las vírgenes","r":"ruega por nosotros"},{"i":"Madre de Cristo","r":"ruega por nosotros"},{"i":"Madre de la Iglesia","r":"ruega por nosotros"},{"i":"Madre de la divina gracia","r":"ruega por nosotros"},{"i":"Madre purísima","r":"ruega por nosotros"},{"i":"Madre castísima","r":"ruega por nosotros"},{"i":"Madre siempre virgen","r":"ruega por nosotros"},{"i":"Madre inmaculada","r":"ruega por nosotros"},{"i":"Madre amable","r":"ruega por nosotros"},{"i":"Madre admirable","r":"ruega por nosotros"},{"i":"Madre del buen consejo","r":"ruega por nosotros"},{"i":"Madre del Creador","r":"ruega por nosotros"},{"i":"Madre del Salvador","r":"ruega por nosotros"},{"i":"Virgen prudentísima","r":"ruega por nosotros"},{"i":"Virgen digna de veneración","r":"ruega por nosotros"},{"i":"Virgen digna de alabanza","r":"ruega por nosotros"},{"i":"Virgen poderosa","r":"ruega por nosotros"},{"i":"Virgen clemente","r":"ruega por nosotros"},{"i":"Virgen fiel","r":"ruega por nosotros"},{"i":"Espejo de justicia","r":"ruega por nosotros"},{"i":"Trono de sabiduría","r":"ruega por nosotros"},{"i":"Causa de nuestra alegría","r":"ruega por nosotros"},{"i":"Vaso espiritual","r":"ruega por nosotros"},{"i":"Vaso digno de honor","r":"ruega por nosotros"},{"i":"Vaso insigne de devoción","r":"ruega por nosotros"},{"i":"Rosa mística","r":"ruega por nosotros"},{"i":"Torre de David","r":"ruega por nosotros"},{"i":"Torre de marfil","r":"ruega por nosotros"},{"i":"Casa de oro","r":"ruega por nosotros"},{"i":"Arca de la alianza","r":"ruega por nosotros"},{"i":"Puerta del cielo","r":"ruega por nosotros"},{"i":"Estrella de la mañana","r":"ruega por nosotros"},{"i":"Salud de los enfermos","r":"ruega por nosotros"},{"i":"Refugio de los pecadores","r":"ruega por nosotros"},{"i":"Consuelo de los afligidos","r":"ruega por nosotros"},{"i":"Auxilio de los cristianos","r":"ruega por nosotros"},{"i":"Reina de los Ángeles","r":"ruega por nosotros"},{"i":"Reina de los Patriarcas","r":"ruega por nosotros"},{"i":"Reina de los Profetas","r":"ruega por nosotros"},{"i":"Reina de los Apóstoles","r":"ruega por nosotros"},{"i":"Reina de los Mártires","r":"ruega por nosotros"},{"i":"Reina de los Confesores","r":"ruega por nosotros"},{"i":"Reina de las Vírgenes","r":"ruega por nosotros"},{"i":"Reina de todos los Santos","r":"ruega por nosotros"},{"i":"Reina concebida sin pecado original","r":"ruega por nosotros"},{"i":"Reina asunta al cielo","r":"ruega por nosotros"},{"i":"Reina del Santísimo Rosario","r":"ruega por nosotros"},{"i":"Reina de la familia","r":"ruega por nosotros"},{"i":"Reina de la paz","r":"ruega por nosotros"}],"cordero":[["Cordero de Dios, que quitas los pecados del mundo,","perdónanos, Señor."],["Cordero de Dios, que quitas los pecados del mundo,","perdónanos, Señor."],["Cordero de Dios, que quitas los pecados del mundo,","ten piedad de nosotros."]],"versiculo":["Ruega por nosotros, Santa Madre de Dios,","para que seamos dignos de alcanzar las promesas de nuestro Señor Jesucristo."],"oremos":["Te rogamos nos concedas, Señor Dios nuestro, gozar de continua salud de alma y cuerpo, y por la gloriosa intercesión de la bienaventurada siempre Virgen María, vernos libres de las tristezas de la vida presente y disfrutar de las alegrías eternas. Por Cristo nuestro Señor. Amén."],"cierre_decena":{"rubrica":"Puedes concluir el rezo de cada decena con una de las siguientes invocaciones:","opcionales":[{"texto":"«Oh Jesús, perdona nuestros pecados, líbranos del fuego del Infierno, lleva al cielo todas las almas, especialmente las más necesitadas de tu misericordia».","nota":"(La Virgen de Fátima, 13 de julio de 1917)"},{"texto":"«Dios mío, yo creo y espero en ti, te adoro y te amo. Te pido perdón por todos aquellos que no creen, ni adoran, ni esperan, ni te aman».","nota":""},{"texto":"«Santísima Trinidad, Padre, Hijo y Espíritu Santo: te adoro profundamente y te ofrezco el preciosísimo Cuerpo, Sangre, Alma y Divinidad de Jesucristo, presente en todos los sagrarios de la tierra, en reparación de los ultrajes, sacrilegios e indiferencias con que Él es ofendido. Y por los méritos infinitos de su sacratísimo Corazón y del Corazón inmaculado de María, te pido la conversión de los pobres pecadores».","nota":"(El ángel de la paz a los tres pastorcitos de Fátima, en 1916)"}],"fijas":[{"i":"Reina de la paz,","r":"ruega por nosotros."},{"i":"San José,","r":"ruega por nosotros."},{"i":"Santos Miguel, Gabriel y Rafael arcángeles,","r":"ruega por nosotros."}],"oraciones":[{"titulo":"Ángel de la guarda","texto":"Ángel de Dios, que eres mi custodio, ya que la bondad divina me ha encomendado a ti, ilumíname, guárdame, defiéndeme y gobiérname. Amén."},{"titulo":"Por los difuntos","texto":"Dales, Señor, el descanso eterno y brille para ellos la luz perpetua. Descansen en paz. Amén."}],"alabados":["Alabados siempre sean,","los santos nombres de Jesús, José y María."]},"base":[{"titulo":"Padrenuestro","texto":"Padre nuestro, que estás en el cielo, santificado sea tu Nombre; venga a nosotros tu reino; hágase tu voluntad en la tierra como en el cielo. Danos hoy nuestro pan de cada día; perdona nuestras ofensas, como también nosotros perdonamos a los que nos ofenden; no nos dejes caer en la tentación, y líbranos del mal. Amén."},{"titulo":"Avemaría","texto":"Dios te salve, María, llena eres de gracia, el Señor es contigo; bendita tú eres entre todas las mujeres, y bendito es el fruto de tu vientre, Jesús. Santa María, Madre de Dios, ruega por nosotros, pecadores, ahora y en la hora de nuestra muerte. Amén."},{"titulo":"Gloria","texto":"Gloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén."}]},"finales":[{"titulo":"A la Madre de Dios que desata los nudos","tipo":"lista","antes":["Nuestra Señora Desatanudos, jamás se ha oído decir que ninguno de los que han acudido a tu protección, implorando tu asistencia y reclamando tu socorro, haya sido abandonado de ti. Animado con esta confianza, a ti también acudo, ¡oh Madre, Virgen de las vírgenes! Y, aunque gimiendo bajo el peso de mis pecados, me atrevo a comparecer ante tu presencia soberana.","No deseches mis súplicas, ¡oh Madre de Dios!, antes bien, inclina a ellas tus oídos y dígnate atenderlas favorablemente.","¡Tú eres la que desata todos los nudos!","Con tus manos rebosantes del amor de Dios deshaces, como si fueran nudos, los problemas y obstáculos que encuentro en mi camino y se vuelven como una cinta derecha, como un camino llano.","Dirige a mí tu mirada llena de compasión, mira cuántos nudos oprimen mi vida. Tú conoces mis sufrimientos y mi dolor. Tú sabes cuánto me paralizan estos nudos.","Santa María, Madre de Dios y Virgen llena de gracia, a ti te ha encargado Dios desatar los nudos de la vida de tus hijos, por eso hoy pongo en tus manos:"],"items":["los nudos de todas mis dificultades materiales y espirituales, familiares, escolares, profesionales, en todas mis relaciones;","los nudos de todos los problemas que me angustian desde hace años y que no sé cómo resolver;","los nudos de todas esas situaciones bloqueadas o enredadas, para las que no veo solución;","los nudos de los litigios familiares, de la incomprensión entre padres e hijos, entre mayores y jóvenes; de la falta de respeto, de la violencia;","los nudos del rencor y del resentimiento entre los esposos, la falta de paz y alegría en la familia;","los nudos de las traiciones entre los cónyuges, de los esposos que se separan, de la división en las familias;","los nudos provocados por el hijo que se droga, que está enfermo, que ha dejado el hogar, que se ha alejado de Dios, que se ha suicidado;","los nudos del alcoholismo, de los juegos de azar, todos mis vicios y los de las personas que amo;","los nudos de las heridas que me han causado los demás;","los nudos de las heridas que yo he causado a los demás;","los nudos del rencor y del odio que me atormentan;","los nudos del sentimiento de culpa, del aborto, de las enfermedades, del desempleo, de los miedos, de la discordia, del fracaso, del endeudamiento, de la tristeza, del divorcio, de las preocupaciones económicas, del estrés, de la soledad;","los nudos del ocultismo, de la magia, de la superstición;","los nudos de la incredulidad, de la soberbia, de la envidia, los celos y las sospechas;","los nudos de la avaricia de dinero, de poder, de la vanidad;","los nudos de las habladurías, las conversaciones ociosas, la difamación, las indiscreciones y del hablar mal de los demás;","los nudos que yo mismo me he procurado a causa de mi orgullo;","los nudos de mi corazón, que me impiden ser libre y amar con generosidad."],"despues":["María, en tus manos no hay nudo que no pueda ser desatado. Por tu poder de intercesión ante tu Hijo Jesús, mi Salvador, recibe hoy en particular este nudo (citar). Para gloria de Dios, te pido que lo desates, y que lo desates para siempre.","Espero en ti, la única Consoladora que Dios me ha dado; tú eres la fortaleza de mis frágiles fuerzas, la riqueza de mis miserias, la liberación de todo lo que me impide estar con Cristo; acoge mi petición. Mírame, guíame, protégeme, tú eres mi único y seguro refugio. María Desatanudos, ruega por mí a tu Hijo Jesucristo, nuestro Señor, ahora y en la hora de mi muerte. Amén."]},{"titulo":"Oración a María Desatanudos","tipo":"texto","parrafos":["Oh María, Madre de Cristo y de la Iglesia, Reina de los pueblos y de las familias, tú que llevaste en tu seno al Hijo de Dios, que rompió el yugo que nos encadenaba al pecado, concédenos la gracia de vivir en la verdadera libertad de los hijos de Dios. Con tus santas manos, Virgen purísima, Reina de la paz, desata los numerosos y enredados nudos que complican y entristecen nuestra vida. Ayúdanos a ponernos al servicio del bien con corazón simple y puro, siempre dispuestos al perdón y a la reconciliación. Haz que, sin anteponer nada al amor de Cristo, en su mismo amor amemos sinceramente a nuestros hermanos. Amén."]},{"titulo":"Agradecimiento a María Desatanudos","tipo":"texto","parrafos":["María Desatanudos, con el corazón alegre y el ánimo rebosante de la más viva gratitud, vuelvo a ti para agradecerte las gracias recibidas.","Quiero ser completamente tuyo. Ayúdame a recorrer contigo el camino de la fidelidad absoluta a Jesús en su Iglesia.","Gracias, Virgen santa, porque me llevas siempre amorosamente de la mano y diriges mi corazón hacia Jesús.","Gracias porque me enseñas a buscar mi bien solo en Dios, que es fuente de toda paz y toda gracia.","Gracias porque me enseñas a querer cumplir únicamente su voluntad, para realizar en mí el plan que ha establecido desde la eternidad.","Gracias porque me enseñas a vivir con Jesús y para Jesús. Gracias porque, si caigo, me ayudas a volver a él con el sacramento del Perdón y de la alegría. Así, Virgen santa, con la paz de Dios en el corazón, podré llevar a todos la verdadera alegría y la paz. Dame un gran amor por todos los sacramentos, signos que tu Hijo nos ha dejado para encontrarlo.","Gracias, María, porque proteges a mi familia; haz que permanezca siempre unida y firme en el amor infinito de Dios.","Gracias, María, porque dispensas a mi familia las gracias espirituales y materiales que necesita; aumenta en especial la fe, la esperanza y la caridad.","Gracias por haberme dado a conocer el poder de esta novena. Amén."]}],"otras":[{"titulo":"Oración a María Desatanudos","nota":"Con el imprimatur del entonces arzobispo de Buenos Aires, monseñor Bergoglio.","parrafos":["Santa María, llena de la Presencia de Dios, durante los días de tu vida aceptaste con toda humildad la voluntad del Padre, y el maligno nunca fue capaz de enredarte con sus engaños. Ya junto a tu Hijo intercediste por nuestras dificultades y, con total simplicidad y paciencia, nos diste ejemplo de cómo desenredar la madeja de nuestras vidas. Y al quedarte para siempre como Madre nuestra, pones orden y haces más claros los lazos que nos unen al Señor.","Santa María, Madre de Dios y Madre nuestra, tú que con corazón materno desatas los nudos que entorpecen nuestra vida, te pedimos que recibas en tus manos... y que nos libres de las ataduras y confusiones con que nos hostiga el que es nuestro enemigo.","Por tu gracia, por tu intercesión, con tu ejemplo, líbranos de todo mal, Señora nuestra, y desata los nudos que impiden que nos unamos a Dios para que, libres de toda confusión y error, lo hallemos en todas las cosas, tengamos en él puestos nuestros corazones y podamos servirle siempre en nuestros hermanos. Amén."]},{"titulo":"Súplica a María Desatanudos","nota":"rezada en Tv2000","parrafos":["Santa María, Madre de Dios, tú que has sido mujer y madre, que has respondido a Dios: «Hágase tu voluntad», infúndenos tu fuerza, la fuerza de tu fe y de tu amor.","Virgen María, hoy vengo a ti con el corazón lleno de sufrimientos. Vengo a dolerme por mis sufrimientos entre los brazos de una Madre que nos escucha siempre, que todo lo soporta, que todo lo cree. Por eso recurro a ti, María, Madre mía: líbrame y quita los nudos que me impiden ser feliz, acercarme a ti y a tu Hijo.","Que mi oración transforme mi corazón de piedra y me permita esperar en un mundo mejor y más generoso.","María, tú que desatas los nudos, escucha mi oración. Amén."]},{"titulo":"Tú eres la que desata todos nuestros nudos","nota":"Mons. Marco Frisina","parrafos":["Santa María, Madre de Dios y Virgen llena de gracia, ¡tú eres la que desata todos nuestros nudos! Con tus manos llenas del amor de Dios desatas, como si fueran nudos, los obstáculos a lo largo de nuestro camino que, en tus manos, se convierten en una cinta derecha, ¡como un sendero allanado por el amor de Dios!","¡Oh santa y admirable Virgen y Madre! Desata todos los nudos que nosotros mismos nos hemos hecho a causa de nuestra obstinación, y también todos los que obstaculizan nuestro camino.","Ilumínalos con la luz de tus ojos para que se vuelvan transparentes y, llenos de gratitud, podamos desatar con tus manos lo que a nosotros nos parece imposible.","Oh María, tú que desatas los nudos, sé nuestra querida Madre, toma nuestras manos y hazlas dóciles y llenas de tu fuerza para que tus manos, a través de las nuestras, lleven paz, alivio y ayuda. Amén."]},{"titulo":"Súplica a María Desatanudos","nota":"San Alfonso María de Ligorio","parrafos":["Oh Virgen inmaculada, Virgen bendita, tú eres la dispensadora universal de todas las gracias. Eres la esperanza de todos los hombres y mi esperanza. Doy las gracias siempre y en todo momento a mi amado Señor Jesús, que me ha permitido conocerte y me ha hecho entender que puedo recibir las gracias divinas y salvarme. Así eres tú misma, augusta Madre de Dios, porque sé, gracias a los méritos de Jesucristo, y a tu intercesión, que puedo alcanzar la salvación eterna.","Oh Señora mía, tan solícita al visitar a Isabel para santificarla, te ruego: date prisa en venir a visitar mi alma. Tú sabes, mejor que yo, qué miserable es y cuántos males la afligen: afectos desordenados, malos hábitos, tantos pecados cometidos y enfermedades que solo pueden llevarla a la muerte eterna. Solo de ti depende curar mi alma de todas sus enfermedades y desatar todos los nudos que la afligen. Ruega por mí, oh Virgen María, y encomiéndame a tu divino Hijo. Tú conoces, mejor que yo, mis miserias y mis necesidades.","Oh Madre mía y dulce Reina, ruega por mí a tu divino Hijo y obtenme las gracias necesarias y esenciales para mi salvación eterna. Me abandono completamente en ti. Tus oraciones no han sido nunca rechazadas por él: son las oraciones de una Madre a su Hijo, y este Hijo te ama tanto, que hace todo lo que quieres para aumentar tu gloria y testimoniar el gran amor que te tiene.","«Oh Señor, detengámonos aquí: me consagro plenamente a ti en cuerpo y alma y tú, ocúpate de mi salvación. Así sea» (San Alfonso María de Ligorio)."]},{"titulo":"A la Madre del Buen Consejo","nota":"Pío XII","parrafos":["Virgen Santa, a tus pies nos conduce la incertidumbre en la búsqueda de la verdad y el bien para invocarte con el dulce título de Madre del Buen Consejo. Ven en nuestro auxilio, mientras, por los caminos del mundo, las tinieblas del error y del mal buscan nuestra ruina, desviando mentes y corazones.","Tú, sede de la Sabiduría y Estrella del mar, ilumina a los que dudan y se equivocan, para que los falsos bienes no les engañen; dales fuerza para resistir las pasiones y el pecado. Intercede ante tu Hijo, ¡oh Madre del Buen Consejo!, para que amemos la virtud y, en los momentos difíciles e inciertos, abracemos lo que conviene a nuestra salvación. Si tu mano nos sostiene, caminaremos firmes por los senderos señalados por la vida y las palabras de Jesús, nuestro Redentor; y, después de seguir bajo tu maternal estrella, libres y seguros en las luchas terrenales, al Sol de la verdad y la justicia, gozaremos contigo de la paz eterna en el puerto de la salvación. Amén."]}],"letanias_bc":[{"i":"Señor, ten piedad","r":"Señor, ten piedad"},{"i":"Cristo, ten piedad","r":"Cristo, ten piedad"},{"i":"Señor, ten piedad","r":"Señor, ten piedad"},{"i":"Santa Virgen María, nuestra Madre,","r":"protégenos y aconséjanos"},{"i":"Hija dilectísima del Eterno Padre","r":"protégenos y aconséjanos"},{"i":"Madre augusta del Hijo de Dios","r":"protégenos y aconséjanos"},{"i":"Divina Esposa del Espíritu Santo","r":"protégenos y aconséjanos"},{"i":"Templo vivo de la Santísima Trinidad","r":"protégenos y aconséjanos"},{"i":"Reina del cielo y de la tierra","r":"protégenos y aconséjanos"},{"i":"Sede de la divina sabiduría","r":"protégenos y aconséjanos"},{"i":"Depositaria de los secretos del Altísimo","r":"protégenos y aconséjanos"},{"i":"Virgen prudentísima","r":"protégenos y aconséjanos"},{"i":"En nuestras perplejidades y en nuestras dudas","r":"protégenos y aconséjanos"},{"i":"En nuestras angustias y en nuestras tribulaciones","r":"protégenos y aconséjanos"},{"i":"En nuestros quehaceres y en nuestras empresas","r":"protégenos y aconséjanos"},{"i":"En los peligros y en las tentaciones en los combates contra el demonio, el mundo y la carne","r":"protégenos y aconséjanos"},{"i":"En nuestros desánimos","r":"protégenos y aconséjanos"},{"i":"En todas nuestras necesidades","r":"protégenos y aconséjanos"},{"i":"En la hora de nuestra muerte","r":"protégenos y aconséjanos"},{"i":"Por tu inmaculada concepción y feliz natividad","r":"protégenos y aconséjanos"},{"i":"Por tu bendita visitación y divina maternidad","r":"protégenos y aconséjanos"},{"i":"Por tu santa purificación y los dolores y angustias de tu materno corazón","r":"protégenos y aconséjanos"},{"i":"Por tu preciosa muerte y triunfal asunción","r":"protégenos y aconséjanos"}],"oremos_bc":["Oh Dios, que nos has dado por Madre a la Madre de tu dilectísimo Hijo y te has dignado glorificar su hermosa imagen mediante una milagrosa aparición, recuérdanos, te suplicamos, que siguiendo siempre sus consejos, podemos vivir según tu Corazón y alcanzar la patria celestial. Por Jesucristo nuestro Señor. Amén."],"lecturas":[{"titulo":"María nos ayuda a desatar los nudos dolorosos de la vida","parrafos":["Dejémonos conquistar por las palabras del papa Francisco en su extraordinaria catequesis, impartida con ocasión de la oración mariana (organizada en el ámbito del Año de la Fe) de los días 12-13 de octubre de 2013, sobre el papel de la Virgen que desata los nudos dolorosos de nuestra vida. El Papa, con la simplicidad que le caracteriza, nos asegura que María, «mujer de fe, verdadera creyente», desata los nudos de nuestra vida, incluso los «más intrincados». La conmemoración de la última aparición de la Virgen de Fátima (13 de octubre de 1917) concluyó con la celebración de la santa Misa y el acto de consagración a María.","Queridos hermanos y hermanas: Este encuentro del Año de la fe se ha dedicado a María, Madre de Cristo y de la Iglesia, Madre nuestra. Su imagen, traída desde Fátima, nos ayuda a sentir su presencia entre nosotros. Hay una realidad: María siempre nos lleva a Jesús. Es una mujer de fe, una verdadera creyente. Podemos preguntarnos: ¿Cómo es la fe de María?","1. El primer elemento de su fe es este: La fe de María desata el nudo del pecado (cf. Conc. Ecum. Vat II, Const. dogm. Lumen gentium, 56). ¿Qué significa esto? Los Padres conciliares [del Vaticano II] han tomado una expresión de san Ireneo que dice así: «El nudo de la desobediencia de Eva lo desató la obediencia de María. Lo que ató la virgen Eva por su falta de fe, lo desató la Virgen María por su fe» (Adversus Haereses, III, 22, 4).","El «nudo» de la desobediencia, el «nudo» de la incredulidad. Cuando un niño desobedece a su madre o a su padre, podríamos decir que se forma un pequeño «nudo». Esto sucede si el niño actúa dándose cuenta de lo que hace, especialmente si hay de por medio una mentira; en ese momento no se fía de la mamá o del papá. Ustedes saben cuántas veces pasa esto. Entonces, la relación con los padres necesita ser limpiada de esta falta y, de hecho, se pide perdón para que haya de nuevo armonía y confianza. Algo parecido ocurre en nuestras relaciones con Dios. Cuando no lo escuchamos, no seguimos su voluntad, cometemos actos concretos en los que mostramos falta de confianza en él - y esto es pecado -, se forma como un nudo en nuestra interioridad. Y estos nudos nos quitan la paz y la serenidad. Son peligrosos, porque varios nudos pueden convertirse en una madeja, que siempre es más doloroso y más difícil de deshacer.","Pero para la misericordia de Dios - lo sabemos - nada es imposible. Hasta los nudos más enredados se deshacen con su gracia. Y María, que con su «sí» ha abierto la puerta a Dios para deshacer el nudo de la antigua desobediencia, es la madre que con paciencia y ternura nos lleva a Dios, para que él desate los nudos de nuestra alma con su misericordia de Padre. Todos nosotros tenemos alguno, y podemos preguntarnos en nuestro corazón: ¿Cuáles son los nudos que hay en mi vida? «Padre, los míos no se pueden desatar». Pero eso es un error. Todos los nudos del corazón, todos los nudos de la conciencia se pueden deshacer. ¿Pido a María que me ayude a tener confianza en la misericordia de Dios para deshacerlos, para cambiar? Ella, mujer de fe, sin duda nos dirá: «Vete adelante, ve donde el Señor: Él comprende». Y ella nos lleva de la mano, Madre, Madre, hacia el abrazo del Padre, del Padre de la misericordia.","2. Segundo elemento: la fe de María da carne humana a Jesús. Dice el Concilio: «Por su fe y obediencia engendró en la tierra al Hijo mismo del Padre, ciertamente sin conocer varón, cubierta con la sombra del Espíritu Santo» (Const. dogm., Lumen gentium, 63). Este es un punto sobre el que los Padres de la Iglesia han insistido mucho: María ha concebido a Jesús en la fe, y después en la carne, cuando ha dicho «sí» al anuncio que Dios le ha dirigido mediante el ángel. ¿Qué quiere decir esto? Que Dios no ha querido hacerse hombre ignorando nuestra libertad, ha querido pasar a través del libre consentimiento de María, a través de su «sí». Le ha preguntado: «¿Estás dispuesta a esto?». Y ella ha dicho: «sí».","Pero lo que ha ocurrido en la Virgen Madre de manera única, también nos sucede a nosotros en el plano espiritual cuando acogemos la Palabra de Dios con corazón bueno y sincero y la ponemos en práctica. Es como si Dios adquiriera carne en nosotros. Él viene a habitar en nosotros, porque toma morada en aquellos que le aman y cumplen su Palabra. No es fácil entender esto, pero, sí, es fácil sentirlo en el corazón.","¿Pensamos que la encarnación de Jesús es sólo algo del pasado, que no nos concierne personalmente? Creer en Jesús significa ofrecerle nuestra carne, con la humildad y el valor de María, para que él pueda seguir habitando en medio de los hombres; significa ofrecerle nuestras manos para acariciar a los pequeños y a los pobres; nuestros pies para salir al encuentro de los hermanos; nuestros brazos para sostener a quien es débil y para trabajar en la viña del Señor; nuestra mente para pensar y hacer proyectos a la luz del Evangelio; y, sobre todo, nuestro corazón para amar y tomar decisiones según la voluntad de Dios. Todo esto acontece gracias a la acción del Espíritu Santo. Y, así, somos los instrumentos de Dios para que Jesús actúe en el mundo a través de nosotros.","3. Y el último elemento es la fe de María como camino: El Concilio afirma que María «avanzó en la peregrinación de la fe» (ibíd., 58). Por eso ella nos precede en esta peregrinación, nos acompaña, nos sostiene. ¿En qué sentido la fe de María ha sido un camino? En el sentido de que toda su vida fue un seguir a su Hijo: él —Jesús— es la vía, él es el camino. Progresar en la fe, avanzar en esta peregrinación espiritual que es la fe, no es sino seguir a Jesús; escucharlo y dejarse guiar por sus palabras; ver cómo se comporta él y poner nuestros pies en sus huellas, tener sus mismos sentimientos y actitudes. Y ¿cuáles son los sentimientos y actitudes de Jesús? Humildad, misericordia, cercanía, pero también un firme rechazo de la hipocresía, de la doblez, de la idolatría. La vía de Jesús es la del amor fiel hasta el final, hasta el sacrificio de la vida; es la vía de la cruz. Por eso, el camino de la fe pasa a través de la cruz, y María lo entendió desde el principio, cuando Herodes quiso matar a Jesús recién nacido. Pero después, esta cruz se hizo más pesada, cuando Jesús fue rechazado: María siempre estaba con Jesús, seguía a Jesús mezclada con el pueblo, y oía sus chácharas, la odiosidad de aquellos que no querían a Jesús. Y esta cruz, ella la ha llevado. La fe de María afrontó entonces la incomprensión y el desprecio. Cuando llegó la «hora» de Jesús, esto es, la hora de la pasión, la fe de María fue entonces la lamparilla encendida en la noche, esa lamparilla en plena noche. María veló durante la noche del sábado santo. Su llama, pequeña pero clara, estuvo encendida hasta el alba de la Resurrección; y cuando le llegó la noticia de que el sepulcro estaba vacío, su corazón quedó henchido de la alegría de la fe, la fe cristiana en la muerte y resurrección de Jesucristo. Porque la fe siempre nos lleva a la alegría, y ella es la Madre de la alegría. Que ella nos enseñe a caminar por este camino de la alegría y a vivir esta alegría. Este es el punto culminante — esta alegría, este encuentro entre Jesús y María —, pero imaginemos cómo fue... Este encuentro es el punto culminante del camino de la fe de María y de toda la Iglesia. ¿Cómo es nuestra fe? ¿La tenemos encendida, como María, también en los momentos difíciles, los momentos de oscuridad? ¿He sentido la alegría de la fe?","Esta tarde, Madre, te damos gracias por tu fe de mujer fuerte y humilde; y renovamos nuestra entrega a ti, Madre de nuestra fe. Amén."]},{"titulo":"Acto de consagración a María","parrafos":["Bienaventurada Virgen María de Fátima, con renovada gratitud por tu presencia maternal unimos nuestra voz a la de todas las generaciones que te llaman bienaventurada. Celebramos en ti las grandes obras de Dios, que nunca se cansa de inclinarse con misericordia hacia la humanidad, afligida por el mal y herida por el pecado, para curarla y salvarla. Acoge con benevolencia de Madre el acto de consagración que hoy hacemos con confianza, ante esta imagen tuya tan querida por nosotros. Estamos seguros de que cada uno de nosotros es precioso a tus ojos y que nada de lo que habita en nuestros corazones es ajeno a ti. Nos dejamos alcanzar por tu dulcísima mirada y recibimos la consoladora caricia de tu sonrisa. Custodia nuestra vida entre tus brazos: bendice y refuerza todo deseo de bien; reaviva y alimenta la fe; sostén e ilumina la esperanza; suscita y anima la caridad; guíanos a todos por el camino de la santidad. Enséñanos tu mismo amor de predilección por los pequeños y los pobres, por los excluidos y los que sufren, por los pecadores y los extraviados de corazón: congrega a todos bajo tu protección y entrégalos a todos a tu querido Hijo, nuestro Señor Jesucristo. Amén."]},{"titulo":"María Desatanudos","parrafos":["El arte cristiano ha sido siempre un medio eficaz de expresión de la fe profunda del ser humano. Ha dado a la humanidad espléndidas obras de arte que son síntesis de belleza y compendios de verdades de fe; a través de colores y formas, luces y sombras, se expresa el propio credo religioso, que se transmite de generación en generación en la forma original y simple de la imagen.","Este es también el caso de un cuadro que representa a la Virgen desatando una serie de nudos de una cinta. La bellísima pintura, recientemente atribuida al pintor bávaro Johann Georg Melchior Schmidtner (1625-1705), fue realizada alrededor del año 1700 por encargo de un noble prelado y colocada en la iglesia de Sankt Peter am Perlach, atendida por los Jesuitas, en el corazón de la ciudad de Augsburgo, en Baviera (Alemania)."]},{"titulo":"Historia","parrafos":["En el origen de la devoción a María «Desatanudos» no hay una aparición de la Virgen, sino una historia de la vida cotidiana, una historia familiar.","El noble Wolfgang Langenmantel se había casado con Sophie Imhoff en 1612. Pocos años después, su matrimonio entró en crisis, tanto que los dos esposos empezaron a considerar la idea del divorcio. Las incomprensiones y los litigios habían deteriorado su relación y estaban cerca de la ruptura definitiva. Antes de la completa separación, Wolfgang decidió acercarse a Ingolstadt (a unos setenta kilómetros al norte de Augsburgo) para consultar al padre jesuita Jakob Rem.","El sacerdote, gracias a su experiencia y discernimiento, tuvo la iluminación de confiar la situación de Wolfgang a María, bajo la advocación de «Madre tres veces admirable» (Mater ter admirabilis), que él mismo había acuñado. El noble viajó hasta el convento en cuatro ocasiones, en un lapso de tiempo de 28 días, y, gracias a la oración rezada a la Virgen en compañía del jesuita, obtuvo cambios muy positivos en su situación familiar.","El último sábado del mes, el 23 de septiembre de 1615, el padre Jakob Rem, mientras rezaba frente a la imagen de la Virgen que se encontraba en la capilla del convento, elevó la cinta nupcial del matrimonio Langenmantel, pidiendo que se desatasen todos los nudos. La cinta, a la que se hace referencia en el relato, estaba relacionada con una tradición de la época: durante la celebración del sacramento del matrimonio, las manos unidas de los esposos se ataban con una cinta blanca, preparada para la ocasión, como signo del nudo invisible e indisoluble que les unía para toda la vida. Con cada discusión, Sophie había hecho un pequeño nudo en su cinta matrimonial; esa misma cinta, llena de nudos, se le entregó al padre jesuita para que recitara su oración especial. Los nudos se desataron milagrosamente y la cinta siguió siendo tan blanca como en el primer día del matrimonio.","Después de esto, la pareja experimentó los efectos positivos de la oración, evitando así el divorcio. Así, la cinta — finalmente sin nudos — indicaba el vínculo conyugal pacificado.","Pasaron los años y el nieto de Wolfgang y Sophie, Hieronymus Ambrosius Von Langenmantel (1641-1718), eligió la vida religiosa y llegó a ser canónigo de la iglesia de Sankt Peter en Augsburgo (1666-1709). Hieronymus decidió dedicar una de las capillas de la iglesia a la memoria de su familia, para ello encargó un retablo en el que se contara la historia del matrimonio de sus abuelos, salvado gracias a la intercesión de la Virgen María. El altar se dedicó a Nuestra Señora del Buen Consejo y el cuadro se encargó a Johann Georg Melchior Schmidtner que, en esta pintura tan singular y sugestiva, representó a la Virgen como la que «desata los nudos de la cinta conyugal»."]},{"titulo":"Descripción del cuadro","parrafos":["Bien visible, en la parte alta del cuadro, hay una paloma, el símbolo más usual para representar al Espíritu Santo, en referencia al bautismo de Jesús en el Jordán (Mc 1,10; Mt 3,16; Lc 3,22; Jn 1,32). En nuestro caso, el Espíritu es la fuerza dulce y suave que se derrama sobre María. María está toda circundada de la luz de Dios y vive en Dios. Este símbolo manifiesta claramente una condición que afecta a todo el ser de María: ella es la «llena de gracia», colmada del amor de Dios. Podemos advertir también la presencia del Espíritu Santo en el viento que mueve el manto de la Virgen. Aunque el viento no se ve, se deja sentir; no tiene un rostro que ofrecer a nuestra visión, pero se advierte su presencia: es una fuerza que atrapa a toda la persona. Toda la vida de María se desenvuelve bajo la acción del Espíritu Santo, de quien es esposa (Lc 1,35), por la maternidad universal de todos aquellos que son engendrados por Dios en la fe en Cristo.","La imagen central es la de una joven mujer, bella y dulcísima, de cuerpo entero. Sobre el hombro y el costado lleva un manto azul como movido por el viento. A partir del s. XIII, la Iglesia estableció que en los cuadros, frescos, mosaicos y vidrieras, en los iconos y sobre los altares, el manto de María debía ser azul, y más concretamente azul marino, el color más raro y costoso en la paleta de los pintores medievales, obtenido del polvo del precioso lapislázuli. Simboliza así la trascendencia, la vida divina. El manto azul que cubre a María es signo de la gracia divina que la envolvió desde su concepción virginal. El color rojo, sacado de la tierra, indica la dimensión humana. La túnica roja, su total sumisión a la voluntad del Padre que hizo posible la encarnación del Hijo. Por eso, María tiene el vestido de color rojo, porque es una criatura, pero su manto es azul para indicar que es la «llena de gracia», colmada del amor de Dios. Desde el punto de vista humano, María es solo una humilde muchacha del pueblo, no goza de ningún título o papel especial en la sociedad, pero en el orden de la gracia ella es la toda santa, la toda hermosa; su mente, su voluntad, su corazón están abiertos a la gracia de Dios, atentos a toda inspiración divina en una completa disponibilidad para cumplir su voluntad: «He aquí la esclava del Señor» (Lc 1,38).","Sobre la cabeza, María tiene una corona de doce estrellas, símbolo de triunfo y de victoria. El número doce es, tradicionalmente, muy rico en símbolos: siendo el producto de tres (que simboliza la divinidad) por cuatro (que simboliza la humanidad), indica la perfecta unión entre lo humano y lo divino. En el mundo judío, el doce representaba la plenitud: doce son las tribus en las que se divide el pueblo de Israel, doce son los apóstoles elegidos por Jesús; es un número perfecto para indicar la gran familia de los creyentes. La corona recuerda también el capítulo 12 del Apocalipsis, en el que se cuenta la visión de la lucha entre la mujer y el dragón. Se trata de la lucha entre el pueblo de Dios, la Iglesia, y Satanás. Pero, donde está la Iglesia está María, y donde está María está la Iglesia; el seno virginal y fecundo de María es el compendio de la realidad de la Iglesia, virgen fecunda. María es primicia e imagen de la Iglesia. Además, la figura de la mujer es por una parte gloriosa, triunfante, y por otra, todavía en aflicción. Así es, en efecto, la Iglesia: si en el cielo ya está asociada a la gloria de su Señor, en la historia vive continuamente las pruebas y desafíos que implica el conflicto entre Dios y el maligno, el enemigo de siempre. En esta lucha, que los discípulos de Jesús deben afrontar, María no nos deja solos. María, aunque ha entrado una vez y para siempre en la gloria del cielo, esto no quiere decir que esté lejos, separada de nosotros; al contrario, María nos acompaña, lucha con nosotros, sostiene a los cristianos en el combate contra las fuerzas del mal. La oración con María, en particular el Rosario, tiene también esta dimensión de «lucha», es decir, es una oración que sostiene en la batalla contra el maligno y sus fuerzas cómplices. También el Rosario nos sostiene en la batalla.","La Virgen tiene un rostro tierno y dulce, en una actitud llena de paz; tiene los ojos entornados porque está toda concentrada en la misión que se le ha encargado: desatar los nudos, grandes y pequeños, de una cinta blanca enredada. La mediación maternal de María se explica en particular por su intercesión. Como dijo a Jesús en Caná: «No tienen vino» (Jn 2,3), así ahora en el cielo presenta al Hijo todas nuestras necesidades interponiendo constantemente su maternal intercesión.","María tiene la luna bajo sus pies (Ap 12,1-2), con los que aplasta la cabeza de la serpiente (Gén 3,15): María es la reparadora del pecado, la que recupera la integridad primitiva venciendo al mal. Ella es, por tanto, la nueva Eva, el inicio de la nueva creación: María es la Inmaculada, pero también la Reina del universo. Así, está plenamente asociada a la victoria de Jesucristo, su Hijo, sobre el pecado y la muerte. Por eso aplasta la cabeza de la serpiente, símbolo de Satanás. Decía san Bernardo: «¡Oh, cuánto tiemblan los demonios con solo escuchar pronunciar el nombre de María!». Si en las tentaciones los cristianos tuvieran el buen sentido de invocar con confianza el nombre de María, no caerían «¡porque los demonios huyen y el Infierno tiembla al sonido de este nombre perfecto!».","Está claro que durante el curso de toda la historia humana, así como en la vida de cada uno de nosotros, María nos sostiene para que no caigamos en el error de nuestros padres, sino que permanezcamos fieles a Dios, venciendo los asaltos del demonio.","También los ángeles, servidores e instrumentos de Dios para acompañar a los hombres y custodiarlos en su camino (Éx 23,20-22), ocupan un puesto relevante en el cuadro. A la derecha se ve un ángel que acerca a María una cinta llena de nudos de todo tipo. Con los ojos vueltos a la Virgen nos invita a no dudar, aunque los nudos sean muchos y difíciles de desatar. Al otro lado, el izquierdo, en donde se refleja la luz de la misericordia y de la salvación divina, otro ángel recibe en sus manos la cinta, que ahora está lisa. El ángel mira al fiel, al que muestra con mirada elocuente la cinta sin nudos para indicar que su oración ha sido escuchada y el nudo desatado por intercesión de María.","Finalmente, en la parte inferior del cuadro, se distingue otro ángel: es Rafael (que significa “Dios cura”). Su presencia es el signo de la delicadeza con que Dios se sirve de intermediarios para socorrer rápidamente a quien confía en él (Tob 3,16-17).","Un Dios que se pone al paso de los hombres y camina con ellos, respetando los tiempos, conduciéndolos hacia la felicidad. El arcángel tiene a Tobías cogido de la mano (se reconoce por el pez que tiene en la mano y el perro que le sigue: el perro es signo de la fidelidad a Dios) y le conduce por el camino. La historia de Tobías se narra en la Biblia, en el libro que lleva su nombre. Cuenta cómo Dios, sirviéndose de Rafael, conduce a las dos parejas de esposos — Tobit y Ana, Tobías y Sara — para librarles del mal presente en sus relaciones familiares y conyugales. En especial, el amor entre Tobías y Sara es el signo del deseo de Dios y la total consagración a él, incluso cuando las dificultades de la vida parecen insuperables, haciendo de ellos ejemplo para todas las parejas de esposos. Los dos jóvenes son imagen de la pareja que no excluye a Dios de sus vidas, sino que lo convierte en el centro, porque solo con él y a través de él puede sobreabundar la gracia y el amor. Su historia nos enseña que solo la oración y la consagración a Dios pueden ahuyentar el mal y al demonio, cuya misteriosa, pero real, acción con frecuencia opera dentro de la familia para destruirla. Por esto, su caso resulta extremadamente fecundo e inspirador en todo camino nupcial, haciendo natural hablar de dificultades y esfuerzo, pero también de la belleza y alegría de amarse.","En Tobías se puede ver la figura de Wolfgang Langenmantel que, acompañado por su ángel custodio para pedir ayuda a Dios en un momento de dificultad, camina hacia el convento de los Jesuitas, que en el cuadro se sitúa entre el cielo y la tierra, todavía en la oscuridad pero iluminado por la luz de la gracia divina."]},{"titulo":"Origen de la devoción","parrafos":["En 1986, el papa Francisco, siendo todavía un simple sacerdote jesuita, viajó hasta Fráncfort para preparar su tesis doctoral sobre el teólogo Romano Guardini, maestro de dos futuros papas, Pablo VI y Benedicto XVI. Estuvo en Alemania pocos meses y nunca visitó la iglesia de Sankt Peter am Perlach de Augsburgo, donde se custodia el cuadro de la Virgen Desatanudos. Fue una religiosa, que lo conocía bastante, quien le envió una postal en Navidad con la imagen de la Virgen Desatanudos. Cuando la vio se enamoró de ella al instante. Le impresionó, hasta el punto de distribuir algunas reproducciones por Buenos Aires, empezando por los sacerdotes y fieles, encontrando una gran aceptación. Una de las imágenes se expuso en la Universidad de El Salvador; precisamente aquí empezó la difusión de esta nueva devoción.","Designado posteriormente obispo auxiliar de Buenos Aires, el padre Bergoglio consolidó su culto, siguiendo con la inauguración de capillas en su honor y utilizando la estampa de su imagen incluso como tarjeta personal de visita que, junto a la de san José, incluía en su correspondencia. Fue también la imagen que utilizó en el recordatorio del día de su ordenación episcopal.","Monseñor Jorge Bergoglio siguió incansablemente con su obra de propagación de esta devoción, dando su propio Imprimatur a la publicación de la «Oración a María Desatanudos».","En septiembre de 1996, el padre Rodolfo Arroyo, que había sido nombrado pocos meses antes párroco de San José del Talar, decidió llevar la imagen a su iglesia, situada en el centro de Buenos Aires. En menos de tres meses, una artista local, Ana María Betta de Berti, pintó una reproducción del cuadro original alemán y la donó a la parroquia. El cardenal Bergoglio, celebrando la misa en San José del Talar el 8 de diciembre de 2011, declaró la iglesia «Santuario de Nuestra Señora Desatanudos». Desde ese día se celebra su fiesta el 8 de diciembre, y cada día 8 del mes. En 1997 se colocó una reproducción del cuadro en la iglesia de San Juan Bautista. El párroco, padre Juan Ramón Celeiro, viendo el continuo flujo de fieles, decidió escribir una novena para ayudar a rezar a la gente."]},{"titulo":"Significado teológico","parrafos":["La escena descrita en la pintura, y en particular el gesto de María, son ricos en significados teológicos muy profundos, subrayados y sugeridos por Bergoglio, que evocan la primera doctrina mariana que se desarrolló en la Iglesia ya a comienzos del siglo II sobre la contraposición entre María y Eva, derivada de aquella entre Cristo y Adán. Destaca con extraordinario vigor el papel de María junto a Cristo, de gran vigencia en la actual reflexión mariológica.","Esta enseñanza se retomó y sintetizó admirablemente en la Constitución dogmática del Concilio Vaticano II sobre la Iglesia, la Lumen gentium, en especial en el capítulo VIII, en el que se delinea la figura de María y su función en la historia de la salvación. En el número 56 leemos: «El Padre de la misericordia quiso que precediera a la encarnación la aceptación de la Madre predestinada, para que de esta manera, así como la mujer contribuyó a la muerte, también la mujer contribuyese a la vida. [...] Con razón, pues, piensan los Santos Padres que María no fue un instrumento puramente pasivo en las manos de Dios, sino que cooperó a la salvación de los hombres con fe y obediencia libres. Como dice San Ireneo, “obedeciendo, se convirtió en causa de salvación para sí misma y para todo el género humano” (Adversus haereses, III, 22, 4). Por eso no pocos Padres antiguos afirman gustosamente con él en su predicación que “el nudo de la desobediencia de Eva fue desatado por la obediencia de María; que lo atado por la virgen Eva con su incredulidad, fue desatado por la virgen María mediante su fe” (Adversus haereses, III, 22, 4); y comparándola con Eva, llaman a María “Madre de los vivientes” (San Epifanio, Haereses, 78, 18), afirmando aún con mayor frecuencia que “la muerte vino por Eva, la vida por María”».","Como se puede notar fácilmente, la frase de Ireneo: «el nudo de la desobediencia de Eva se solucionó con la obediencia de María; lo que ató la virgen Eva por la incredulidad, la Virgen María lo desató por la fe», explica lo que el cuadro de María Desatanudos quiere comunicar visiblemente. Para comprender mejor esta relación, vale la pena detenerse brevemente en la enseñanza del gran obispo de Lion."]},{"titulo":"La nueva Eva junto al nuevo Adán","parrafos":["En el contexto de la doctrina de la «recapitulación» de todas las cosas en Cristo, Ireneo (130 ca. - 202 ca.) explica el papel de la Virgen en el plan de salvación, recurriendo al paralelismo Eva-María. Fiel a la enseñanza de san Pablo (cfr. Rom 5,12-21), su doctrina de la recapitulación pone en evidencia los dos grandes objetivos alcanzados por Cristo en su obra redentora: un resultado negativo, consistente en la destrucción del pecado y de la muerte, que son las dos principales consecuencias de la desobediencia de Adán; y un resultado positivo, es decir la restauración de todo el género humano según la imagen de Dios destruida por el pecado original. Estos dos resultados los consiguió el nuevo Adán mediante su total obediencia al Padre, compensando de esta manera la desobediencia del primer Adán y reabriendo victoriosamente el antiguo conflicto contra Satanás. Es aquí, en este punto, en el que Ireneo compara a María con Eva, añadiendo un segundo paralelismo que explica mejor el primero, el de Cristo y Adán.","«Como Eva que, teniendo a Adán como marido, era virgen [...] desobedeciendo se convirtió en causa de muerte para sí y para todo el género humano, de igual modo María que, teniendo esposo, era todavía virgen, obedeciendo se convirtió en causa de salvación para sí y para todo el género humano [...]. Por tanto, el proceso de la desobediencia de Eva se solucionó gracias a
